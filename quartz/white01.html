<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白水晶 Clear Quartz | 萬用的癒癒之光 - CrystalMagic</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00acc1;
            --secondary-color: #00838f;
            --text-main: #2c3e50;
            --text-light: #7f8c8d;
            --bg-body: #f4f7f9;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --shadow-soft: 0 10px 30px rgba(0,0,0,0.05);
            --crystal-white: #ffffff;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            color: var(--text-main);
            line-height: 1.8;
            scroll-behavior: smooth;
        }

        /* 導覽列：純淨居中 LOGO */
        .main-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }

        .logo {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--secondary-color);
            text-decoration: none;
            letter-spacing: 3px;
            transition: 0.3s;
        }

        .logo:hover { opacity: 0.7; }

        /* 頂部標題區 */
        .detail-header {
            text-align: center;
            padding: 120px 20px;
            background: linear-gradient(180deg, #ffffff 0%, var(--bg-body) 100%);
        }
        
        .detail-header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: clamp(2.5rem, 8vw, 4.2rem);
            margin-bottom: 20px;
            letter-spacing: 8px;
            background: linear-gradient(to right, #2c3e50, #00acc1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-light);
            font-weight: 300;
            letter-spacing: 2px;
            max-width: 600px;
            margin: 0 auto;
        }

        .stat-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 40px;
        }

        .stat-pill {
            background: white;
            padding: 8px 25px;
            border-radius: 100px;
            font-size: 0.85rem;
            color: var(--secondary-color);
            font-weight: 600;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(0,172,193,0.1);
        }

        /* 內容區塊結構 */
        .content-container {
            max-width: 1000px;
            margin: -40px auto 100px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .content-section {
            background: white;
            padding: 50px;
            border-radius: 30px;
            box-shadow: var(--shadow-soft);
            margin-bottom: 40px;
        }

        .content-section h2 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            margin-bottom: 35px;
            color: var(--text-main);
            border-left: 5px solid var(--primary-color);
            padding-left: 20px;
        }

        /* 雙欄展示 */
        .media-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
            align-items: center;
        }

        .media-img {
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .media-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .media-box:hover .media-img img {
            transform: scale(1.08);
        }

        .media-text h3 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.5rem;
            color: var(--secondary-color);
            margin-top: 0;
        }

        /* 能量網格與卡片內圖片優化 */
        .combo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .combo-card {
            background: #2c3e50;
            color: white;
            padding: 30px;
            border-radius: 20px;
            transition: 0.4s;
            border-bottom: 5px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .combo-card:hover {
            transform: translateY(-10px);
            border-bottom: 5px solid var(--primary-color);
            background: #34495e;
        }

        /* 卡片內的圓形水晶圖 */
        .combo-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .combo-card:hover .combo-img {
            transform: rotate(15deg) scale(1.1);
            border-color: var(--primary-color);
        }

        .tag {
            background: var(--primary-color);
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: inline-block;
            letter-spacing: 1px;
        }

        /* 返回按鈕：左下角浮動 */
        .fixed-back-btn {
            position: fixed;
            bottom: 40px;
            left: 40px;
            background: var(--secondary-color);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 8px 25px rgba(0,131,143,0.3);
            transition: 0.4s;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
