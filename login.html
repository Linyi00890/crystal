<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>會員登入 | CrystalMagic</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f3e5f5; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #6a1b9a; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>登入</h1>
        <form id="loginForm">
            <input type="email" id="email" placeholder="電子郵件" required>
            <input type="password" id="pw" placeholder="密碼" required>
            <button type="submit">開啟連結</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('pw').value;
            const userData = JSON.parse(localStorage.getItem(email));

            if (userData && userData.password === password) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('loggedInUserEmail', email);
                alert('✨ 登入成功！');
                window.location.href = 'index.html';
            } else {
                alert('🔮 資料不匹配，請檢查帳密。');
            }
        });
    </script>
</body>
</html>
