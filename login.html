<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入 | CrystalMagic 水晶魔法</title>
    
    <style>
        :root {
            --primary-purple: #6a1b9a;
            --dark-purple: #4a148c;
            --accent-orange: #ff8a65;
            --glass-white: rgba(255, 255, 255, 0.9);
        }

        /* 全局基礎與動態背景 */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(-45deg, #f3e5f5, #e1f5fe, #fff3e0, #fce4ec);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            flex-direction: column;
            -webkit-user-select: none; /* 禁止選取文字保護內容 */
            user-select: none;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 左下角返回按鈕 - 固定定位 */
        .back-home {
            position: fixed;
            bottom: 30px;
            left: 30px;
            text-decoration: none;
            color: var(--primary-purple);
            font-weight: bold;
            padding: 12px 24px;
            background: var(--glass-white);
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 9999;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .back-home:hover {
            background: var(--primary-purple);
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(106, 27, 154, 0.3);
        }

        /* 登入卡片容器 */
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            background: var(--glass-white);
            backdrop-filter: blur(15px);
            width: 100%;
            max-width: 400px;
            padding: 50px 40px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            box-sizing: border-box;
        }

        .brand-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: block;
        }

        .auth-card h1 {
            color: var(--primary-purple);
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 35px;
            display: block;
        }

        /* 表單元素樣式 */
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 0.85rem;
            padding-left: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #eee;
            border-radius: 14px;
            font-size: 1rem;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.7);
            box-sizing: border-box;
            user-select: text; /* 允許輸入框編輯 */
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 4px rgba(106, 27, 154, 0.1);
            background: #fff;
        }

        .forgot-pass {
            text-align: right;
            margin-top: -15px;
            margin-bottom: 25px;
        }

        .forgot-pass a {
            color: #999;
            font-size: 0.8rem;
            text-decoration: none;
            transition: 0.3s;
        }

        .forgot-pass a:hover {
            color: var(--accent-orange);
        }

        /* 登入按鈕 */
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #7b1fa2, #4a148c);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(74, 20, 140, 0.2);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 12px 25px rgba(74, 20, 140, 0.3);
        }

        /* 跳轉連結 */
        .auth-links {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
            font-size: 0.9rem;
            color: #666;
        }

        .auth-links a {
            color: var(--accent-orange);
            text-decoration: none;
            font-weight: bold;
            margin-left: 5px;
        }

        .auth-links a:hover {
            border-bottom: 1.5px solid var(--accent-orange);
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
            font-size: 0.8rem;
        }

        /* 手機版適應 */
        @media (max-width: 480px) {
            .back-home {
                bottom: 20px;
                left: 20px;
                padding: 10px 18px;
            }
            .auth-card {
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">🏠 返回首頁</a>

    <main class="auth-wrapper">
        <section class="auth-card">
            <span class="brand-icon">🔮</span>
            <h1>歡迎回來</h1>
            <span class="subtitle">連結您的專屬水晶能量</span>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">電子郵件</label>
                    <input type="email" id="email" placeholder="輸入您的 Email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" placeholder="輸入您的密碼" required>
                </div>

                <div class="forgot-pass">
                    <a href="#">忘記密碼？</a>
                </div>
                
                <button type="submit" class="login-btn">開啟連結</button>
            </form>
            
            <div class="auth-links">
                還不是會員？<a href="register.html">探索新能量</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 CrystalMagic. 每一份連結都是宇宙的安排。</p>
    </footer>

    <script>
        // 1. 安全防護：禁用右鍵與開發者工具快捷鍵
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode === 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
               (e.ctrlKey && e.keyCode === 85)) {
                return false;
            }
        };

        // 2. 登入邏輯處理
        function handleLogin(event) {
            event.preventDefault();
            const btn = event.target.querySelector('.login-btn');
            
            btn.innerText = '正在召喚能量...';
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';

            setTimeout(() => {
                alert('登入成功！即將帶領您進入水晶世界。');
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>

</body>
</html>
