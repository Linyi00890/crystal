<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入 | CrystalMagic</title>
    <style>
        :root { --primary-purple: #6a1b9a; --glass-white: rgba(255, 255, 255, 0.9); }
        body { margin: 0; padding: 0; min-height: 100vh; font-family: sans-serif; background: linear-gradient(-45deg, #f3e5f5, #e1f5fe, #fff3e0, #fce4ec); background-size: 400% 400%; animation: gradientBG 15s ease infinite; display: flex; align-items: center; justify-content: center; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .back-home { position: fixed; bottom: 30px; left: 30px; text-decoration: none; color: var(--primary-purple); font-weight: bold; padding: 12px 24px; background: var(--glass-white); border-radius: 50px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .auth-card { background: var(--glass-white); padding: 50px 40px; border-radius: 28px; width: 100%; max-width: 400px; text-align: center; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.8rem; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .login-btn { width: 100%; background: var(--primary-purple); color: white; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">🏠 返回首頁</a>
    <div class="auth-card">
        <h1>歡迎回來</h1>
        <form id="loginForm">
            <div class="form-group"><label>電子郵件</label><input type="email" id="loginEmail" required></div>
            <div class="form-group"><label>密碼</label><input type="password" id="loginPw" required></div>
            <button type="submit" class="login-btn">開啟連結</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPw').value;
            const userData = JSON.parse(localStorage.getItem(email));

            if (userData && userData.password === password) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('loggedInUserEmail', email);
                alert('✨ 登入成功！');
                window.location.href = 'index.html';
            } else {
                alert("🔮 郵件或密碼錯誤。");
            }
        });
    </script>
</body>
</html>
