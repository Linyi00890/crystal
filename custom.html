<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預約客製化諮詢 - 水晶魔法 | CrystalMagic</title>
    <link rel="stylesheet" href="styles.css"> 
    
    <style>

        .page-header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #fffde7 0%, #fff9c4 100%); 
            border-bottom: 5px solid #ff8a65; 
        }

        .custom-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .custom-form-section {
            padding: 40px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .custom-form-section h2 {
            color: #6a1b9a; 
            border-bottom: 3px solid #6a1b9a;
            padding-bottom: 12px;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #4a148c;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #ff8a65;
            box-shadow: 0 0 8px rgba(255,138,101,0.2);
        }
        
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .btn-custom-submit {
            width: 100%;
            background-color: #ff8a65; 
            color: white;
            padding: 16px;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.3s ease;
            box-shadow: 0 5px 15px rgba(255,138,101,0.3);
        }

        .btn-custom-submit:hover {
            background-color: #ff7043;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,138,101,0.4);
        }
        
        .note-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #f3e5f5; 
            border-left: 6px solid #6a1b9a;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #4a148c;
            line-height: 1.6;
        }

        .note-box i {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header class="main-header">
    <a href="index.html" class="logo">🔮 CrystalMagic</div>
    <div class="auth-buttons">
        <a href="index.html" class="nav-button login">回首頁</a>
        <a href="quiz.html" class="nav-button register">能量測驗</a>
    </div>
</header>

<main>
    <section class="page-header">
        <h1>💎 預約客製化諮詢</h1>
        <p>為您量身打造獨一無二的能量飾品。請填寫您的需求，設計師將在 48 小時內聯繫您。</p>
    </section>

    <div class="custom-container">
        <section class="custom-form-section">
            <h2>客製化需求表單</h2>
            
            <form onsubmit="alert('您的客製化需求已收到！我們的設計師會盡快與您聯繫。'); return false;">
                
                <div class="form-group">
                    <label for="name">您的姓名 *</label>
                    <input type="text" id="name" name="name" placeholder="請輸入姓名" required>
                </div>
                
                <div class="form-group">
                    <label for="email">電子郵件 *</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="product_type">客製化產品類型 *</label>
                    <select id="product_type" name="product_type" required>
                        <option value="">請選擇您想要的產品類型</option>
                        <option value="bracelet">能量手鍊 / 手鐲</option>
                        <option value="necklace">開運項鍊 / 吊墜</option>
                        <option value="raw">空間原礦擺件</option>
                        <option value="other">其他 (請在下方詳細說明)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="goal">主要客製化目標 *</label>
                    <input type="text" id="goal" name="goal" placeholder="例如：招正財、提升人緣、情緒穩定" required>
                </div>

                <div class="form-group">
                    <label for="budget">預算範圍 (臺幣)</label>
                    <select id="budget" name="budget">
                        <option value="1000-3000">NT$ 1,000 - 3,000</option>
                        <option value="3000-6000">NT$ 3,000 - 6,000</option>
                        <option value="6000-10000">NT$ 6,000 - 10,000</option>
                        <option value="10000+">NT$ 10,000 以上 (高階訂製)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="details">詳細設計要求與描述 *</label>
                    <textarea id="details" name="details" placeholder="請告訴我們您的手圍尺寸、偏好顏色，或特別在意的水晶品種..." required></textarea>
                </div>
                
                <button type="submit" class="btn-custom-submit">提交客製化需求</button>
            </form>
            
            <div class="note-box">
                <i>✨ 溫馨提醒：</i>
                <p>我們將依據您的目標與預算，提供專業的水晶搭配建議。客製化設計服務包含一次免費調整草圖，後續修改將另行酌收工本費。</p>
            </div>
            
        </section>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 CrystalMagic. 專屬於您的能量管家。</p>
</footer>

    <script>
    // --- 魔法守護腳本 ---
    
    // 1. 禁用右鍵選單並跳出提醒
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        alert("🔮 魔法能量守護中：本站圖文受智慧財產保護，無法使用右鍵選單。");
    }, false);

    // 2. 禁用快捷鍵 (F12, Ctrl+U, Ctrl+Shift+I 等)
    document.onkeydown = function (e) {
        // 禁用 F12
        if (e.keyCode === 123) {
            return false;
        }
        // 禁用 Ctrl+Shift+I (開發者工具)
        if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
            return false;
        }
        // 禁用 Ctrl+Shift+J (開發者工具)
        if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
            return false;
        }
        // 禁用 Ctrl+U (檢視原始碼)
        if (e.ctrlKey && e.keyCode === 85) {
            return false;
        }
        // 禁用 Ctrl+S (存檔)
        if (e.ctrlKey && e.keyCode === 83) {
            return false;
        }
    };
</script>


</body>
</html>
