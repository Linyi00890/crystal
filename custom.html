<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客製化需求諮詢 ｜ 專屬方案</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #5a31a4;
            --accent-gold: #c5a059;
            --bg-light: #eef2f7;
            --white: #ffffff;
            --error-red: #ff4d4f;
            --border-gray: #e0e6ed;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-light);
            color: #333;
            padding: 40px 20px 120px 20px;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: var(--white);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        /* 側邊裝飾條 (參考螢幕擷取畫面 2026-05-13 195230.png 樣式) */
        .container::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 6px;
            background: linear-gradient(to bottom, #ff7e7e, #5a31a4);
        }

        header { margin-bottom: 40px; text-align: left; }
        .step-number {
            background: var(--primary-purple);
            color: white;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-right: 10px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        h2 { font-size: 1.4rem; display: flex; align-items: center; margin-bottom: 20px; color: var(--primary-purple); }

        /* 輸入框樣式 */
        .form-section { margin-bottom: 30px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; margin-bottom: 10px; font-weight: 700; font-size: 0.95rem; }
        label.required::after { content: " *"; color: var(--error-red); }

        input[type="text"], input[type="email"], textarea, select {
            width: 100%; padding: 15px; border: 1px solid var(--border-gray); border-radius: 12px; font-size: 1rem; transition: all 0.3s;
        }
        input:focus, textarea:focus { border-color: var(--primary-purple); outline: none; box-shadow: 0 0 0 3px rgba(90, 49, 164, 0.1); }

        /* 客製化目標 (圖片 Radio 樣式) */
        .goal-options { display: flex; flex-direction: column; gap: 12px; }
        .goal-item { position: relative; }
        .goal-item input { position: absolute; opacity: 0; cursor: pointer; }
        .goal-label {
            display: flex; align-items: center; padding: 18px 24px; background: #fff; border: 1px solid var(--border-gray); border-radius: 15px; cursor: pointer; transition: all 0.3s; font-size: 1.05rem;
        }
        .goal-label::before {
            content: ""; width: 20px; height: 20px; border: 2px solid #ccc; border-radius: 50%; margin-right: 15px;
        }
        .goal-item input:checked + .goal-label { border-color: var(--primary-purple); background: rgba(90, 49, 164, 0.02); }
        .goal-item input:checked + .goal-label::before { border-color: var(--primary-purple); border-width: 6px; }

        /* 預算滑塊 */
        .budget-container { padding: 10px 0; }
        .budget-slider { width: 100%; height: 8px; border-radius: 5px; accent-color: var(--primary-purple); cursor: pointer; }
        .budget-value { text-align: right; font-size: 1.6rem; font-weight: 700; color: var(--primary-purple); margin-top: 10px; min-height: 2.4rem; }

        /* 錯誤驗證 */
        .error input, .error textarea { border-color: var(--error-red) !important; background-color: #fffafb; }
        .error-message { color: var(--error-red); font-size: 0.85rem; margin-top: 6px; display: none; }
        .error .error-message { display: block; }

        /* 底部固定導覽 */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 30px; z-index: 1000;
        }
        .nav-btn {
            text-decoration: none; padding: 12px 24px; border-radius: 50px; font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: none; cursor: pointer;
        }
        .btn-back { background: var(--white); color: #555; }
        .btn-scroll { background: var(--white); color: var(--primary-purple); }
        .btn-submit { background: var(--primary-purple); color: white; width: 100%; padding: 18px; border-radius: 15px; font-size: 1.1rem; border: none; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #452285; transform: translateY(-2px); }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
            .container { padding: 30px 20px; }
            .bottom-nav { padding: 0 15px; }
        }
    </style>
</head>
<body>

<div class="container" id="form-top">
    <header>
        <h2>💎 專屬諮詢需求表單</h2>
        <p style="color: #777;">請填寫以下資訊，讓我們了解您的客製化願景。</p>
    </header>

    <form id="inquiryForm" novalidate>
        
        <!-- 基本資訊 (置於最上方) -->
        <div class="form-section">
            <div class="grid-2">
                <div class="input-unit">
                    <label class="required">您的姓名</label>
                    <input type="text" id="name" placeholder="姓名">
                    <div class="error-message">✕ 請填寫您的姓名</div>
                </div>
                <div class="input-unit">
                    <label class="required">電子郵件</label>
                    <input type="email" id="email" placeholder="example@mail.com">
                    <div class="error-message">✕ 請填寫正確的 Email</div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <label>LINE ID (選填)</label>
            <input type="text" id="lineid" placeholder="方便我們即時與您聯絡">
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 30px;">

        <!-- 1. 客製化目標 (Radio 樣式) -->
        <div class="form-section">
            <label class="required"><h2><span class="step-number">1</span> 客製化目標</h2></label>
            <div class="goal-options">
                <label class="goal-item">
                    <input type="radio" name="goal" value="個人收藏" checked>
                    <span class="goal-label">個人收藏</span>
                </label>
                <label class="goal-item">
                    <input type="radio" name="goal" value="品牌聯名">
                    <span class="goal-label">品牌聯名</span>
                </label>
                <label class="goal-item">
                    <input type="radio" name="goal" value="節慶禮贈">
                    <span class="goal-label">節慶禮贈</span>
                </label>
                <label class="goal-item">
                    <input type="radio" name="goal" value="商業展演">
                    <span class="goal-label">商業展演</span>
                </label>
            </div>
        </div>

        <!-- 2. 預算範圍 (500 ~ 不上限) -->
        <div class="form-section">
            <label><h2><span class="step-number">2</span> 預算範圍 (新臺幣 TWD)</h2></label>
            <div class="budget-container">
                <input type="range" id="budgetRange" class="budget-slider" 
                       min="500" max="100500" step="500" value="5000">
                <div class="budget-value">
                    NT$ <span id="budgetValue">5,000</span>
                </div>
                <p style="font-size: 0.8rem; color: #999; margin-top: 5px;">* 滑動至最右側為「不上限」</p>
            </div>
        </div>

        <!-- 3. 詳細描述 -->
        <div class="form-section">
            <label class="required"><h2><span class="step-number">3</span> 詳細設計要求與描述</h2></label>
            <textarea id="description" rows="5" placeholder="請描述您的設計風格、特殊材質要求或功能細節..."></textarea>
            <div class="error-message">✕ 請提供描述以便我們進行初步評估</div>
        </div>

        <button type="submit" class="btn-submit">確認並送出申請 💎</button>
    </form>
</div>

<!-- 底部導覽 -->
<nav class="bottom-nav">
    <a href="commodity.html" class="nav-btn btn-back">🏠 返回上一頁</a>
    <a href="consult.html" class="nav-btn btn-scroll">📝 預約諮詢表單</a>
</nav>

<script>
    // 預算滑塊邏輯 (500 到 不上限)
    const slider = document.getElementById('budgetRange');
    const output = document.getElementById('budgetValue');

    slider.oninput = function() {
        const val = parseInt(this.value);
        if (val > 100000) {
            output.innerHTML = "不上限";
        } else {
            output.innerHTML = val.toLocaleString();
        }
    }

    // 表單送出與驗證
    const form = document.getElementById('inquiryForm');
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        let isValid = true;

        // 重設錯誤顯示
        document.querySelectorAll('.input-unit, .form-section').forEach(el => el.classList.remove('error'));

        // 1. 姓名驗證
        const name = document.getElementById('name');
        if (name.value.trim() === "") {
            name.parentElement.classList.add('error');
            isValid = false;
        }

        // 2. Email 驗證
        const email = document.getElementById('email');
        const emailRegex = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        if (!email.value.match(emailRegex)) {
            email.parentElement.classList.add('error');
            isValid = false;
        }

        // 3. 描述驗證 (最少需填寫內容)
        const desc = document.getElementById('description');
        if (desc.value.trim().length < 5) {
            desc.parentElement.classList.add('error');
            isValid = false;
        }

        if (isValid) {
            alert("✨ 諮詢表單已成功送出！專員將於 24 小時內聯絡您。");
            // 此處可進行實質的表單數據處理
        } else {
            // 滑動到第一個錯誤位置
            const firstError = document.querySelector('.error');
            firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    });

    
// --- 魔法守護腳本 ---
    
    // 1. 禁用右鍵選單並跳出提醒
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        alert("🔮 魔法能量守護中：本站圖文受智慧財產保護，無法使用右鍵選單。");
    }, false);

    // 2. 禁用快捷鍵 (F12, Ctrl+U, Ctrl+Shift+I 等)
    document.onkeydown = function (e) {
        // 禁用 F12
        if (e.keyCode === 123) {
            return false;
        }
        // 禁用 Ctrl+Shift+I (開發者工具)
        if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
            return false;
        }
        // 禁用 Ctrl+Shift+J (開發者工具)
        if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
            return false;
        }
        // 禁用 Ctrl+U (檢視原始碼)
        if (e.ctrlKey && e.keyCode === 85) {
            return false;
        }
        // 禁用 Ctrl+S (存檔)
        if (e.ctrlKey && e.keyCode === 83) {
            return false;
        }
    };
</script>

</body>
</html>
