<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --gold: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --mystic-purple: #4a148c;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #000000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header { text-align: center; padding: 40px 20px 10px; }
        h1 { 
            background: var(--gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem; letter-spacing: 5px; margin: 0; 
            filter: drop-shadow(0 0 10px rgba(212,175,55,0.5));
        }

        .zodiac-selector {
            margin: 20px 0;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        select {
            padding: 5px 15px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer;
        }

        /* 3D 卡牌舞台 */
        .card-stage {
            perspective: 1500px;
            margin: 20px auto;
            cursor: pointer;
            padding-bottom: 20px;
        }

        .card-inner {
            width: 320px;
            min-height: 520px; /* 改為最小高度，讓它能隨內容增長 */
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-inner.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 25px;
            box-sizing: border-box;
            /* 金色漸層邊框效果 */
            border: 3px solid transparent;
            background-image: linear-gradient(white, white), var(--gold);
            background-origin: border-box;
            background-clip: content-box, border-box;
        }

        /* 卡片背面 */
        .card-back {
            background-image: linear-gradient(#1a1a2e, #1a1a2e), var(--gold);
            display: flex; align-items: center; justify-content: center;
        }
        .card-back::after { content: "✨"; font-size: 80px; filter: drop-shadow(0 0 20px var(--gold-solid)); }

        /* 卡片正面 */
        .card-front {
            background: #fff; color: #333;
            transform: rotateY(180deg);
            padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            height: auto;
            position: relative;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .crystal-img {
            width: 100%; height: 200px; border-radius: 15px;
            object-fit: cover; margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .res-name { font-size: 1.6rem; color: var(--mystic-purple); margin: 0; font-weight: 900; }
        .res-tag { 
            background: var(--mystic-purple); color: #fff; 
            padding: 4px 15px; border-radius: 20px; 
            font-size: 0.8rem; margin: 8px 0; 
        }

        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            width: 100%; margin: 10px 0;
        }
        .info-item {
            background: #f4f4f9; padding: 10px; border-radius: 12px;
            font-size: 0.75rem; color: #666; text-align: center;
        }
        .info-item b { display: block; color: var(--mystic-purple); font-size: 0.85rem; margin-bottom: 2px; }

        .fortune-box {
            background: #fff9ea; border-radius: 15px; padding: 15px;
            margin-top: 5px; font-size: 0.9rem; line-height: 1.6; color: #444;
            border: 1px solid #faedcd; width: 100%; box-sizing: border-box;
        }

        .reset-btn {
            background: var(--gold); border: none; padding: 12px 35px;
            border-radius: 50px; cursor: pointer; font-weight: bold;
            color: #4a148c; margin: 20px 0; display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .nav-container {
            position: fixed; bottom: 20px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box; pointer-events: none;
        }
        .nav-group { display: flex; gap: 10px; pointer-events: auto; }
        .btn {
            padding: 10px 15px; background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(5px); color: #fff;
            text-decoration: none; border-radius: 30px; font-size: 0.75rem;
            border: 1px solid var(--glass-border);
        }

        @media (max-width: 480px) {
            .card-inner { width: 290px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
