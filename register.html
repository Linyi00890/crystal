<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新會員註冊 | CrystalMagic 水晶魔法</title>
    <style>
        :root { --primary-purple: #6a1b9a; --accent-orange: #ff8a65; --glass-white: rgba(255, 255, 255, 0.9); }
        body { margin: 0; padding: 0; min-height: 100vh; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: linear-gradient(-45deg, #f3e5f5, #e1f5fe, #fff3e0, #fce4ec); background-size: 400% 400%; animation: gradientBG 15s ease infinite; display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .back-home { position: fixed; bottom: 30px; left: 30px; text-decoration: none; color: var(--primary-purple); font-weight: bold; padding: 12px 24px; background: var(--glass-white); border-radius: 50px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; z-index: 9999; backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .back-home:hover { background: var(--primary-purple); color: white; transform: translateY(-5px); }
        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px; }
        .auth-card { background: var(--glass-white); backdrop-filter: blur(15px); width: 100%; max-width: 450px; padding: 40px; border-radius: 28px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.4); text-align: center; box-sizing: border-box; }
        h1 { color: var(--primary-purple); font-size: 1.8rem; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; font-size: 0.85rem; }
        .form-group input { width: 100%; padding: 13px 16px; border: 1.5px solid #eee; border-radius: 12px; font-size: 1rem; background: rgba(255, 255, 255, 0.8); box-sizing: border-box; user-select: text; }
        .submit-button { width: 100%; background: linear-gradient(135deg, #ff8a65, #ff5722); color: white; padding: 16px; border: none; border-radius: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .auth-links { margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; font-size: 0.9rem; }
        .auth-links a { color: var(--primary-purple); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">🏠 返回首頁</a>
    <main class="auth-wrapper">
        <section class="auth-card">
            <h1>新會員註冊</h1>
            <form>
                <div class="form-group"><label>使用者名稱</label><input type="text" required></div>
                <div class="form-group"><label>電子郵件</label><input type="email" required></div>
                <div class="form-group"><label>設定密碼</label><input type="password" required minlength="8"></div>
                <div class="form-group"><label>確認密碼</label><input type="password" required minlength="8"></div>
                <button type="submit" class="submit-button">完成召喚並註冊</button>
            </form>
            <div class="auth-links">已經有帳號？<a href="login.html">立即登入</a></div>
        </section>
    </main>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        const inputs = form.querySelectorAll('input');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = inputs[0].value.trim();
            const email = inputs[1].value.trim();
            const password = inputs[2].value;
            const confirmPassword = inputs[3].value;

            if (username.length < 2) { alert("🔮 魔法提醒：使用者名稱太短囉。"); return; }
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (!passwordRegex.test(password)) { alert("🔮 魔法提醒：密碼需包含大小寫字母與數字。"); return; }
            if (password !== confirmPassword) { alert("🔮 魔法提醒：兩次輸入的密碼不一致。"); return; }

            // 儲存資料到 localStorage
            const userData = { username, email, password };
            localStorage.setItem(email, JSON.stringify(userData));

            alert('✨ 召喚成功！請使用此帳號登入。');
            window.location.href = 'login.html';
        });
    });
    // 安全守護
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = e => { if(e.keyCode==123||(e.ctrlKey&&e.shiftKey&&e.keyCode==73)) return false; };
    </script>
</body>
</html>
