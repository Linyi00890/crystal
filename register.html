<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>註冊 | CrystalMagic</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f3e5f5; }
        .card { background: white; padding: 40px; border-radius: 20px; width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff8a65; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>註冊</h1>
        <form id="regForm">
            <input type="text" id="name" placeholder="使用者名稱" required>
            <input type="email" id="email" placeholder="電子郵件" required>
            <input type="password" id="pw" placeholder="密碼" required>
            <button type="submit">完成註冊</button>
        </form>
    </div>
    <script>
        document.getElementById('regForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('pw').value;
            
            localStorage.setItem(email, JSON.stringify({ username, email, password }));
            alert('✨ 註冊成功，請前往登入。');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
