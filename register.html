<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新會員註冊 | CrystalMagic 水晶魔法</title>
    
    <style>
        :root {
            --primary-purple: #6a1b9a;
            --dark-purple: #4a148c;
            --accent-orange: #ff8a65;
            --glass-white: rgba(255, 255, 255, 0.9);
        }

        /* 全局基礎與動態背景 */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(-45deg, #f3e5f5, #e1f5fe, #fff3e0, #fce4ec);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            flex-direction: column;
            -webkit-user-select: none; /* 禁止選取文字保護內容 */
            user-select: none;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 左下角返回按鈕 - 固定定位 */
        .back-home {
            position: fixed;
            bottom: 30px;
            left: 30px;
            text-decoration: none;
            color: var(--primary-purple);
            font-weight: bold;
            padding: 12px 24px;
            background: var(--glass-white);
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 9999;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .back-home:hover {
            background: var(--primary-purple);
            color: white;
            transform: translateY(-5px); /* 向上浮動 */
            box-shadow: 0 12px 25px rgba(106, 27, 154, 0.3);
        }

        /* 註冊卡片容器 */
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .auth-card {
            background: var(--glass-white);
            backdrop-filter: blur(15px);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            box-sizing: border-box;
        }

        .auth-card h1 {
            color: var(--primary-purple);
            font-size: 1.8rem;
            margin-bottom: 25px;
            letter-spacing: 1.5px;
        }

        /* 表單元素樣式 */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 0.85rem;
            padding-left: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #eee;
            border-radius: 14px;
            font-size: 1rem;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.7);
            box-sizing: border-box;
            user-select: text; /* 確保輸入框可以選取與編輯 */
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 4px rgba(106, 27, 154, 0.1);
            background: #fff;
        }

        /* 註冊按鈕 */
        .submit-button {
            width: 100%;
            background: linear-gradient(135deg, #ff8a65, #ff5722);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(255, 138, 101, 0.3);
            margin-top: 10px;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
            box-shadow: 0 12px 25px rgba(255, 138, 101, 0.4);
        }

        /* 隱私聲明 */
        .privacy-note {
            font-size: 0.8rem;
            color: #888;
            margin-top: 20px;
            line-height: 1.6;
        }

        .privacy-note a {
            color: var(--primary-purple);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: 0.3s;
        }

        .privacy-note a:hover {
            border-bottom: 1px solid var(--primary-purple);
        }

        /* 跳轉連結 */
        .auth-links {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
            font-size: 0.95rem;
            color: #666;
        }

        .auth-links a {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
            font-size: 0.8rem;
        }

        /* 手機版適應 */
        @media (max-width: 480px) {
            .back-home {
                bottom: 20px;
                left: 20px;
                padding: 10px 18px;
            }
            .auth-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">🏠 返回首頁</a>

    <main class="auth-wrapper">
        <section class="auth-card">
            <h1>新會員註冊</h1>
            
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="username">使用者名稱</label>
                    <input type="text" id="username" placeholder="請輸入顯示名稱" required>
                </div>
                
                <div class="form-group">
                    <label for="email">電子郵件信箱</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">設定密碼 (至少 8 位)</label>
                    <input type="password" id="password" placeholder="請輸入密碼" required minlength="8">
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">確認密碼</label>
                    <input type="password" id="confirm_password" placeholder="再次確認密碼" required minlength="8">
                </div>
                
                <button type="submit" class="submit-button">完成召喚並註冊</button>
                
                <p class="privacy-note">
                    點擊註冊代表您同意本站的 <a href="#">服務條款</a> 與 <a href="#">隱私權政策</a>。
                </p>
            </form>
            
            <div class="auth-links">
                已經有帳號了？ <a href="login.html">立即登入</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 CrystalMagic. 連結宇宙的神祕能量。</p>
    </footer>

    <script>
        // 1. 安全防護：禁用右鍵與開發者工具快捷鍵
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            // 禁用 F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
            if (e.keyCode === 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
               (e.ctrlKey && e.keyCode === 85)) {
                return false;
            }
        };

        // 2. 註冊邏輯處理
        function handleRegister(event) {
            event.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const btn = event.target.querySelector('.submit-button');

            // 檢查密碼是否一致
            if (password !== confirmPassword) {
                alert('🔮 提示：兩次輸入的密碼不一致，請再確認一次。');
                return;
            }

            // 模擬提交狀態
            btn.innerText = '能量召喚中...';
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';

            setTimeout(() => {
                alert('註冊成功！邀請您登入開啟水晶之旅。');
                window.location.href = 'login.html';
            }, 1500);
        }
    </script>

</body>
</html>
