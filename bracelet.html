<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracelet | 精品水晶飾品</title>
    <style>
        /* 全域樣式 */
        :root {
            --primary-gold: #c5a059;
            --dark-gray: #333;
            --light-gray: #f9f9f9;
            --white: #ffffff;
            --accent-red: #e74c3c;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-gray);
            color: var(--dark-gray);
            user-select: none; /* 禁止選取文字 */
        }

        /* 1. 頂部公告欄 */
        .announcement-bar {
            background-color: var(--dark-gray);
            color: white;
            text-align: center;
            padding: 8px 0;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* 2. 導航導覽與篩選 */
        header {
            background: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .filter-container {
            margin-top: 15px;
        }

        select {
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 0 5px;
            outline: none;
            cursor: pointer;
        }

        /* 3. 商品網格佈局 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            padding: 40px 10%;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease;
            border: 1px solid #eee;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 100%;
            height: 250px;
            background: #eee; /* 預留圖片位置 */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            position: relative;
        }

        /* 熱銷小標題 */
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--accent-red);
            color: white;
            padding: 3px 10px;
            font-size: 12px;
            border-radius: 20px;
        }

        .product-info {
            padding: 15px;
            text-align: center;
        }

        .product-name {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .price {
            color: var(--primary-gold);
            font-size: 18px;
            margin-bottom: 8px;
        }

        .stock-info {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
        }

        /* 按鈕樣式 */
        .btn-group {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .btn-action {
            padding: 8px 12px;
            border: 1px solid var(--dark-gray);
            background: transparent;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }

        .btn-action:hover {
            background: var(--dark-gray);
            color: white;
        }

        /* 4. 右下角懸浮按鈕 */
        .floating-menu {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 999;
        }

        .float-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: var(--white);
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: 0.3s;
        }

        .float-btn:hover {
            background: var(--primary-gold);
            color: white;
        }

        /* 5. 禁止右鍵與代碼保護相關樣式 (隱藏滑鼠指針) */
        /* 這邊僅作為範例，實際體驗通常不隱藏，但可透過JS限制 */
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- 頂部公告 -->
    <div class="announcement-bar">
        ✨ 全館滿 $1,500 免運 | 加入會員首購享 9 折優惠 ✨
    </div>

    <!-- 導覽與篩選 -->
    <header>
        <h1>BRACELET CRYSTAL</h1>
        <div class="filter-container">
            <select id="effect-filter">
                <option value="">選擇功效</option>
                <option value="wealth">招財旺運</option>
                <option value="love">感情桃花</option>
                <option value="peace">辟邪平安</option>
                <option value="health">健康療癒</option>
            </select>
            <select id="color-filter">
                <option value="">選擇水晶顏色</option>
                <option value="pink">粉色系</option>
                <option value="purple">紫色系</option>
                <option value="yellow">黃色系</option>
                <option value="black">黑色系</option>
                <option value="clear">透明系</option>
            </select>
        </div>
    </header>

    <!-- 商品列表 -->
    <main class="product-grid" id="product-display">
        <!-- 商品將由 JavaScript 自動生成 -->
    </main>

    <!-- 右下角懸浮功能 -->
    <div class="floating-menu">
        <button class="float-btn" title="查看收藏">❤️</button>
        <button class="float-btn" title="查看購物車">🛒</button>
    </div>

    <script>
        // 1. 30+ 水晶種類數據
        const crystals = [
            "粉晶", "紫水晶", "黃水晶", "白水晶", "黑曜石", 
            "鈦晶", "金髮晶", "草莓晶", "海藍寶", "月光石",
            "拉長石", "葡萄石", "綠幽靈", "天河石", "金運石",
            "黑尖晶", "藍磷灰", "太陽石", "螢石", "青金石",
            "櫻花瑪瑙", "彼得石", "紅紋石", "摩根石", "紫黃晶",
            "舒俱萊", "紅瑪瑙", "銀曜石", "茶晶", "虎眼石",
            "綠松石", "白松石", "紫龍晶", "彩虹眼曜石", "粉澳寶"
        ];

        const container = document.getElementById('product-display');

        // 2. 自動生成商品卡片
        crystals.forEach((name, index) => {
            const price = Math.floor(Math.random() * (1980 - 390 + 1)) + 390;
            const stock = Math.floor(Math.random() * 15) + 1;
            const badgeText = index % 3 === 0 ? "HOT 熱銷" : (index % 5 === 0 ? "限量" : "");

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                ${badgeText ? `<div class="badge">${badgeText}</div>` : ''}
                <div class="product-image">水晶圖片展示 (ID: ${index+1})</div>
                <div class="product-info">
                    <div class="product-name">天然${name}設計款</div>
                    <div class="price">NT$ ${price}</div>
                    <div class="stock-info">庫存剩餘：${stock} 件</div>
                    <div class="btn-group">
                        <button class="btn-action" onclick="alert('已加入收藏')">收藏</button>
                        <button class="btn-action" onclick="alert('已加入購物車')">加入購物車</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        // 3. 高級防護：禁止右鍵、禁止 F12 檢查
        document.addEventListener('contextmenu', event => event.preventDefault());

        document.onkeydown = function(e) {
            // 禁用 F12
            if (e.keyCode == 123) return false;
            // 禁用 Ctrl+Shift+I (檢查元件)
            if (e.ctrlKey && e.shiftKey && e.keyCode == 73) return false;
            // 禁用 Ctrl+U (檢視原始碼)
            if (e.ctrlKey && e.keyCode == 85) return false;
        };

        // 監測開發者工具是否打開 (簡易混淆)
        setInterval(function() {
            if (window.outerHeight - window.innerHeight > 200 || window.outerWidth - window.innerWidth > 200) {
                document.body.innerHTML = "為了保護原創設計，禁止開啟開發者工具。";
            }
        }, 1000);
    </script>
</body>
</html>
