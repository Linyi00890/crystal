<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRACELET | 奢華晶石設計</title>
    <!-- 引入精品字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --p-gold: #c5a059;
            --p-dark: #1a1a1a;
            --p-soft: #f8f8f8;
            --pink: #fd79a8; --purple: #a29bfe; --yellow: #f1c40f; --black: #2d3436;
            --serif: 'Playfair Display', serif;
            --sans: 'Noto Sans TC', sans-serif;
        }

        /* 0. 加載動畫 */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: 0.8s ease;
        }
        #loader h2 { font-family: var(--serif); letter-spacing: 10px; color: var(--p-gold); animation: pulse 2s infinite; }

        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        body {
            font-family: var(--sans); margin: 0; padding: 0;
            background-color: #fff; color: var(--p-dark);
            line-height: 1.6; user-select: none;
        }

        /* 1. 導航與 Logo */
        .promo-bar {
            background: var(--p-dark); color: #d4af37; text-align: center;
            padding: 10px 0; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
        }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 5%; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid #eee;
        }

        .logo h1 { font-family: var(--serif); font-size: 28px; margin: 0; letter-spacing: 5px; color: var(--p-dark); }
        .logo span { font-size: 9px; letter-spacing: 3px; color: #aaa; text-transform: uppercase; }

        .lang-select {
            border: none; background: transparent; font-size: 12px; cursor: pointer; outline: none; color: #666;
        }

        /* 2. 篩選區 */
        .filter-wrapper {
            padding: 60px 5% 30px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
        }

        .select-container { position: relative; width: 220px; }
        .select-container select {
            width: 100%; padding: 12px 20px; border-radius: 0; border: 1px solid #ddd;
            appearance: none; background: white; font-size: 13px; cursor: pointer;
            transition: 0.3s; font-weight: 300;
        }
        .select-container select:hover { border-color: var(--p-gold); }

        /* 3. 商品格線與卡片 */
        .main-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 50px; padding: 40px 8% 100px;
        }

        .card {
            position: relative; transition: 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            opacity: 0; transform: translateY(40px); /* 初始動畫狀態 */
        }

        .card.show { opacity: 1; transform: translateY(0); }

        .img-holder {
            width: 100%; height: 380px; background: #f9f9f9; overflow: hidden;
            position: relative; margin-bottom: 20px; border: 1px solid #f0f0f0;
        }

        .img-holder img { width: 100%; height: 100%; object-fit: cover; transition: 1s; filter: grayscale(20%); }
        .card:hover .img-holder img { transform: scale(1.08); filter: grayscale(0%); }

        /* 懸浮按鈕 */
        .card-overlay {
            position: absolute; bottom: -50px; left: 0; width: 100%; height: 50px;
            background: var(--p-dark); display: flex; transition: 0.4s;
        }
        .card:hover .card-overlay { bottom: 0; }
        .overlay-btn {
            flex: 1; color: white; border: none; background: transparent;
            font-size: 12px; letter-spacing: 2px; cursor: pointer; transition: 0.3s;
        }
        .overlay-btn:hover { background: var(--p-gold); }
        .overlay-btn:first-child { border-right: 1px solid #333; }

        .card-info { text-align: center; }
        .card-info .mood { font-family: var(--serif); font-style: italic; color: var(--p-gold); font-size: 13px; display: block; margin-bottom: 5px; }
        .card-info h3 { font-family: var(--sans); font-size: 16px; font-weight: 500; margin: 0; letter-spacing: 1px; }
        .card-info .price { font-family: var(--serif); font-size: 18px; margin: 8px 0; color: #444; }
        .card-info .stock { font-size: 10px; color: #ff7675; letter-spacing: 1px; text-transform: uppercase; }

        /* 4. 固定工具 */
        .floating-cart {
            position: fixed; bottom: 40px; right: 40px; z-index: 1000; display: flex; flex-direction: column; gap: 15px;
        }
        .circle-tool {
            width: 55px; height: 55px; background: var(--p-dark); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); cursor: pointer; transition: 0.3s; position: relative;
        }
        .circle-tool:hover { transform: translateY(-5px); background: var(--p-gold); }
        .badge {
            position: absolute; top: -5px; right: -5px; background: #d63031; color: white;
            width: 20px; height: 20px; border-radius: 50%; font-size: 10px; display: none;
            align-items: center; justify-content: center; font-weight: bold;
        }

        /* 色彩選單心形樣式 */
        .opt-heart-pink { color: var(--pink); }
        .opt-heart-purple { color: var(--purple); }
        .opt-heart-yellow { color: var(--yellow); }
        .opt-heart-black { color: var(--black); }
    </style>
</head>
<body>

    <!-- 加載開場 -->
    <div id="loader">
        <h2>BRACELET</h2>
        <p style="font-size: 10px; letter-spacing: 4px; color: #888;">LOADING LUXURY...</p>
    </div>

    <div class="promo-bar" id="txt-promo">✨ Free Shipping on Orders Over NT$ 1,200 ✨</div>

    <nav>
        <div class="logo">
            <h1>BRACELET</h1>
            <span id="txt-sub">Handcrafted Energy Design</span>
        </div>
        <select class="lang-select" id="lang-select" onchange="changeLang(this.value)">
            <option value="zh-TW">繁體中文</option>
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
            <option value="ko">한국어</option>
        </select>
    </nav>

    <section class="filter-wrapper">
        <div class="select-container">
            <select id="sel-effect">
                <option value="" id="opt-eff-default">Energy Effect</option>
                <option value="wealth">💰 Prosperity & Wisdom</option>
                <option value="love">💕 Romance & Relationship</option>
                <option value="peace">🛡️ Shield & Protection</option>
                <option value="heal">🌿 Emotional Balance</option>
            </select>
        </div>
        <div class="select-container">
            <select id="sel-color">
                <option value="" id="opt-col-default">Crystal Color</option>
                <option class="opt-heart-pink" value="pink">💖 Pink Collection</option>
                <option class="opt-heart-purple" value="purple">💜 Purple Collection</option>
                <option class="opt-heart-yellow" value="yellow">🧡 Yellow Collection</option>
                <option class="opt-heart-black" value="black">🖤 Black Collection</option>
            </select>
        </div>
        <div class="select-container">
            <select id="sel-price">
                <option value="" id="opt-pri-default">Price Range</option>
                <option value="1">Entry (Under 1,000)</option>
                <option value="2">Essential (1,000 - 2,000)</option>
                <option value="3">Luxury (Over 2,000)</option>
            </select>
        </div>
    </section>

    <main class="main-grid" id="product-box"></main>

    <div class="floating-cart">
        <div class="circle-tool" onclick="alert('Favorites')">❤️ <div class="badge" id="b-fav">0</div></div>
        <div class="circle-tool" onclick="alert('Shopping Cart')">🛒 <div class="badge" id="b-cart">0</div></div>
    </div>

    <script>
        // 翻譯字典
        const i18n = {
            "zh-TW": { promo: "✨ 全館滿 NT$1,200 免運費 ✨", sub: "天然能量水晶設計", eff_def: "🔮 選擇能量功效...", col_def: "🌈 選擇水晶色系...", pri_def: "💵 選擇價格區間...", btn_f: "收藏", btn_c: "加入購物車", stock_pre: "最後席位", unit: "件" },
            "zh-CN": { promo: "✨ 全馆满 NT$1,200 免运费 ✨", sub: "天然能量水晶设计", eff_def: "🔮 选择能量功效...", col_def: "🌈 选择水晶色系...", pri_def: "💵 选择价格区间...", btn_f: "收藏", btn_c: "加入购物车", stock_pre: "最后席位", unit: "件" },
            "en": { promo: "✨ Free Global Shipping Over $1,200 ✨", sub: "Handcrafted Energy Design", eff_def: "🔮 Choose Effect", col_def: "🌈 Choose Color", pri_def: "💵 Price Range", btn_f: "WISHLIST", btn_c: "ADD TO CART", stock_pre: "ONLY", unit: "LEFT" },
            "ko": { promo: "✨ NT$1,200 이상 구매 시 무료 배송 ✨", sub: "핸드메이드 수정 디자인", eff_def: "🔮 에너지 효과 선택", col_def: "🌈 크리스탈 색상", pri_def: "💵 가격대", btn_f: "위시리스트", btn_c: "장바구니", stock_pre: "마지막", unit: "개" }
        };

        const moodQuotes = {
            pink: "Embrace the frequency of love.",
            purple: "Unveil your inner wisdom.",
            yellow: "Light up your abundance.",
            black: "Shield your sacred space."
        };

        const crystals = [
            {n:"粉晶", c:"pink"}, {n:"紫水晶", c:"purple"}, {n:"黃水晶", c:"yellow"}, {n:"黑曜石", c:"black"},
            {n:"鈦晶", c:"yellow"}, {n:"月光石", c:"pink"}, {n:"海藍寶", c:"purple"}, {n:"草莓晶", c:"pink"},
            {n:"金運石", c:"black"}, {n:"拉長石", c:"black"}, {n:"綠幽靈", c:"yellow"}, {n:"葡萄石", c:"pink"},
            {n:"天河石", c:"purple"}, {n:"青金石", c:"purple"}, {n:"黑尖晶", c:"black"}, {n:"太陽石", c:"yellow"},
            {n:"螢石", c:"purple"}, {n:"櫻花瑪瑙", c:"pink"}, {n:"極光23", c:"purple"}, {n:"摩根石", c:"pink"},
            {n:"紫黃晶", c:"purple"}, {n:"舒俱萊", c:"purple"}, {n:"紅瑪瑙", c:"pink"}, {n:"銀曜石", c:"black"},
            {n:"茶晶", c:"black"}, {n:"虎眼石", c:"yellow"}, {n:"綠松石", c:"purple"}, {n:"白松石", c:"black"},
            {n:"紫龍晶", c:"purple"}, {n:"粉澳寶", c:"pink"}, {n:"金髮晶", c:"yellow"}, {n:"藍磷灰", c:"purple"},
            {n:"彩虹眼曜石", c:"black"}, {n:"白水晶", c:"black"}, {n:"金運石", c:"black"}
        ];

        let curLang = "zh-TW";
        let cCount = 0, fCount = 0;

        function render() {
            const box = document.getElementById('product-box');
            box.innerHTML = "";
            const t = i18n[curLang];

            crystals.forEach((p, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="img-holder">
                        <div style="height:100%; display:flex; align-items:center; justify-content:center; color:#ddd; font-style:italic;">${p.n} Series</div>
                        <div class="card-overlay">
                            <button class="overlay-btn" onclick="update('f')">${t.btn_f}</button>
                            <button class="overlay-btn" onclick="update('c')">${t.btn_c}</button>
                        </div>
                    </div>
                    <div class="card-info">
                        <span class="mood">${moodQuotes[p.c]}</span>
                        <h3>天然 ${p.n} 精品設計</h3>
                        <div class="price">NT$ ${980 + i*40}</div>
                        <span class="stock">${t.stock_pre} ${3 + (i%4)} ${t.unit}</span>
                    </div>
                `;
                box.appendChild(card);
            });

            // 觸發滾動浮現監聽
            scrollReveal();
        }

        function scrollReveal() {
            const cards = document.querySelectorAll('.card');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('show');
                    }
                });
            }, { threshold: 0.1 });
            cards.forEach(card => observer.observe(card));
        }

        function update(type) {
            const badge = type === 'c' ? document.getElementById('b-cart') : document.getElementById('b-fav');
            if (type === 'c') cCount++; else fCount++;
            badge.innerText = type === 'c' ? cCount : fCount;
            badge.style.display = 'flex';
            badge.animate([{ transform: 'scale(1.5)' }, { transform: 'scale(1)' }], { duration: 300 });
        }

        function changeLang(val) {
            curLang = val;
            const t = i18n[val];
            document.getElementById('txt-promo').innerText = t.promo;
            document.getElementById('txt-sub').innerText = t.sub;
            document.getElementById('opt-eff-default').innerText = t.eff_def;
            document.getElementById('opt-col-default').innerText = t.col_def;
            document.getElementById('opt-pri-default').innerText = t.pri_def;
            render();
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 800);
                render();
            }, 1500);
        };

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
