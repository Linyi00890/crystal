<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRACELET | 頂級晶石精品館</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-gold: #c5a059;
            --p-dark: #1a1a1a;
            --p-soft: #f8f8f8;
            --white: #ffffff; --black: #2d3436; --red: #d63031; --orange: #e67e22; 
            --yellow: #f1c40f; --green: #27ae60; --blue: #0984e3; --purple: #6c5ce7; --pink: #fd79a8; --brown: #8d6e63;
            --serif: 'Playfair Display', serif;
            --sans: 'Noto Sans TC', sans-serif;
        }

        body { font-family: var(--sans); margin: 0; background: #fff; color: var(--p-dark); overflow-x: hidden; }
        
        /* 加載動畫 */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.8s; }
        #loader h2 { font-family: var(--serif); letter-spacing: 8px; color: var(--p-gold); }

        /* 導航 */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #eee; }
        .logo h1 { font-family: var(--serif); font-size: 24px; margin: 0; letter-spacing: 4px; }
        .lang-select { border: 1px solid #ddd; padding: 5px; font-size: 12px; cursor: pointer; }

        /* 篩選區 */
        .filter-section { padding: 40px 5% 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .filter-section select { padding: 12px 15px; border: 1px solid #eee; background: white; font-size: 13px; min-width: 180px; cursor: pointer; }

        /* 商品格線 */
        .main-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px; padding: 20px 8% 100px; }
        .card { opacity: 0; transform: translateY(30px); transition: 0.6s ease-out; position: relative; border: 1px solid #f2f2f2; padding: 15px; text-align: center; }
        .card.show { opacity: 1; transform: translateY(0); }
        .card:hover { border-color: var(--p-gold); }
        .img-placeholder { height: 260px; background: #fdfdfd; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; color: #ccc; font-style: italic; font-size: 12px; }
        
        .price { font-family: var(--serif); font-size: 20px; color: var(--p-gold); margin: 10px 0; }
        .btn-group { display: flex; gap: 5px; margin-top: 15px; }
        .btn { flex: 1; padding: 10px; border: none; cursor: pointer; font-size: 12px; transition: 0.3s; letter-spacing: 1px; }
        .btn-f { background: #fdf2f2; color: var(--red); }
        .btn-c { background: var(--p-dark); color: white; }
        .btn:hover { opacity: 0.7; }

        /* 右下懸浮鈕 */
        .floating-tools { position: fixed; bottom: 30px; right: 30px; z-index: 1500; display: flex; flex-direction: column; gap: 15px; }
        .tool-circle { width: 60px; height: 60px; background: var(--p-dark); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2); position: relative; font-size: 22px; transition: 0.3s; }
        .tool-circle:hover { background: var(--p-gold); transform: translateY(-5px); }
        .badge { position: absolute; top: 0; right: 0; background: var(--red); color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 10px; display: none; align-items: center; justify-content: center; }

        /* 購物車側邊欄 */
        #cart-sidebar { position: fixed; top: 0; right: -400px; width: 350px; height: 100%; background: white; z-index: 2000; box-shadow: -10px 0 30px rgba(0,0,0,0.1); transition: 0.4s; padding: 30px; display: flex; flex-direction: column; }
        #cart-sidebar.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .cart-items { flex: 1; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; border-bottom: 1px solid #f9f9f9; padding-bottom: 10px; }
        .checkout-btn { background: var(--p-dark); color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 20px; letter-spacing: 2px; }

        /* 結帳彈窗 */
        #checkout-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 40px; width: 90%; max-width: 500px; position: relative; }
        .modal-content h2 { font-family: var(--serif); border-bottom: 2px solid var(--p-gold); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #666; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        .close-modal { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

    <div id="loader"><h2>BRACELET</h2></div>

    <nav>
        <div class="logo"><h1>BRACELET</h1></div>
        <select class="lang-select" onchange="changeLang(this.value)">
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
            <option value="ko">한국어</option>
        </select>
    </nav>

    <section class="filter-section">
        <select id="sel-eff"><option value="" class="t-eff">🔮 選擇功效</option></select>
        <select id="sel-col">
            <option value="" class="t-col">🌈 選擇顏色</option>
            <option value="white">⚪ 白色系 (White)</option>
            <option value="black">⚫ 黑色系 (Black)</option>
            <option value="red">🔴 紅色系 (Red)</option>
            <option value="yellow">🟡 黃色系 (Yellow)</option>
            <option value="orange">🟠 橘色系 (Orange)</option>
            <option value="green">🟢 綠色系 (Green)</option>
            <option value="blue">🔵 藍色系 (Blue)</option>
            <option value="purple">🟣 紫色系 (Purple)</option>
            <option value="pink">💗 粉色系 (Pink)</option>
            <option value="gold">✨ 金色系 (Gold)</option>
            <option value="brown">🟤 茶色系 (Brown)</option>
        </select>
        <select id="sel-pri"><option value="" class="t-pri">💵 價格區間</option></select>
    </section>

    <main class="main-grid" id="product-box"></main>

    <div class="floating-tools">
        <div class="tool-circle" onclick="alert('已加入我的最愛')">❤️ <div class="badge" id="f-badge">0</div></div>
        <div class="tool-circle" onclick="toggleCart()">🛒 <div class="badge" id="c-badge">0</div></div>
    </div>

    <!-- 購物車抽屜 -->
    <div id="cart-sidebar">
        <div class="cart-header">
            <h3 class="t-cart-title">您的購物車</h3>
            <span style="cursor:pointer" onclick="toggleCart()">✕</span>
        </div>
        <div class="cart-items" id="cart-list"></div>
        <div style="border-top:1px solid #eee; padding-top:20px;">
            <div style="display:flex; justify-content:space-between">
                <span class="t-total">總計</span>
                <span id="cart-total-price">NT$ 0</span>
            </div>
            <button class="checkout-btn t-go-checkout" onclick="openCheckout()">前往結帳</button>
        </div>
    </div>

    <!-- 結帳彈窗 -->
    <div id="checkout-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeCheckout()">✕</span>
            <h2 class="t-checkout-info">結帳資訊</h2>
            <div class="form-group">
                <label class="t-label-name">收件人姓名</label>
                <input type="text" placeholder="Full Name">
            </div>
            <div class="form-group">
                <label class="t-label-phone">聯絡電話</label>
                <input type="tel" placeholder="0912-345-678">
            </div>
            <div class="form-group">
                <label class="t-label-addr">收件地址</label>
                <input type="text" placeholder="Shipping Address">
            </div>
            <button class="checkout-btn t-btn-submit" onclick="confirmOrder()">確認下單</button>
        </div>
    </div>

    <script>
        const i18n = {
            "zh-TW": {
                eff: "🔮 選擇功效", col: "🌈 選擇顏色", pri: "💵 價格區間",
                wealth: "💰 招財事業", love: "💕 桃花人緣", peace: "🛡️ 辟邪平安", heal: "🌿 情緒療癒",
                low: "✨ 1,000 以下", mid: "✨ 1,000 - 2,500", high: "✨ 2,500 以上",
                btn_f: "收藏", btn_c: "加購物車",
                cart_title: "您的購物車", total: "總計", go_checkout: "前往結帳",
                checkout_info: "結帳資訊", label_name: "收件人姓名", label_phone: "聯絡電話", label_addr: "收件地址", btn_submit: "確認下單"
            },
            "en": {
                eff: "🔮 Effect", col: "🌈 Color", pri: "💵 Price",
                wealth: "💰 Fortune", love: "💕 Romance", peace: "🛡️ Protection", heal: "🌿 Healing",
                low: "✨ Under 1,000", mid: "✨ 1,000 - 2,500", high: "✨ Over 2,500",
                btn_f: "WISHLIST", btn_c: "ADD TO CART",
                cart_title: "YOUR CART", total: "Total", go_checkout: "CHECKOUT NOW",
                checkout_info: "Shipping Info", label_name: "Full Name", label_phone: "Phone", label_addr: "Address", btn_submit: "CONFIRM ORDER"
            },
            "ko": {
                eff: "🔮 효과", col: "🌈 색상", pri: "💵 가격",
                wealth: "💰 재물운", love: "💕 연애운", peace: "🛡️ 액운 방지", heal: "🌿 힐링",
                low: "✨ 1,000 이하", mid: "✨ 1,000 - 2,500", high: "✨ 2,500 이상",
                btn_f: "위시리스트", btn_c: "담기",
                cart_title: "장바구니", total: "합계", go_checkout: "결제하기",
                checkout_info: "배송 정보", label_name: "성함", label_phone: "전화번호", label_addr: "주소", btn_submit: "주문하기"
            }
        };

        const products = [
            {n:"白水晶", c:"white", e:"peace", p:880}, {n:"黑曜石", c:"black", e:"peace", p:950}, 
            {n:"南紅瑪瑙", c:"red", e:"heal", p:1200}, {n:"黃水晶", c:"yellow", e:"wealth", p:1500},
            {n:"太陽石", c:"orange", e:"wealth", p:1350}, {n:"綠幽靈", c:"green", e:"wealth", p:2800},
            {n:"海藍寶", c:"blue", e:"heal", p:1800}, {n:"紫水晶", c:"purple", e:"heal", p:1100},
            {n:"粉晶", c:"pink", e:"love", p:850}, {n:"鈦晶", c:"gold", e:"wealth", p:4500},
            {n:"茶晶", c:"brown", e:"peace", p:920}, {n:"拉長石", c:"blue", e:"heal", p:1650},
            {n:"金運石", c:"black", e:"wealth", p:2200}, {n:"紅紋石", c:"red", e:"love", p:3200},
            {n:"白月光", c:"white", e:"love", p:1400}, {n:"草莓晶", c:"pink", e:"love", p:980}
            // (此處可按格式擴充至35種)
        ];

        let curLang = "zh-TW";
        let cart = [];
        let favCount = 0;

        function render() {
            const box = document.getElementById('product-box');
            box.innerHTML = "";
            const t = i18n[curLang];

            products.forEach((pd, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="img-placeholder">${pd.n}</div>
                    <h3 style="font-size:16px;">${pd.n}精品手鍊</h3>
                    <div class="price">NT$ ${pd.p}</div>
                    <div class="btn-group">
                        <button class="btn btn-f" onclick="addFav()">${t.btn_f}</button>
                        <button class="btn btn-c" onclick="addToCart('${pd.n}', ${pd.p})">${t.btn_c}</button>
                    </div>
                `;
                box.appendChild(card);
            });
            setTimeout(reveal, 100);
        }

        function reveal() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(c => {
                const top = c.getBoundingClientRect().top;
                if(top < window.innerHeight - 50) c.classList.add('show');
            });
        }
        window.onscroll = reveal;

        function changeLang(v) {
            curLang = v;
            const t = i18n[v];
            document.querySelector('.t-eff').innerText = t.eff;
            document.querySelector('.t-col').innerText = t.col;
            document.querySelector('.t-pri').innerText = t.pri;
            document.querySelector('.t-cart-title').innerText = t.cart_title;
            document.querySelector('.t-total').innerText = t.total;
            document.querySelector('.t-go-checkout').innerText = t.go_checkout;
            document.querySelector('.t-checkout-info').innerText = t.checkout_info;
            document.querySelector('.t-label-name').innerText = t.label_name;
            document.querySelector('.t-label-phone').innerText = t.label_phone;
            document.querySelector('.t-label-addr').innerText = t.label_addr;
            document.querySelector('.t-btn-submit').innerText = t.btn_submit;

            // 重新載入功效下拉
            const ef = document.getElementById('sel-eff');
            ef.innerHTML = `<option class="t-eff">${t.eff}</option>
                <option value="wealth">${t.wealth}</option><option value="love">${t.love}</option>
                <option value="peace">${t.peace}</option><option value="heal">${t.heal}</option>`;
            
            // 重新載入價格下拉
            const pr = document.getElementById('sel-pri');
            pr.innerHTML = `<option class="t-pri">${t.pri}</option>
                <option value="1">${t.low}</option><option value="2">${t.mid}</option><option value="3">${t.high}</option>`;

            render();
        }

        function addToCart(name, price) {
            cart.push({name, price});
            updateCartUI();
            if(!document.getElementById('cart-sidebar').classList.contains('open')) toggleCart();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            list.innerHTML = "";
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                list.innerHTML += `<div class="cart-item"><span>${item.name}</span><span>NT$ ${item.price}</span></div>`;
            });
            document.getElementById('cart-total-price').innerText = `NT$ ${total}`;
            const badge = document.getElementById('c-badge');
            badge.innerText = cart.length;
            badge.style.display = cart.length > 0 ? 'flex' : 'none';
        }

        function addFav() {
            favCount++;
            const badge = document.getElementById('f-badge');
            badge.innerText = favCount;
            badge.style.display = 'flex';
        }

        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('open'); }
        function openCheckout() { 
            if(cart.length === 0) return alert("購物車是空的");
            document.getElementById('checkout-modal').style.display = 'flex'; 
        }
        function closeCheckout() { document.getElementById('checkout-modal').style.display = 'none'; }
        function confirmOrder() {
            alert("感謝您的訂購！訂單已成功建立，我們將儘速為您出貨。");
            cart = [];
            updateCartUI();
            closeCheckout();
            toggleCart();
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                changeLang('zh-TW');
            }, 1000);
        };
    </script>
</body>
</html>
