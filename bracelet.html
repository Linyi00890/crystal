<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrystalMagic | 專業能量水晶商城</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="bracelet.css">
    <!-- 高級防護：禁止選取與圖片拖拽 -->
    <style>
        body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        img { -webkit-user-drag: none; pointer-events: none; }
        .image-container img { pointer-events: auto; }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false">

<!-- 促銷倒數 -->
<div class="urgent-sale-bar">
    <p>🔥 限時閃購：全館滿額 NT$2,000 享 88 折，剩餘時間：<span id="countdown">08:00:00</span></p>
</div>

<header class="main-header">
    <a href="index.html" class="logo">🔮 CrystalMagic</a>
    <nav class="nav-links">
        <a href="javascript:void(0)" class="nav-button" onclick="openCheckout()"><i class="fas fa-shopping-cart"></i> 結帳清單</a>
        <a href="quiz.html" class="nav-button">能量測驗</a>
    </nav>
</header>

<!-- 浮動購物車 -->
<a href="javascript:void(0)" class="cart-float" id="cartButton" onclick="openCheckout()">
    <i class="fas fa-shopping-bag"></i>
    <span class="cart-count" id="cartCount">0</span>
</a>

<main>
    <section class="hero-banner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="subtitle">PREMIUM CRYSTAL SELECTION</span>
            <h1>喚醒您的內在能量</h1>
            <p>每一顆礦石都承載大地的脈動，尋找專屬於您的頻率。</p>
            <a href="#productGrid" class="shop-now-btn">探索全系列</a>
        </div>
    </section>

    <!-- 美化篩選區 -->
    <section class="filter-wrapper">
        <div class="filter-container">
            <div class="filter-group">
                <i class="fas fa-magic" style="color: var(--gold);"></i>
                <select id="effect-filter">
                    <option value="all">✨ 所有能量功效</option>
                    <option value="love">❤ 人緣桃花</option>
                    <option value="wealth">💰 事業財運</option>
                    <option value="wisdom">🧠 智慧學業</option>
                    <option value="protection">🛡 避邪守護</option>
                    <option value="health">🌿 身心療癒</option>
                </select>
            </div>
            <div class="filter-group">
                <i class="fas fa-palette" style="color: var(--gold);"></i>
                <select id="color-filter">
                    <option value="all">🌈 所有礦石色系</option>
                    <option value="pink">🌸 溫柔粉色</option>
                    <option value="yellow">☀️ 明亮黃色</option>
                    <option value="purple">🔮 神祕紫色</option>
                    <option value="blue">🌊 深邃藍色</option>
                    <option value="green">🍃 療癒綠色</option>
                    <option value="black">🖤 穩重黑色</option>
                    <option value="white">⚪ 純淨白色</option>
                </select>
            </div>
        </div>
    </section>

    <section class="product-grid" id="productGrid"></section>
</main>

<!-- 結算 Modal -->
<div id="checkoutModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <span class="close-modal" onclick="closeCheckout()">&times;</span>
        <h2><i class="fas fa-magic"></i> 您的能量清單</h2>
        <hr style="margin:15px 0; border:0; border-top:1px solid #eee;">
        <div id="checkoutList" style="margin: 20px 0; max-height: 300px; overflow-y: auto;"></div>
        <div id="checkoutTotal" style="font-size: 1.4rem; font-weight: bold; color: var(--sale-red); text-align: right;"></div>
        <button class="btn-modal-add" style="margin-top:20px" onclick="processOrder()">確認結帳並獲取祝福</button>
    </div>
</div>

<!-- 快速預覽 Modal -->
<div id="quickViewModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-body">
            <div class="modal-img-side"><img id="modalImg" src=""></div>
            <div class="modal-info-side">
                <h2 id="modalTitle"></h2>
                <p id="modalDesc" style="margin: 15px 0; color: #666;"></p>
                <div class="modal-price" style="color: var(--sale-red); font-size: 1.8rem; font-weight: bold; margin-bottom: 20px;"></div>
                <button class="btn-modal-add" id="modalAddBtn">加入購物車</button>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="footer-bottom">&copy; 2026 CrystalMagic Crystal Store. All Rights Reserved.</div>
</footer>

<script src="bracelet.js"></script>
</body>
</html>
