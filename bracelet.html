<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRACELET | 頂級珠寶設計</title>
    <!-- 引入極致美感字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&family=Noto+Sans+TC:wght@100;300;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --p-gold: #b38b59; /* 磨砂金 */
            --p-gold-light: #d4af37;
            --p-dark: #121212;
            --bg-soft: #faf9f6; /* 羊皮紙白 */
            --glass: rgba(255, 255, 255, 0.85);
            --serif: 'Cinzel', serif;
            --sans: 'Montserrat', 'Noto Sans TC', sans-serif;
        }

        /* 0. 基礎樣式與滾動條 */
        * { box-sizing: border-box; }
        body { 
            font-family: var(--sans); margin: 0; background: var(--bg-soft); 
            color: var(--p-dark); line-height: 1.6; overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--p-gold); border-radius: 10px; }

        /* 1. 精品開場動畫 */
        #loader { 
            position: fixed; inset: 0; background: #fff; z-index: 10000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: 1s cubic-bezier(0.7, 0, 0.3, 1);
        }
        .loader-logo { font-family: var(--serif); font-size: 32px; letter-spacing: 12px; color: var(--p-gold); animation: logo-fade 2s infinite; }
        @keyframes logo-fade { 0%, 100% { opacity: 0.3; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1); } }

        /* 2. 奢華導航欄 */
        nav { 
            position: sticky; top: 0; z-index: 2000; background: var(--glass);
            backdrop-filter: blur(15px); padding: 15px 5%; border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo h1 { font-family: var(--serif); font-size: 26px; margin: 0; letter-spacing: 6px; color: var(--p-dark); font-weight: 700; }
        .lang-select { border: none; background: transparent; font-size: 11px; letter-spacing: 1px; color: #888; cursor: pointer; text-transform: uppercase; }

        /* 3. 專業篩選面板 */
        .filter-hero { padding: 60px 5% 40px; text-align: center; }
        .filter-hero h2 { font-family: var(--serif); font-weight: 400; letter-spacing: 4px; margin-bottom: 30px; }
        .filter-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .filter-grid select { 
            background: white; border: 1px solid #e0e0e0; padding: 12px 25px; 
            font-size: 12px; letter-spacing: 1px; transition: 0.4s; color: #555;
            appearance: none; min-width: 160px; text-align-last: center;
        }
        .filter-grid select:hover { border-color: var(--p-gold); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        /* 4. 商品卡片升級：微浮雕效果 */
        .main-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 60px; padding: 20px 8% 100px; 
        }
        .card { 
            background: #fff; padding: 0; border: none; overflow: hidden; 
            transition: 0.8s cubic-bezier(0.19, 1, 0.22, 1); position: relative;
            opacity: 0; transform: translateY(40px);
        }
        .card.show { opacity: 1; transform: translateY(0); }
        .card:hover { transform: translateY(-10px); }

        .img-box { 
            width: 100%; height: 380px; background: #fdfdfd; overflow: hidden; position: relative;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 1.2s; filter: contrast(95%); }
        .card:hover .img-box img { transform: scale(1.1); filter: contrast(105%); }

        /* 隱藏按鈕：滑入顯示 */
        .card-actions { 
            position: absolute; bottom: -60px; left: 0; width: 100%; height: 60px;
            display: flex; transition: 0.4s ease;
        }
        .card:hover .card-actions { bottom: 0; }
        .action-btn { 
            flex: 1; border: none; font-size: 11px; letter-spacing: 2px; cursor: pointer; transition: 0.3s;
        }
        .btn-fav { background: #f8f8f8; color: #333; }
        .btn-cart { background: var(--p-dark); color: #fff; }
        .action-btn:hover { background: var(--p-gold); color: #fff; }

        .info-box { padding: 25px 15px; text-align: center; }
        .info-box .tag { font-size: 10px; color: var(--p-gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .info-box h3 { font-size: 17px; font-weight: 400; margin: 10px 0; letter-spacing: 1px; }
        .info-box .price { font-family: var(--serif); font-size: 20px; color: #444; }

        /* 5. 側邊購物車與結帳 */
        .sidebar { 
            position: fixed; top: 0; right: -450px; width: 400px; height: 100%; 
            background: #fff; z-index: 3000; box-shadow: -20px 0 50px rgba(0,0,0,0.1); 
            transition: 0.5s cubic-bezier(0.7, 0, 0.3, 1); padding: 40px; display: flex; flex-direction: column;
        }
        .sidebar.open { right: 0; }
        .side-header { border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .side-header h3 { font-family: var(--serif); letter-spacing: 3px; margin: 0; }
        
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        
        .checkout-bar { border-top: 1px solid #eee; padding-top: 25px; }
        .total-row { display: flex; justify-content: space-between; font-size: 18px; font-family: var(--serif); margin-bottom: 25px; }
        .gold-btn { 
            width: 100%; padding: 18px; background: var(--p-dark); color: white; border: none; 
            letter-spacing: 3px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .gold-btn:hover { background: var(--p-gold); }

        /* 6. 專業結帳彈窗 */
        #checkout-modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 4000; 
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .modal-body { 
            background: #fff; width: 95%; max-width: 600px; padding: 50px; position: relative; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 40px; font-size: 10px; color: #ccc; letter-spacing: 2px; }
        .step-indicator .active { color: var(--p-gold); border-bottom: 1px solid var(--p-gold); padding-bottom: 5px; }
        
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; font-size: 11px; text-transform: uppercase; color: #999; margin-bottom: 8px; letter-spacing: 1px; }
        .input-group input { width: 100%; padding: 15px; border: 1px solid #eee; background: #fafafa; font-family: var(--sans); outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: var(--p-gold); background: #fff; }

        /* 7. 浮動按鈕 */
        .fab-container { position: fixed; bottom: 40px; right: 40px; z-index: 2500; display: flex; flex-direction: column; gap: 20px; }
        .fab { 
            width: 65px; height: 65px; background: #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); cursor: pointer; transition: 0.4s; position: relative;
        }
        .fab:hover { background: var(--p-dark); color: #fff; transform: scale(1.1); }
        .fab .badge { 
            position: absolute; top: -5px; right: -5px; background: var(--p-gold); color: white; 
            width: 22px; height: 22px; border-radius: 50%; font-size: 10px; display: none; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <!-- 開場動畫 -->
    <div id="loader">
        <div class="loader-logo">BRACELET</div>
        <div style="height: 1px; width: 100px; background: #eee; margin-top: 20px;">
            <div id="progress" style="height: 100%; width: 0%; background: var(--p-gold); transition: 0.5s;"></div>
        </div>
    </div>

    <nav>
        <div class="logo"><h1>BRACELET</h1></div>
        <select class="lang-select" onchange="changeLang(this.value)">
            <option value="zh-TW">Traditional Chinese</option>
            <option value="en">English</option>
            <option value="ko">Korean</option>
        </select>
    </nav>

    <header class="filter-hero">
        <h2 id="t-hero-title">COLLECTION</h2>
        <div class="filter-grid">
            <select id="sel-eff"><option class="t-eff">SELECT EFFECT</option></select>
            <select id="sel-col">
                <option class="t-col">CRYSTAL COLOR</option>
                <option value="white">Pure White</option>
                <option value="black">Deep Black</option>
                <option value="red">Passion Red</option>
                <option value="yellow">Golden Yellow</option>
                <option value="orange">Solar Orange</option>
                <option value="green">Nature Green</option>
                <option value="blue">Ocean Blue</option>
                <option value="purple">Royal Purple</option>
                <option value="pink">Soft Pink</option>
                <option value="gold">Luxury Gold</option>
                <option value="brown">Earth Brown</option>
            </select>
            <select id="sel-pri"><option class="t-pri">PRICE RANGE</option></select>
        </div>
    </header>

    <main class="main-grid" id="product-box"></main>

    <div class="fab-container">
        <div class="fab" onclick="alert('Added to Favorites')">♡<div class="badge" id="f-badge">0</div></div>
        <div class="fab" onclick="toggleCart()">🛒<div class="badge" id="c-badge">0</div></div>
    </div>

    <!-- 購物車抽屜 -->
    <div id="cart-sidebar" class="sidebar">
        <div class="side-header">
            <h3 class="t-cart-title">SHOPPING BAG</h3>
            <span style="cursor:pointer; font-size: 24px;" onclick="toggleCart()">✕</span>
        </div>
        <div style="flex:1; overflow-y:auto;" id="cart-list">
            <!-- Items injected by JS -->
        </div>
        <div class="checkout-bar">
            <div class="total-row">
                <span class="t-total">TOTAL</span>
                <span id="cart-total-price">NT$ 0</span>
            </div>
            <button class="gold-btn t-go-checkout" onclick="openCheckout()">PROCEED TO CHECKOUT</button>
        </div>
    </div>

    <!-- 專業結帳彈窗 -->
    <div id="checkout-modal">
        <div class="modal-body">
            <span style="position:absolute; top:30px; right:30px; cursor:pointer;" onclick="closeCheckout()">✕</span>
            <div class="step-indicator">
                <span class="active">01 SHIPPING</span>
                <span>02 PAYMENT</span>
                <span>03 REVIEW</span>
            </div>
            <h2 style="font-family: var(--serif); margin-bottom: 30px;" class="t-checkout-info">Shipping Details</h2>
            <div class="input-group">
                <label class="t-label-name">Full Name</label>
                <input type="text" placeholder="e.g. Alexander Wang">
            </div>
            <div class="input-group">
                <label class="t-label-phone">Phone Number</label>
                <input type="tel" placeholder="+886 912 345 678">
            </div>
            <div class="input-group">
                <label class="t-label-addr">Shipping Address</label>
                <input type="text" placeholder="Street, City, Postal Code">
            </div>
            <button class="gold-btn t-btn-submit" style="margin-top:20px;" onclick="confirmOrder()">PLACE ORDER</button>
        </div>
    </div>

    <script>
        const i18n = {
            "zh-TW": {
                eff: "功效選擇", col: "色系篩選", pri: "價格搜尋",
                wealth: "💰 招財事業 (Fortune)", love: "💕 桃花人緣 (Romance)", peace: "🛡️ 辟邪平安 (Protection)", heal: "🌿 情緒療癒 (Healing)",
                low: "NT$ 1,500 以下", mid: "NT$ 1,500 - 3,000", high: "NT$ 3,000 以上",
                btn_f: "收藏 FAVORITE", btn_c: "加入購物車 ADD TO BAG",
                cart_title: "購物清單", total: "總計金額", go_checkout: "立即前往結帳",
                checkout_info: "配送資訊", label_name: "收件人姓名", label_phone: "聯絡電話", label_addr: "收件地址", btn_submit: "確認並完成下單"
            },
            "en": {
                eff: "SELECT EFFECT", col: "CRYSTAL COLOR", pri: "PRICE RANGE",
                wealth: "💰 Fortune & Wealth", love: "💕 Love & Romance", peace: "🛡️ Protection", heal: "🌿 Soul Healing",
                low: "Under NT$ 1,500", mid: "NT$ 1,500 - 3,000", high: "Over NT$ 3,000",
                btn_f: "FAVORITE", btn_c: "ADD TO BAG",
                cart_title: "SHOPPING BAG", total: "SUBTOTAL", go_checkout: "PROCEED TO CHECKOUT",
                checkout_info: "SHIPPING DETAILS", label_name: "FULL NAME", label_phone: "PHONE", label_addr: "ADDRESS", btn_submit: "PLACE ORDER"
            }
            // 可在此繼續擴充韓國語等
        };

        const products = [
            {n:"金鈦晶", c:"gold", e:"wealth", p:5800, t:"Executive Luxury"},
            {n:"頂級粉晶", c:"pink", e:"love", p:1200, t:"Romantic Energy"},
            {n:"黑曜石", c:"black", e:"peace", p:980, t:"Ultimate Shield"},
            {n:"拉長石", c:"blue", e:"heal", p:2200, t:"Mystic Insight"},
            {n:"月光石", c:"white", e:"love", p:2800, t:"Feminine Grace"},
            {n:"綠幽靈", c:"green", e:"wealth", p:3500, t:"Career Growth"},
            {n:"紫水晶", c:"purple", e:"heal", p:1500, t:"Wisdom & Peace"},
            {n:"紅瑪瑙", c:"red", e:"heal", p:880, t:"Vitality Pulse"}
        ];

        let curLang = "zh-TW";
        let cart = [];
        let fCount = 0;

        function render() {
            const box = document.getElementById('product-box');
            box.innerHTML = "";
            const t = i18n[curLang] || i18n["en"];

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="img-box">
                        <div style="height:100%; display:flex; align-items:center; justify-content:center; color:#eee; font-family:var(--serif); letter-spacing:2px;">${p.n}</div>
                        <div class="card-actions">
                            <button class="action-btn btn-fav" onclick="addFav()">${t.btn_f}</button>
                            <button class="action-btn btn-cart" onclick="addToCart('${p.n}', ${p.p})">${t.btn_c}</button>
                        </div>
                    </div>
                    <div class="info-box">
                        <span class="tag">${p.t}</span>
                        <h3>${p.n} 天然設計手鍊</h3>
                        <div class="price">NT$ ${p.p.toLocaleString()}</div>
                    </div>
                `;
                box.appendChild(card);
            });
            setTimeout(reveal, 200);
        }

        function reveal() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(c => {
                if(c.getBoundingClientRect().top < window.innerHeight - 50) c.classList.add('show');
            });
        }
        window.onscroll = reveal;

        function changeLang(v) {
            curLang = v;
            const t = i18n[v] || i18n["en"];
            document.querySelector('.t-eff').innerText = t.eff;
            document.querySelector('.t-col').innerText = t.col;
            document.querySelector('.t-pri').innerText = t.pri;
            document.querySelector('.t-cart-title').innerText = t.cart_title;
            document.querySelector('.t-total').innerText = t.total;
            document.querySelector('.t-go-checkout').innerText = t.go_checkout;
            
            const ef = document.getElementById('sel-eff');
            ef.innerHTML = `<option>${t.eff}</option>
                <option value="wealth">${t.wealth}</option><option value="love">${t.love}</option>
                <option value="peace">${t.peace}</option><option value="heal">${t.heal}</option>`;
            
            const pr = document.getElementById('sel-pri');
            pr.innerHTML = `<option>${t.pri}</option>
                <option value="1">${t.low}</option><option value="2">${t.mid}</option><option value="3">${t.high}</option>`;

            render();
        }

        function addToCart(name, price) {
            cart.push({name, price});
            updateCartUI();
            if(!document.getElementById('cart-sidebar').classList.contains('open')) toggleCart();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            list.innerHTML = "";
            let total = 0;
            cart.forEach((item, idx) => {
                total += item.price;
                list.innerHTML += `
                    <div class="cart-item">
                        <div style="width:60px; height:60px; background:#f5f5f5;"></div>
                        <div style="flex:1">
                            <div style="font-weight:600; font-size:13px;">${item.name}</div>
                            <div style="color:var(--p-gold); font-size:12px;">NT$ ${item.price.toLocaleString()}</div>
                        </div>
                        <span style="cursor:pointer; color:#ccc;" onclick="removeItem(${idx})">✕</span>
                    </div>
                `;
            });
            document.getElementById('cart-total-price').innerText = `NT$ ${total.toLocaleString()}`;
            document.getElementById('c-badge').innerText = cart.length;
            document.getElementById('c-badge').style.display = cart.length > 0 ? 'flex' : 'none';
        }

        function removeItem(idx) { cart.splice(idx, 1); updateCartUI(); }
        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('open'); }
        function openCheckout() { 
            if(cart.length === 0) return;
            document.getElementById('checkout-modal').style.display = 'flex'; 
        }
        function closeCheckout() { document.getElementById('checkout-modal').style.display = 'none'; }
        function addFav() { 
            fCount++; 
            document.getElementById('f-badge').innerText = fCount; 
            document.getElementById('f-badge').style.display = 'flex';
        }

        function confirmOrder() {
            alert("Order Confirmed! A confirmation email will be sent to you shortly.");
            cart = []; updateCartUI(); closeCheckout(); toggleCart();
        }

        window.onload = () => {
            let p = 0;
            const iv = setInterval(() => {
                p += 10;
                document.getElementById('progress').style.width = p + '%';
                if(p >= 100) {
                    clearInterval(iv);
                    document.getElementById('loader').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loader').style.display = 'none';
                        changeLang('zh-TW');
                    }, 1000);
                }
            }, 100);
        };
    </script>
</body>
</html>
