<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRACELET | 頂級靈魂珠寶設計</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Inter:wght@100;300;400;600&family=Noto+Serif+TC:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #bda67e;
            --dark: #0f0f0f;
            --light-grey: #f9f9f9;
            --transition: cubic-bezier(0.23, 1, 0.32, 1);
            --serif: 'Bodoni Moda', serif;
            --sans: 'Inter', 'Noto Serif TC', sans-serif;
        }

        /* 基礎樣式 */
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: var(--sans); margin: 0; background: #fff; color: var(--dark); overflow-x: hidden; scroll-behavior: smooth; }

        /* 動態能量背景 */
        .aura-container { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
        .aura-blob { 
            position: absolute; width: 60vw; height: 60vw; 
            background: radial-gradient(circle, rgba(189,166,126,0.08) 0%, rgba(255,255,255,0) 70%);
            filter: blur(80px); border-radius: 50%; animation: move 25s infinite alternate; 
        }
        @keyframes move { from { transform: translate(-10%, -10%); } to { transform: translate(30%, 20%); } }

        /* 導航欄 */
        nav { 
            position: fixed; top: 0; width: 100%; z-index: 5000; padding: 25px 5%;
            display: flex; justify-content: space-between; align-items: center;
            transition: 0.5s var(--transition);
        }
        nav.scrolled { background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); padding: 15px 5%; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .logo { font-family: var(--serif); font-size: 28px; letter-spacing: 8px; font-weight: 700; color: inherit; text-decoration: none; }

        /* 品牌故事區塊 */
        .brand-story { padding: 120px 10%; text-align: center; margin-top: 80px; }
        .brand-story h2 { font-family: var(--serif); font-size: clamp(24px, 4vw, 36px); margin-bottom: 30px; font-weight: 400; }
        .brand-story p { max-width: 700px; margin: 0 auto; line-height: 2; letter-spacing: 1px; color: #666; font-weight: 300; }

        /* 商品格線 */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 60px 30px; padding: 50px 8%; }
        .item-card { position: relative; opacity: 0; transform: translateY(30px); transition: 1s var(--transition); }
        .item-card.visible { opacity: 1; transform: translateY(0); }
        .item-image { aspect-ratio: 4/5; background: var(--light-grey); overflow: hidden; position: relative; cursor: pointer; }
        .item-image img { width: 100%; height: 100%; object-fit: cover; transition: 1.2s var(--transition); }
        .item-card:hover .item-image img { transform: scale(1.08); }
        .item-meta { margin-top: 20px; text-align: center; }
        .item-meta h3 { font-family: var(--serif); font-size: 20px; font-weight: 400; margin: 10px 0; }
        .quick-add { 
            position: absolute; bottom: 20px; right: 20px; width: 45px; height: 45px;
            background: var(--dark); color: white; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            opacity: 0; transform: translateY(10px); transition: 0.3s;
        }
        .item-card:hover .quick-add { opacity: 1; transform: translateY(0); }

        /* 購物車與結帳樣式 */
        .cart-drawer { 
            position: fixed; inset: 0 auto 0 100%; width: 100%; max-width: 450px; background: #fff; z-index: 6000;
            box-shadow: -20px 0 50px rgba(0,0,0,0.05); transition: 0.5s var(--transition);
            display: flex; flex-direction: column; padding: 40px;
        }
        .cart-drawer.active { right: 0; }
        
        .checkout-modal { 
            position: fixed; inset: 0; background: #fff; z-index: 7000; 
            display: none; padding: 5vh 8%; overflow-y: auto;
        }
        .checkout-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 80px; max-width: 1200px; margin: 0 auto; }
        
        .method-card { 
            border: 1px solid #eee; padding: 20px; cursor: pointer; transition: 0.3s; border-radius: 4px;
        }
        .method-card.active { border-color: var(--gold); background: #faf8f5; }
        
        .input-box { margin-bottom: 25px; }
        .input-box label { display: block; font-size: 11px; letter-spacing: 1px; color: var(--gold); margin-bottom: 8px; }
        .input-box input, .input-box select { 
            width: 100%; border: none; border-bottom: 1px solid #eee; padding: 12px 0; 
            font-size: 15px; outline: none; transition: 0.3s; background: transparent;
        }
        .input-box input:focus { border-color: var(--dark); }

        .btn-gold { 
            background: var(--dark); color: white; border: none; padding: 20px; 
            letter-spacing: 2px; cursor: pointer; transition: 0.3s; width: 100%;
        }
        .btn-gold:hover { background: var(--gold); }

        .control-dot { 
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; 
            background: var(--dark); color: white; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 4000;
        }
        .badge { position: absolute; top: 0; right: 0; background: var(--gold); font-size: 10px; width: 20px; height: 20px; border-radius: 50%; display: none; align-items: center; justify-content: center; }

        @media (max-width: 768px) {
            .checkout-grid { grid-template-columns: 1fr; }
            .cart-drawer { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="aura-container">
        <div class="aura-blob"></div>
        <div class="aura-blob" style="right:0; bottom:0; animation-delay:-12s;"></div>
    </div>

    <nav id="navbar">
        <a href="#" class="logo">BRACELET</a>
        <div style="font-size: 12px; letter-spacing: 2px;">COLLECTION 2026</div>
    </nav>

    <section class="brand-story">
        <p style="font-size: 11px; color: var(--gold); margin-bottom: 15px; letter-spacing: 3px;">THE ART OF ENERGY</p>
        <h2>每一顆晶石，都在等待它的靈魂主人</h2>
        <p>挑選世界各地最具生命力的天然原礦，透過職人之手注入意念。這不僅是飾品，更是您內在能量的延伸。</p>
    </section>

    <main class="gallery" id="product-gallery"></main>

    <div class="control-dot" onclick="toggleCart()">
        🛒 <div class="badge" id="cart-badge">0</div>
    </div>

    <!-- 購物車抽屜 -->
    <div class="cart-drawer" id="cart-drawer">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
            <h3 style="font-family:var(--serif); font-size:24px; margin:0;">Shopping Bag</h3>
            <span style="cursor:pointer; font-size:12px; letter-spacing:1px;" onclick="toggleCart()">CLOSE</span>
        </div>
        <div id="cart-items-list" style="flex:1; overflow-y:auto;"></div>
        <div style="border-top:1px solid #eee; padding-top:20px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <span>Subtotal</span>
                <span id="drawer-total">NT$ 0</span>
            </div>
            <button class="btn-gold" onclick="openCheckout()">PROCEED TO CHECKOUT</button>
        </div>
    </div>

    <!-- 結帳頁面 -->
    <div class="checkout-modal" id="checkout-modal">
        <div style="margin-bottom:40px;"><span style="cursor:pointer; color:var(--gold); font-size:12px;" onclick="closeCheckout()">← RETURN TO BAG</span></div>
        <div class="checkout-grid">
            <div class="checkout-form">
                <h2 style="font-family:var(--serif); font-size:32px; margin-bottom:40px;">Delivery Details</h2>
                
                <section class="input-box">
                    <label>RECIPIENT NAME</label>
                    <input type="text" id="order-name" placeholder="收件人姓名">
                </section>

                <section class="input-box">
                    <label>PHONE NUMBER</label>
                    <input type="tel" id="order-phone" placeholder="0912-345-678">
                </section>

                <section style="margin-bottom:40px;">
                    <label style="font-size:11px; color:var(--gold); display:block; margin-bottom:15px;">SHIPPING METHOD</label>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                        <div class="method-card" id="m-home" onclick="setDelivery(event, 'home', 100)">
                            <strong>宅急便</strong>
                            <small>NT$ 100</small>
                        </div>
                        <div class="method-card" id="m-store" onclick="setDelivery(event, 'store', 60)">
                            <strong>超商取貨</strong>
                            <small>NT$ 60</small>
                        </div>
                    </div>
                </section>

                <section class="input-box">
                    <label id="addr-label">SHIPPING ADDRESS</label>
                    <input type="text" id="order-addr" placeholder="完整地址或門市名稱">
                </section>

                <section class="input-box">
                    <label>PAYMENT METHOD</label>
                    <select id="pay-method">
                        <option value="credit">信用卡在線支付</option>
                        <option value="transfer">銀行轉帳</option>
                        <option value="cod">貨到付款 (僅限超商)</option>
                    </select>
                </section>

                <button class="btn-gold" style="margin-top:20px;" onclick="confirmPurchase()">COMPLETE ORDER</button>
            </div>

            <div class="checkout-summary" style="background:var(--light-grey); padding:40px; border-radius:8px;">
                <h3 style="font-family:var(--serif); margin-bottom:25px;">Summary</h3>
                <div id="summary-items-list"></div>
                <div style="border-top:1px solid #ddd; margin-top:20px; padding-top:20px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:14px;">
                        <span>Subtotal</span>
                        <span id="sum-subtotal">NT$ 0</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:14px;">
                        <span>Shipping</span>
                        <span id="sum-shipping">NT$ 0</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-weight:700; font-size:18px; margin-top:15px;">
                        <span>TOTAL</span>
                        <span id="sum-total">NT$ 0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "極境墨黑 | 曜石", price: 3200, tag: "ENERGY" },
            { id: 2, name: "月光女神 | 拉長石", price: 4500, tag: "PURE" },
            { id: 3, name: "鈦金之王 | 髮晶", price: 8800, tag: "WEALTH" },
            { id: 4, name: "粉漾初衷 | 芙蓉晶", price: 2800, tag: "LOVE" }
        ];

        let cart = [];
        let shippingFee = 0;
        const FREE_SHIPPING_THRESHOLD = 5000;

        // 初始化商品
        function initGallery() {
            const container = document.getElementById('product-gallery');
            products.forEach(p => {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `
                    <div class="item-image">
                        <div style="height:100%; display:flex; align-items:center; justify-content:center; color:#ccc; font-size:11px; letter-spacing:2px;">PRODUCT_IMAGE</div>
                        <div class="quick-add" onclick="addToCart(${p.id})">+</div>
                    </div>
                    <div class="item-meta">
                        <small style="color:var(--gold); letter-spacing:2px;">${p.tag}</small>
                        <h3>${p.name}</h3>
                        <div style="font-weight:300;">NT$ ${p.price.toLocaleString()}</div>
                    </div>
                `;
                container.appendChild(div);
            });
            
            // 監測滾動動效
            const observer = new IntersectionObserver(entries => {
                entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.item-card').forEach(c => observer.observe(c));
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCart();
            toggleCart(true);
        }

        function updateCart() {
            const drawerList = document.getElementById('cart-items-list');
            const summaryList = document.getElementById('summary-items-list');
            drawerList.innerHTML = ""; summaryList.innerHTML = "";
            
            let subtotal = 0;
            cart.forEach((item, index) => {
                subtotal += item.price;
                const itemHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-size:13px;">
                        <span>${item.name}</span>
                        <span>NT$ ${item.price.toLocaleString()}</span>
                    </div>
                `;
                drawerList.innerHTML += itemHTML;
                summaryList.innerHTML += itemHTML;
            });

            // 免運邏輯
            let currentShipping = (subtotal >= FREE_SHIPPING_THRESHOLD || subtotal === 0) ? 0 : shippingFee;
            
            document.getElementById('drawer-total').innerText = `NT$ ${subtotal.toLocaleString()}`;
            document.getElementById('sum-subtotal').innerText = `NT$ ${subtotal.toLocaleString()}`;
            document.getElementById('sum-shipping').innerText = currentShipping === 0 && subtotal > 0 ? "FREE" : `NT$ ${currentShipping}`;
            document.getElementById('sum-total').innerText = `NT$ ${(subtotal + currentShipping).toLocaleString()}`;
            
            // 徽章
            const badge = document.getElementById('cart-badge');
            badge.innerText = cart.length;
            badge.style.display = cart.length > 0 ? 'flex' : 'none';
        }

        function setDelivery(e, type, fee) {
            shippingFee = fee;
            document.querySelectorAll('.method-card').forEach(c => c.classList.remove('active'));
            e.currentTarget.classList.add('active');
            
            const label = document.getElementById('addr-label');
            const input = document.getElementById('order-addr');
            if(type === 'store') {
                label.innerText = "STORE NAME / NO. (指定超商門市)";
                input.placeholder = "請輸入門市名稱與店號";
            } else {
                label.innerText = "SHIPPING ADDRESS (收件地址)";
                input.placeholder = "請輸入完整收件地址";
            }
            updateCart();
        }

        function toggleCart(open = false) {
            const drawer = document.getElementById('cart-drawer');
            if(open) drawer.classList.add('active');
            else drawer.classList.toggle('active');
        }

        function openCheckout() {
            if(cart.length === 0) { alert("您的購物籃是空的"); return; }
            toggleCart(false);
            document.getElementById('checkout-modal').style.display = 'block';
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        function confirmPurchase() {
            const name = document.getElementById('order-name').value;
            const phone = document.getElementById('order-phone').value;
            const addr = document.getElementById('order-addr').value;

            if(!name || !phone || !addr) {
                alert("請填寫完整的收件資訊以便安排發貨。");
                return;
            }

            alert(`【訂單成立】\n感謝您的信任，${name}。\n我們將盡快將能量晶石送往：${addr}`);
            cart = [];
            updateCart();
            closeCheckout();
        }

        // 滾動效果
        window.onscroll = () => {
            const nav = document.getElementById('navbar');
            if(window.scrollY > 50) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        };

        window.onload = initGallery;
    </script>
</body>
</html>
