<!DOCTYPE html>

<body>

<!-- 導航 -->
<header class="main-header">

<!-- 懸浮購物車按鈕 -->

    <section class="product-grid">
        <!-- 產品 1 -->
        <article class="product-item">

        </article>
        
        <!-- 產品 2 -->
        <article class="product-item">
            <div class="image-container"><img src="picture/yellow02.jpg" alt="黃水晶"></div>

            </div>
        </article>

        <!-- 產品 3 -->
        <article class="product-item">
            <div class="image-container"><img src="picture/purple02.jpg" alt="紫水晶"></div>
            <div class="product-details">
                <h4>智慧之巔：烏拉圭紫晶</h4>
                <p>開發智慧、集中注意力，穩定情緒並提升直覺力。</p>

        <!-- 產品 4 -->
        <article class="product-item">
            <div class="image-container"><img src="picture/white01.jpg" alt="白水晶"></div>
            <div class="product-details">
                <h4>純淨能量：白水晶鑽切</h4>
                <p>水晶之王，淨化磁場、排除負能量，帶來平衡與清晰。</p>

                <button class="btn-add-cart" onclick="addToCart('白水晶手鍊')">加入購物車</button>
