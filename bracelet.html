<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRACELET | 晶石聖殿</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&family=Noto+Serif+TC:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #bda67e; --dark: #0f0f0f; --light: #fcfcfc;
            --transition: cubic-bezier(0.23, 1, 0.32, 1);
            --serif: 'Bodoni Moda', serif; --sans: 'Inter', 'Noto Serif TC', sans-serif;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: var(--sans); margin: 0; background: #fff; color: var(--dark); overflow-x: hidden; }

        /* --- 懸浮按鈕系統 (右下角) --- */
        .sticky-tools {
            position: fixed; right: 30px; bottom: 30px; 
            display: flex; flex-direction: column; gap: 15px; z-index: 9999;
        }
        .sticky-btn {
            width: 60px; height: 60px; background: var(--dark); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: 0.4s var(--transition); position: relative;
        }
        .sticky-btn:hover { transform: scale(1.1) translateY(-5px); background: var(--gold); }
        .sticky-btn .badge {
            position: absolute; top: 0; right: 0; background: #e74c3c; color: white;
            font-size: 10px; width: 20px; height: 20px; border-radius: 50%;
            display: none; align-items: center; justify-content: center; border: 2px solid white;
        }
        .sticky-label {
            position: absolute; right: 75px; background: var(--dark); color: white;
            padding: 5px 12px; font-size: 11px; border-radius: 4px; letter-spacing: 1px;
            opacity: 0; pointer-events: none; transition: 0.3s; white-space: nowrap;
        }
        .sticky-btn:hover .sticky-label { opacity: 1; transform: translateX(-5px); }

        /* --- 頂部 Logo --- */
        nav { position: fixed; top: 0; width: 100%; z-index: 5000; padding: 30px; text-align: center; }
        .logo { font-family: var(--serif); font-size: 28px; letter-spacing: 8px; font-weight: 700; text-decoration: none; color: var(--dark); display: block; }

        /* --- 篩選區 --- */
        .filter-bar { display: flex; justify-content: center; gap: 20px; padding: 120px 0 30px; flex-wrap: wrap; }
        .filter-link { font-size: 11px; letter-spacing: 2px; cursor: pointer; opacity: 0.4; transition: 0.3s; padding: 8px 15px; }
        .filter-link.active { opacity: 1; color: var(--gold); font-weight: 600; }

        /* --- 商品藝廊 --- */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 40px; padding: 0 8% 100px; }
        .item-card { opacity: 0; transform: translateY(30px); transition: 0.8s var(--transition); }
        .item-card.show { opacity: 1; transform: translateY(0); }
        .item-visual { aspect-ratio: 4/5; background: #f9f9f9; overflow: hidden; position: relative; }
        .item-visual img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; transition: 1.2s; }
        .item-card:hover .item-visual img { transform: scale(1.05); opacity: 1; }
        .item-actions { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; opacity: 0; transition: 0.3s; }
        .item-card:hover .item-actions { opacity: 1; transform: translate(-50%, -10px); }
        .action-btn { width: 45px; height: 45px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.3s; font-size: 18px; }
        .action-btn:hover { background: var(--dark); color: white; }

        /* --- 抽屜式選單 --- */
        .drawer { position: fixed; inset: 0 auto 0 100%; width: 100%; max-width: 400px; background: white; z-index: 10000; padding: 40px; transition: 0.5s var(--transition); box-shadow: -20px 0 60px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        .drawer-content { flex: 1; overflow-y: auto; }
        .row-item { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; font-size: 13px; border-bottom: 1px solid #fcfcfc; padding-bottom: 15px; }
        .row-item .img-placeholder { width: 50px; height: 60px; background: #f0f0f0; border-radius: 2px; }

        /* --- 結帳頁面 --- */
        #checkout-screen { position: fixed; inset: 0; background: white; z-index: 11000; display: none; overflow-y: auto; padding: 60px 8%; }
        .checkout-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 80px; max-width: 1200px; margin: 0 auto; }
        .input-group { margin-bottom: 25px; }
        .input-group label { font-size: 10px; letter-spacing: 1px; color: #999; text-transform: uppercase; }
        .input-group input, .input-group select { width: 100%; border: none; border-bottom: 1px solid #eee; padding: 12px 0; outline: none; font-size: 15px; transition: 0.3s; }
        .input-group input:focus { border-color: var(--gold); }
        .btn-pay { background: var(--dark); color: white; border: none; padding: 22px; width: 100%; cursor: pointer; letter-spacing: 3px; font-weight: 600; margin-top: 30px; transition: 0.3s; }
        .btn-pay:hover { background: var(--gold); }

        @media (max-width: 768px) { .checkout-grid { grid-template-columns: 1fr; } .drawer { max-width: 100%; } }
    </style>
</head>
<body>

    <!-- 頂部 LOGO -->
    <nav><a href="#" class="logo">BRACELET</a></nav>

    <!-- 右下角懸浮按鈕 -->
    <div class="sticky-tools">
        <div class="sticky-btn" onclick="toggleDrawer('wishlist')">
            <span class="sticky-label">收藏清單</span>
            ♥ <span id="w-badge" class="badge">0</span>
        </div>
        <div class="sticky-btn" onclick="toggleDrawer('cart')">
            <span class="sticky-label">購物袋</span>
            🛒 <span id="c-badge" class="badge">0</span>
        </div>
    </div>

    <!-- 篩選器 -->
    <div class="filter-bar">
        <span class="filter-link active" onclick="filterGallery('all', this)">ALL ITEMS</span>
        <span class="filter-link" onclick="filterGallery('wealth', this)">財運 WEALTH</span>
        <span class="filter-link" onclick="filterGallery('love', this)">愛情 LOVE</span>
        <span class="filter-link" onclick="filterGallery('peace', this)">守護 PEACE</span>
        <span class="filter-link" onclick="filterGallery('career', this)">事業 CAREER</span>
        <span class="filter-link" onclick="filterGallery('health', this)">健康 HEALTH</span>
    </div>

    <main class="gallery" id="gallery"></main>

    <!-- 收藏夾抽屜 -->
    <div id="wishlist-drawer" class="drawer">
        <div class="drawer-header"><h3 style="font-family:var(--serif)">Wishlist</h3><span onclick="toggleDrawer('wishlist')" style="cursor:pointer; font-size:12px; letter-spacing:1px;">CLOSE</span></div>
        <div id="wishlist-list" class="drawer-content"></div>
    </div>

    <!-- 購物袋抽屜 -->
    <div id="cart-drawer" class="drawer">
        <div class="drawer-header"><h3 style="font-family:var(--serif)">Your Bag</h3><span onclick="toggleDrawer('cart')" style="cursor:pointer; font-size:12px; letter-spacing:1px;">CLOSE</span></div>
        <div id="cart-list" class="drawer-content"></div>
        <div style="padding-top:20px; border-top:1px solid #eee;">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-weight:600;"><span>Subtotal</span><span id="cart-subtotal">NT$ 0</span></div>
            <button class="btn-pay" style="padding:15px; margin-top:0;" onclick="openCheckout()">CHECKOUT NOW</button>
        </div>
    </div>

    <!-- 結帳頁面 -->
    <div id="checkout-screen">
        <div onclick="closeCheckout()" style="cursor:pointer; color:var(--gold); margin-bottom:40px; font-size:12px; letter-spacing:1px;">← CONTINUE SHOPPING</div>
        <div class="checkout-grid">
            <div class="fields">
                <h2 style="font-family:var(--serif); font-size:36px; margin-bottom:10px;">Checkout</h2>
                <p style="color:#888; font-size:13px; margin-bottom:40px;">請填寫以下資訊完成您的訂單</p>
                
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="order-name" placeholder="收件人姓名">
                </div>
                <div class="input-group">
                    <label>Phone</label>
                    <input type="tel" id="order-phone" placeholder="09XX XXX XXX">
                </div>
                <div class="input-group">
                    <label>Shipping Address</label>
                    <input type="text" id="order-addr" placeholder="地址或超商門市名稱">
                </div>
                <div class="input-group">
                    <label>Payment Method</label>
                    <select>
                        <option>信用卡 / 簽帳卡</option>
                        <option>LINE PAY / 街口支付</option>
                        <option>貨到付款</option>
                    </select>
                </div>
                <button class="btn-pay" onclick="processOrder()">PLACE ORDER</button>
            </div>
            
            <div style="background:#fafafa; padding:40px; border-radius:4px; align-self:start;">
                <h4 style="font-family:var(--serif); margin-bottom:20px;">Order Summary</h4>
                <div id="summary-items"></div>
                <div style="border-top:1px solid #eee; margin-top:20px; padding-top:20px;">
                    <div style="display:flex; justify-content:space-between; font-size:18px; font-weight:600;">
                        <span>Total Amount</span>
                        <span id="sum-total">NT$ 0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 擴充至 32 款水晶資料
        const products = [
            { id: 1, name: "極境鈦晶", cat: "wealth", price: 12800, tag: "RARE" },
            { id: 2, name: "舒俱徠石", cat: "health", price: 15000, tag: "ROYAL" },
            { id: 3, name: "超級七", cat: "all", price: 9200, tag: "POWER" },
            { id: 4, name: "彼得石", cat: "career", price: 6800, tag: "STORM" },
            { id: 5, name: "蜜蠟琥珀", cat: "health", price: 8500, tag: "ANCIENT" },
            { id: 6, name: "海藍寶", cat: "peace", price: 4200, tag: "OCEAN" },
            { id: 7, name: "紅紋石", cat: "love", price: 5200, tag: "SWEET" },
            { id: 8, name: "黑曜石", cat: "peace", price: 1800, tag: "SHIELD" },
            { id: 9, name: "綠幽靈", cat: "wealth", price: 7500, tag: "GROWTH" },
            { id: 10, name: "月光石", cat: "love", price: 4800, tag: "MOON" },
            { id: 11, name: "紫水晶", cat: "career", price: 3200, tag: "WISDOM" },
            { id: 12, name: "金髮晶", cat: "wealth", price: 8800, tag: "GOLD" },
            { id: 13, name: "拉長石", cat: "peace", price: 3600, tag: "MAGIC" },
            { id: 14, name: "天河石", cat: "career", price: 2900, tag: "HOPE" },
            { id: 15, name: "草莓晶", cat: "love", price: 2500, tag: "HEART" },
            { id: 16, name: "坦桑石", cat: "all", price: 18000, tag: "LEGEND" },
            { id: 17, name: "太陽石", cat: "wealth", price: 5600, tag: "SUN" },
            { id: 18, name: "藍晶石", cat: "career", price: 4700, tag: "CALM" },
            { id: 19, name: "孔雀石", cat: "health", price: 4500, tag: "HEAL" },
            { id: 20, name: "茶晶", cat: "peace", price: 1500, tag: "GROUND" },
            { id: 21, name: "黃水晶", cat: "wealth", price: 3900, tag: "JOY" },
            { id: 22, name: "青金石", cat: "career", price: 4100, tag: "TRUTH" },
            { id: 23, name: "石榴石", cat: "health", price: 3400, tag: "VITAL" },
            { id: 24, name: "螢石", cat: "career", price: 2400, tag: "FOCUS" },
            { id: 25, name: "摩根石", cat: "love", price: 6200, tag: "SOFT" },
            { id: 26, name: "葡萄石", cat: "health", price: 2800, tag: "PREHN" },
            { id: 27, name: "白水晶", cat: "peace", price: 1200, tag: "PURE" },
            { id: 28, name: "虎眼石", cat: "career", price: 2100, tag: "BRAVE" },
            { id: 29, name: "極光23", cat: "all", price: 11000, tag: "AURA" },
            { id: 30, name: "藍磷灰", cat: "health", price: 3300, tag: "THIN" },
            { id: 31, name: "櫻花瑪瑙", cat: "love", price: 1900, tag: "FLOWER" },
            { id: 32, name: "紅兔毛", cat: "health", price: 5800, tag: "WARM" }
        ];

        let cart = [], wishlist = [];

        function renderGallery(cat = 'all') {
            const container = document.getElementById('gallery');
            container.innerHTML = "";
            const filtered = cat === 'all' ? products : products.filter(p => p.cat === cat || p.cat === 'all');
            
            filtered.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-visual">
                        <div style="height:100%; display:flex; align-items:center; justify-content:center; color:#ddd; font-size:10px; background:#fcfcfc;">IMG_REF_${p.id}</div>
                        <div class="item-actions">
                            <div class="action-btn" onclick="addToWishlist(${p.id})">♥</div>
                            <div class="action-btn" onclick="addToCart(${p.id})">🛒</div>
                        </div>
                    </div>
                    <div style="text-align:center; margin-top:15px;">
                        <small style="color:var(--gold); letter-spacing:2px; font-size:9px;">${p.tag}</small>
                        <h3 style="font-family:var(--serif); font-size:16px; margin:5px 0;">${p.name}</h3>
                        <div style="font-weight:300; font-size:13px; color:#666;">NT$ ${p.price.toLocaleString()}</div>
                    </div>
                `;
                container.appendChild(card);
                setTimeout(() => card.classList.add('show'), index * 30);
            });
        }

        function filterGallery(cat, el) {
            document.querySelectorAll('.filter-link').forEach(l => l.classList.remove('active'));
            el.classList.add('active');
            renderGallery(cat);
        }

        function toggleDrawer(type) { document.getElementById(`${type}-drawer`).classList.toggle('open'); }

        function addToCart(id) {
            cart.push(products.find(p => p.id === id));
            updateUI();
            if(!document.getElementById('cart-drawer').classList.contains('open')) toggleDrawer('cart');
        }

        function addToWishlist(id) {
            if(!wishlist.find(p => p.id === id)) wishlist.push(products.find(p => p.id === id));
            updateUI();
            if(!document.getElementById('wishlist-drawer').classList.contains('open')) toggleDrawer('wishlist');
        }

        function updateUI() {
            const cList = document.getElementById('cart-list'), wList = document.getElementById('wishlist-list'), sItems = document.getElementById('summary-items');
            cList.innerHTML = ""; wList.innerHTML = ""; sItems.innerHTML = "";
            let sub = 0;
            cart.forEach(p => {
                sub += p.price;
                const h = `<div class="row-item"><div class="img-placeholder"></div><div>${p.name}<br><small>NT$ ${p.price.toLocaleString()}</small></div></div>`;
                cList.innerHTML += h; sItems.innerHTML += h;
            });
            wishlist.forEach(p => {
                wList.innerHTML += `<div class="row-item"><div class="img-placeholder"></div><div>${p.name}<br><small onclick="addToCart(${p.id})" style="color:var(--gold);cursor:pointer">ADD TO BAG</small></div></div>`;
            });
            document.getElementById('cart-subtotal').innerText = `NT$ ${sub.toLocaleString()}`;
            document.getElementById('sum-total').innerText = `NT$ ${sub.toLocaleString()}`;
            document.getElementById('c-badge').innerText = cart.length;
            document.getElementById('c-badge').style.display = cart.length > 0 ? 'flex' : 'none';
            document.getElementById('w-badge').innerText = wishlist.length;
            document.getElementById('w-badge').style.display = wishlist.length > 0 ? 'flex' : 'none';
        }

        function openCheckout() { if(cart.length > 0) { document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open')); document.getElementById('checkout-screen').style.display = 'block'; } }
        function closeCheckout() { document.getElementById('checkout-screen').style.display = 'none'; }
        function processOrder() { 
            const name = document.getElementById('order-name').value;
            if(!name) return alert("請填寫收件人姓名");
            alert(`感謝訂購！${name}，您的水晶能量即將啟程。`); 
            cart = []; updateUI(); closeCheckout(); 
        }

        window.onload = () => renderGallery();
    </script>
</body>
</html>
