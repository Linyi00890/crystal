<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrystalLight | 旗艦能量館</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="bracelet.css">
</head>
<body>

<div id="toast-container"></div>

<header class="glass-header">
    <div class="header-container">
        <a href="#" class="brand-logo">CrystalLight</a>
        <div class="header-stats">
            <div class="stat-item" onclick="openWishlist()">
                <i class="fa-regular fa-heart"></i>
                <span id="wishCount">0</span>
            </div>
            <div class="stat-item" onclick="openCheckout()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cartCount">0</span>
            </div>
        </div>
    </div>
</header>

<main>
    <section class="hero-minimal">
        <h1>專屬您的能量場</h1>
        <p>每一顆水晶，都帶著大地的祝福</p>
    </section>

    <!-- 進階美化篩選區 -->
    <section class="filter-area">
        <div class="filter-glass-card">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="尋找水晶力量..." oninput="renderProducts()">
            </div>
            <div class="select-wrapper">
                <select id="effect-filter" onchange="renderProducts()" class="fancy-select effect-sel">
                    <option value="all">能量分類</option>
                    <option value="love">❤ 桃花人緣</option>
                    <option value="wealth">💰 財富事業</option>
                    <option value="wisdom">🧠 靈性智慧</option>
                    <option value="protection">🛡 守護避邪</option>
                </select>
                <select id="color-filter" onchange="renderProducts()" class="fancy-select color-sel">
                    <option value="all">色彩色系</option>
                    <option value="pink">浪漫粉</option>
                    <option value="yellow">活力黃</option>
                    <option value="blue">靜謐藍</option>
                    <option value="black">經典黑</option>
                    <option value="purple">神秘紫</option>
                </select>
            </div>
        </div>
    </section>

    <div class="product-grid" id="productGrid"></div>
</main>

<!-- 全功能模組彈窗 -->
<div id="commonModal" class="modal-overlay">
    <div class="modal-window">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div id="modalContent"></div>
    </div>
</div>

<script src="bracelet.js"></script>
</body>
</html>
