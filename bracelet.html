<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrystalMagic | 頂級能量水晶館</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="bracelet.css">
</head>
<body oncontextmenu="return false" onselectstart="return false">

<!-- 頂部閃購列 -->
<div class="urgent-sale-bar">
    <p>✨ 尊榮禮遇：全館消費滿 NT$5,000 享精品級包裝，結帳輸入「VIP88」享限時優惠</p>
</div>

<!-- 導航欄 -->
<header class="main-header">
    <a href="index.html" class="logo">🔮 CrystalMagic</a>
    <nav class="nav-links">
        <a href="javascript:void(0)" class="nav-button" onclick="openCheckout()">結帳清單</a>
    </nav>
</header>

<!-- 右下角懸浮按鈕組 -->
<div class="float-action-group">
    <a href="javascript:void(0)" class="float-btn wish-float" onclick="openWishlist()">
        <i class="fas fa-heart"></i>
        <span class="count-badge" id="wishCount">0</span>
    </a>
    <a href="javascript:void(0)" class="float-btn cart-float" onclick="openCheckout()">
        <i class="fas fa-shopping-bag"></i>
        <span class="count-badge" id="cartCount">0</span>
    </a>
</div>

<main>
    <!-- 封面圖區塊 -->
    <section class="hero-banner">
        <div class="hero-content">
            <h1>典藏級能量水晶</h1>
            <p>精選全球優質礦源，為您媒合專屬的高頻能量場。</p>
            <a href="#productGrid" class="shop-now-btn">品味全系列</a>
        </div>
    </section>

    <!-- 能量過濾選單 -->
    <section class="filter-wrapper">
        <div class="filter-group">
            <i class="fas fa-magic"></i>
            <select id="effect-filter" onchange="renderProducts()">
                <option value="all">✨ 所有能量鑑定</option>
                <option value="love">❤ 桃花人緣</option>
                <option value="wealth">💰 財富事業</option>
                <option value="wisdom">🧠 靈性智慧</option>
                <option value="protection">🛡 守護避邪</option>
                <option value="health">🌿 身心療癒</option>
            </select>
        </div>
    </section>

    <!-- 商品顯示區 -->
    <section class="product-grid" id="productGrid"></section>
</main>

<!-- 共通 Modal 彈窗 (結帳/預覽/收藏) -->
<div id="commonModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div id="modalBodyContent"></div>
    </div>
</div>

<footer class="footer-bottom">
    &copy; 2026 CrystalMagic Premium Jewelry. 版權所有。
</footer>

<script src="bracelet.js"></script>
</body>
</html>
