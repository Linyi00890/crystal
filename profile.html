<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料管理 | CrystalMagic 水晶魔法</title>
    <style>
        :root {
            --primary-purple: #6a1b9a;
            --glass-white: rgba(255, 255, 255, 0.95);
        }
        body {
            margin: 0; padding: 20px; min-height: 100vh;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(-45deg, #f3e5f5, #e1f5fe, #fff3e0, #fce4ec);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; justify-content: center; align-items: center;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .back-home {
            position: fixed; bottom: 30px; left: 30px;
            text-decoration: none; color: var(--primary-purple);
            font-weight: bold; padding: 12px 24px;
            background: white; border-radius: 50px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: 0.3s; z-index: 100;
        }
        .profile-card {
            background: var(--glass-white);
            padding: 30px; border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            width: 100%; max-width: 500px;
            backdrop-filter: blur(10px);
        }
        h2 { color: var(--primary-purple); text-align: center; margin-bottom: 20px; }
        
        /* 照片上傳區域 */
        .avatar-section { text-align: center; margin-bottom: 20px; position: relative; }
        .avatar-preview {
            width: 120px; height: 120px;
            border-radius: 50%; border: 3px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            object-fit: cover; background: #eee;
        }
        #photo-input { display: none; }
        .photo-label {
            display: none; margin-top: 10px; color: var(--primary-purple);
            font-size: 0.8rem; cursor: pointer; font-weight: bold;
        }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .info-group { margin-bottom: 15px; }
        .full-width { grid-column: span 2; }
        
        label { display: block; font-size: 0.8rem; font-weight: 600; color: #666; margin-bottom: 5px; }
        input {
            width: 100%; padding: 12px; border: 1.5px solid #eee;
            border-radius: 10px; box-sizing: border-box; font-size: 0.9rem;
        }
        input[readonly] { background: #fdfdfd; color: #888; border-color: transparent; }

        .btn-save {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #7b1fa2, #4a148c);
            color: white; font-weight: bold; cursor: pointer;
            margin-top: 20px; display: none;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">🏠 返回首頁</a>

    <div class="profile-card">
        <h2 id="page-title">👤 個人資料確認</h2>
        
        <div class="avatar-section">
            <img src="https://via.placeholder.com/120" id="avatar-img" class="avatar-preview">
            <label for="photo-input" class="photo-label" id="photo-label">📸 更換魔法大頭照</label>
            <input type="file" id="photo-input" accept="image/*">
        </div>

        <form id="profileForm">
            <div class="info-grid">
                <div class="info-group full-width">
                    <label>魔法使姓名</label>
                    <input type="text" id="p-name" readonly>
                </div>
                <div class="info-group full-width">
                    <label>能量地址 (Email - 固定)</label>
                    <input type="email" id="p-email" readonly>
                </div>
                <div class="info-group">
                    <label>聯繫電話</label>
                    <input type="tel" id="p-phone" placeholder="未設定" readonly>
                </div>
                <div class="info-group">
                    <label>LINE ID</label>
                    <input type="text" id="p-line" placeholder="未設定" readonly>
                </div>
                <div class="info-group full-width">
                    <label>重設密碼 (不修改請留空)</label>
                    <input type="password" id="p-pw" placeholder="********" readonly>
                </div>
            </div>
            <button type="submit" id="save-btn" class="btn-save">儲存並同步能量資料</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loggedInEmail = localStorage.getItem('loggedInUserEmail');
            const userData = JSON.parse(localStorage.getItem(loggedInEmail));
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');

            if (!userData) {
                window.location.href = 'login.html';
                return;
            }

            // 填入資料
            document.getElementById('p-name').value = userData.username || "";
            document.getElementById('p-email').value = userData.email || "";
            document.getElementById('p-phone').value = userData.phone || "";
            document.getElementById('p-line').value = userData.lineId || "";
            if (userData.avatar) {
                document.getElementById('avatar-img').src = userData.avatar;
            }

            // 修改模式切換
            if (mode === 'edit') {
                document.getElementById('page-title').innerText = "⚙️ 修改個人資料";
                document.getElementById('photo-label').style.display = "block";
                document.getElementById('save-btn').style.display = "block";
                
                // 解除唯讀
                const fields = ['p-name', 'p-phone', 'p-line', 'p-pw'];
                fields.forEach(id => {
                    document.getElementById(id).readOnly = false;
                    document.getElementById(id).style.borderColor = "#ddd";
                });
            }

            // 照片預覽處理 (轉 Base64)
            const photoInput = document.getElementById('photo-input');
            photoInput.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.getElementById('avatar-img').src = e.target.result;
                    }
                    reader.readAsDataURL(file);
                }
            });

            // 儲存邏輯
            document.getElementById('profileForm').addEventListener('submit', function(e) {
                e.preventDefault();

                // 更新物件
                userData.username = document.getElementById('p-name').value;
                userData.phone = document.getElementById('p-phone').value;
                userData.lineId = document.getElementById('p-line').value;
                userData.avatar = document.getElementById('avatar-img').src;

                const newPw = document.getElementById('p-pw').value;
                if (newPw) {
                    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
                    if (!passwordRegex.test(newPw)) {
                        alert("🔮 密碼需包含大小寫字母與數字，且至少 8 位。");
                        return;
                    }
                    userData.password = newPw;
                }

                // 同步回 localStorage
                localStorage.setItem(loggedInEmail, JSON.stringify(userData));
                alert("✨ 個人資料已成功同步更新！");
                window.location.href = 'index.html';
            });
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
