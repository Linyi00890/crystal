<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>個人資料 | CrystalMagic</title>
    <style>
        body { font-family: sans-serif; background: #f3e5f5; display: flex; justify-content: center; padding: 50px; }
        .card { background: white; padding: 40px; border-radius: 20px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .info-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-home { display: inline-block; margin-top: 20px; text-decoration: none; color: #6a1b9a; font-weight: bold; }
        #saveBtn { display: none; width: 100%; padding: 12px; background: #6a1b9a; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="title">個人資料確認</h2>
        <form id="profileForm">
            <div class="info-group"><label>名稱</label><input type="text" id="p-name" readonly></div>
            <div class="info-group"><label>Email</label><input type="email" id="p-email" readonly></div>
            <div class="info-group"><label>密碼 (修改時輸入)</label><input type="password" id="p-pw" placeholder="********"></div>
            <button type="submit" id="saveBtn">儲存修改</button>
        </form>
        <a href="index.html" class="btn-home">🏠 返回首頁</a>
    </div>
    <script>
        const userEmail = localStorage.getItem('loggedInUserEmail');
        const userData = JSON.parse(localStorage.getItem(userEmail));
        const mode = new URLSearchParams(window.location.search).get('mode');

        if (!userData) window.location.href = 'login.html';

        document.getElementById('p-name').value = userData.username;
        document.getElementById('p-email').value = userData.email;

        if (mode === 'edit') {
            document.getElementById('title').innerText = "⚙️ 修改資料";
            document.getElementById('p-name').readOnly = false;
            document.getElementById('saveBtn').style.display = "block";
        }

        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            userData.username = document.getElementById('p-name').value;
            const newPw = document.getElementById('p-pw').value;
            if (newPw) userData.password = newPw;
            localStorage.setItem(userEmail, JSON.stringify(userData));
            alert("✨ 更新成功！");
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
