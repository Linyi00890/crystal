<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 尊榮客製化諮詢預約</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a5f7a;
            --accent-color: #c7a44a;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 左側邊欄：資訊介紹 */
        .info-panel {
            background: var(--primary-color);
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-panel h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .info-panel p {
            font-weight: 300;
            line-height: 1.8;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .feature-list {
            list-style: none;
        }

        .feature-list li {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .feature-list li::before {
            content: '✦';
            margin-right: 10px;
            color: var(--accent-color);
        }

        /* 右側邊欄：預約表單 */
        .form-panel {
            padding: 40px;
            background: white;
        }

        h2 {
            margin-bottom: 25px;
            color: var(--primary-color);
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(26, 95, 122, 0.1);
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #13465a;
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* 成功提示框 */
        #success-msg {
            display: none;
            text-align: center;
            padding: 20px;
            color: #2d5a27;
            background: #e8f5e9;
            border-radius: 8px;
            margin-top: 20px;
        }

        /* 手機版適配 */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .info-panel {
                padding: 30px;
                text-align: center;
            }
            .feature-list {
                display: none; /* 手機版簡化內容 */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左側：品牌資訊 -->
    <div class="info-panel">
        <h1>Bespoke Consulting</h1>
        <p>每一顆原石都值得被精心雕琢。開啟您的專屬對話，讓我們為您量身打造未來的藍圖。</p>
        <ul class="feature-list">
            <li>一對一深度需求分析</li>
            <li>資深顧問專業建議</li>
            <li>全程隱私保護協議</li>
            <li>客製化解決方案報告</li>
        </ul>
    </div>

    <!-- 右側：預約表單 -->
    <div class="form-panel">
        <h2>預約您的諮詢時段</h2>
        <form id="bookingForm">
            <div class="form-group">
                <label for="name">您的姓名</label>
                <input type="text" id="name" placeholder="例如：王小明" required>
            </div>

            <div class="form-group">
                <label for="email">電子郵件</label>
                <input type="email" id="email" placeholder="service@example.com" required>
            </div>

            <div class="form-group">
                <label for="service">諮詢項目</label>
                <select id="service" required>
                    <option value="" disabled selected>請選擇諮詢類別</option>
                    <option value="business">商業戰略諮詢</option>
                    <option value="branding">品牌設計規劃</option>
                    <option value="tech">技術轉型指導</option>
                    <option value="other">其他客製化需求</option>
                </select>
            </div>

            <div class="grid-row">
                <div class="form-group">
                    <label for="date">預約日期</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="time">時段選擇</label>
                    <select id="time" required>
                        <option value="morning">上午 09:00 - 12:00</option>
                        <option value="afternoon">下午 14:00 - 17:00</option>
                        <option value="evening">晚間 19:00 - 21:00</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="message">簡述您的需求（選填）</label>
                <textarea id="message" rows="3" placeholder="讓我們能更精確地準備資料..."></textarea>
            </div>

            <button type="submit" class="submit-btn">確認預約 💎</button>
        </form>

        <div id="success-msg">
            ✨ 預約申請已送出！我們將於 24 小時內聯絡您。
        </div>
    </div>
</div>

    <nav class="bottom-nav">
    <a href="commodity.html" class="nav-btn btn-back">🏠 返回上一頁</a>
    <a href="custom.html" class="nav-btn btn-scroll">📝 預約諮詢表單</a>
</nav>

<script>
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 防止頁面重新載入
        
        const submitBtn = document.querySelector('.submit-btn');
        const successMsg = document.getElementById('success-msg');
        
        // 模擬發送過程
        submitBtn.innerText = '處理中...';
        submitBtn.style.opacity = '0.7';
        submitBtn.disabled = true;

        setTimeout(() => {
            // 隱藏表單，顯示成功訊息
            document.getElementById('bookingForm').style.display = 'none';
            successMsg.style.display = 'block';
            
            // 這裡可以加入 API 發送邏輯 (fetch/axios)
            console.log("預約資料已記錄");
        }, 1500);
    });

    // 限制日期選擇不能選擇今天以前
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date').setAttribute('min', today);


    
// --- 魔法守護腳本 ---
    
    // 1. 禁用右鍵選單並跳出提醒
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        alert("🔮 魔法能量守護中：本站圖文受智慧財產保護，無法使用右鍵選單。");
    }, false);

    // 2. 禁用快捷鍵 (F12, Ctrl+U, Ctrl+Shift+I 等)
    document.onkeydown = function (e) {
        // 禁用 F12
        if (e.keyCode === 123) {
            return false;
        }
        // 禁用 Ctrl+Shift+I (開發者工具)
        if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
            return false;
        }
        // 禁用 Ctrl+Shift+J (開發者工具)
        if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
            return false;
        }
        // 禁用 Ctrl+U (檢視原始碼)
        if (e.ctrlKey && e.keyCode === 85) {
            return false;
        }
        // 禁用 Ctrl+S (存檔)
        if (e.ctrlKey && e.keyCode === 83) {
            return false;
        }
    };
</script>

</body>
</html>
