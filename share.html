<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能量分享專區 - CrystalMagic 水晶魔法</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #7b1fa2;
            --secondary-purple: #9c27b0;
            --light-purple: #f3e5f5;
            --text-dark: #2c3e50;
            --text-gray: #7f8c8d;
            --bg-light: #fcfaff;
            --accent-gold: #ffc107;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(123, 31, 162, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-light);
            background-image: radial-gradient(#e1bee7 0.5px, transparent 0.5px);
            background-size: 20px 20px; /* 細微的底紋背景 */
            color: var(--text-dark);
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* --- 導覽列 --- */
        .navbar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            padding: 0 5%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { 
            font-size: 1.6rem; 
            font-weight: 700; 
            color: var(--primary-purple); 
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-links a { 
            text-decoration: none; 
            color: var(--text-dark); 
            margin-left: 25px; 
            font-weight: 500; 
            transition: var(--transition);
            position: relative;
            padding: 5px 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-purple);
            transition: var(--transition);
        }

        .nav-links a:hover { color: var(--primary-purple); }
        .nav-links a:hover::after { width: 100%; }

        /* --- 主內容 --- */
        .feedback-section {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 25px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-size: 2.6rem;
            color: var(--primary-purple);
            margin-bottom: 15px;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary-purple), var(--secondary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title p { 
            color: var(--text-gray); 
            font-size: 1.1rem; 
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- 彈性佈局 --- */
        .feedback-flex-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        /* --- 見證卡片 --- */
        .testimonial-card {
            background: var(--white);
            border-radius: 24px;
            padding: 35px;
            box-shadow: var(--shadow);
            flex: 1;
            min-width: 320px;
            max-width: 380px;
            transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.8);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .testimonial-card:hover { 
            transform: translateY(-12px); 
            box-shadow: 0 20px 40px rgba(123, 31, 162, 0.12);
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .user-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin-right: 18px;
            object-fit: cover;
            border: 3px solid var(--light-purple);
            padding: 2px;
        }

        .user-info h4 { font-size: 1.15rem; color: var(--text-dark); margin-bottom: 4px; }
        .stars { color: var(--accent-gold); font-size: 0.85rem; letter-spacing: 2px; }

        .testimonial-text {
            color: var(--text-dark);
            margin-bottom: 25px;
            line-height: 1.8;
            position: relative;
            padding-top: 10px;
            flex-grow: 1;
        }

        /* 裝飾性引號 */
        .testimonial-text::before {
            content: "“";
            font-family: serif;
            font-size: 4rem;
            color: var(--light-purple);
            position: absolute;
            top: -20px;
            left: -15px;
            z-index: -1;
        }

        .review-photo {
            width: 100%;
            height: 220px;
            border-radius: 16px;
            object-fit: cover;
            transition: var(--transition);
            cursor: zoom-in;
        }

        .review-photo:hover { opacity: 0.9; }

        /* --- 投稿專區卡片 --- */
        .contribution-card {
            background: var(--white);
            border-radius: 24px;
            padding: 35px;
            box-shadow: var(--shadow);
            flex: 1;
            min-width: 320px;
            max-width: 380px;
            border: 2px dashed #ce93d8;
            background: linear-gradient(to bottom right, #ffffff, #faf5ff);
        }

        .contribution-header h3 { 
            color: var(--primary-purple); 
            font-size: 1.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contribution-header p { 
            color: var(--text-gray); 
            font-size: 0.9rem; 
            margin-bottom: 30px; 
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            font-size: 0.9rem; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: var(--primary-purple); 
        }
        
        .form-group input[type="text"], 
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #eee;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
            background-color: var(--white);
        }

        .form-group input:focus, .form-group textarea:focus { 
            border-color: var(--primary-purple); 
            box-shadow: 0 0 0 4px var(--light-purple);
            outline: none;
        }

        .file-input-wrapper {
            position: relative;
            margin-top: 5px;
        }

        .submit-story-btn {
            width: 100%;
            background: linear-gradient(45deg, var(--primary-purple), var(--secondary-purple));
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(123, 31, 162, 0.3);
            margin-top: 10px;
        }

        .submit-story-btn:hover { 
            transform: scale(1.03); 
            box-shadow: 0 6px 20px rgba(123, 31, 162, 0.4);
        }

        /* --- 頁尾 --- */
        footer { 
            text-align: center; 
            padding: 60px 20px; 
            color: var(--text-gray); 
            font-size: 0.95rem; 
            border-top: 1px solid #eee;
            margin-top: 50px;
        }

        /* --- 響應式佈局 --- */
        @media (max-width: 768px) {
            .navbar { height: 70px; padding: 0 20px; }
            .section-title h2 { font-size: 2rem; }
            .feedback-flex-container { flex-direction: column; align-items: center; }
            .testimonial-card, .contribution-card { max-width: 100%; width: 100%; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">🔮 CrystalMagic</a>
    <div class="nav-links">
        <a href="index.html">首頁</a>
        <a href="exclusive.html">專屬商品</a>
        <a href="share.html" style="color:var(--primary-purple)">能量分享</a>
    </div>
</nav>

<main>
    <section class="feedback-section">
        <div class="section-title">
            <h2>來自心靈的真實回饋</h2>
            <p>每一顆水晶都承載著一段獨特的故事，與我們分享你的感悟，讓正向能量在字裡行間流動。</p>
        </div>
        
        <div class="feedback-flex-container">
            <div class="testimonial-card">
                <div class="user-info">
                    <img src="picture/king01.jpg" alt="王小姐" class="user-avatar" onerror="this.src='https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&q=80'">
                    <div>
                        <h4>王小姐</h4>
                        <div class="stars">★★★★★</div>
                    </div>
                </div>
                <p class="testimonial-text">「自從在臥室擺放了紫水晶簇，感覺睡眠品質變好了，原本紛亂的心情也平靜許多，能量真的很神奇。」</p>
                <img src="picture/purple04.jpg" alt="實拍回饋" class="review-photo" onerror="this.src='https://images.unsplash.com/photo-1567883110217-d39ec2131d2e?w=500&q=80'">
            </div>

            <div class="testimonial-card">
                <div class="user-info">
                    <img src="picture/lin01.jpg" alt="林先生" class="user-avatar" onerror="this.src='https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&q=80'">
                    <div>
                        <h4>林先生</h4>
                        <div class="stars">★★★★★</div>
                    </div>
                </div>
                <p class="testimonial-text">「買給女友的粉晶手鍊設計非常細緻，完全不像傳統水晶那樣沉重，非常時尚！她每天都戴著，人緣也變好了。」</p>
                <img src="picture/pink03.jpg" alt="實拍回饋" class="review-photo" onerror="this.src='https://images.unsplash.com/photo-1515401104819-55f17d27993a?w=500&q=80'">
            </div>

            <div class="contribution-card">
                <div class="contribution-header">
                    <h3>✨ 分享您的故事</h3>
                    <p>您的感悟，或許正是他人尋找已久的指引。</p>
                </div>
                <form id="storyForm" class="contribution-form">
                    <div class="form-group">
                        <label>您的稱呼</label>
                        <input type="text" id="userName" placeholder="例如：靈魂旅者" required>
                    </div>
                    <div class="form-group">
                        <label>能量故事</label>
                        <textarea id="userStory" rows="4" placeholder="水晶帶給您什麼樣的平靜或改變？" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>上傳實拍感悟</label>
                        <div class="file-input-wrapper">
                            <input type="file" accept="image/*" style="font-size: 0.85rem; color: var(--text-gray);">
                        </div>
                    </div>
                    <button type="submit" class="submit-story-btn">提交感悟</button>
                </form>
            </div>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 CrystalMagic 水晶魔法 - 願平靜與能量與你同在</p>
</footer>

<script>
    // 提交表單的模擬效果
    document.getElementById('storyForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('userName').value;
        
        // 增加一點延遲模擬發送感
        const btn = this.querySelector('.submit-story-btn');
        btn.innerText = '能量傳遞中...';
        btn.disabled = true;

        setTimeout(() => {
            alert('親愛的 ' + name + '，感謝您的溫暖分享！您的故事已經提交，經過能量審核後將會出現在牆上。✨');
            this.reset();
            btn.innerText = '提交感悟';
            btn.disabled = false;
        }, 1500);
    });

    // --- 魔法守護腳本 (增強版) ---
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        // 禁用 F12, Ctrl+Shift+I, Ctrl+Shift+C, Ctrl+U
        if (e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 67)) || 
            (e.ctrlKey && e.keyCode === 85)) {
            return false;
        }
    };
</script>

</body>
</html>
