<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 - 水晶魔法客服諮詢</title>
    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="contact.css">
</head>
<body>

<header class="main-header">
    <a href="index.html" class="logo">🔮 CrystalMagic</a>
    <nav class="auth-buttons">
        <a href="index.html" class="nav-button login">回首頁</a>
        <a href="quiz.html" class="nav-button register">能量測驗</a>
    </nav>
</header>

<main>
    <section class="page-header">
        <h1>📨 聯絡客服諮詢</h1>
        <p>無論是產品疑問、能量諮詢或合作提案，我們都很樂意為您服務。</p>
    </section>

    <section class="contact-container">
        <!-- 左側：表單區域 -->
        <div class="contact-form">
            <h2>表單快速提問</h2>
            <form id="crystalContactForm">
                <div class="form-group">
                    <label for="name">您的姓名 *</label>
                    <input type="text" id="name" name="name" placeholder="例如：王小明" required>
                </div>
                
                <div class="form-group">
                    <label for="email">電子郵件 *</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="topic">諮詢主題 *</label>
                    <select id="topic" name="topic" required>
                        <option value="">請選擇主題...</option>
                        <option value="product">產品資訊 / 訂單問題</option>
                        <option value="energy">水晶能量諮詢</option>
                        <option value="cooperation">合作提案 / 媒體聯繫</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="message">您的訊息 *</label>
                    <textarea id="message" name="message" placeholder="請詳細描述您的需求..." required></textarea>
                </div>
                
                <button type="submit" class="btn-submit">送出諮詢訊息</button>
            </form>
        </div>

        <!-- 右側：資訊區域 -->
        <div class="contact-info">
            <h2>其他聯絡管道</h2>
            
            <div class="info-item">
                <strong>客服信箱 (推薦)</strong>
                <p>service.crystal@gmail.com</p>
                <p><small>我們保證在 24 小時內回覆您的信件。</small></p>
            </div>
            
            <div class="info-item">
                <strong>官方 LINE 客服</strong>
                <p>ID: @crystal_magic</p>
                <p><small>即時訊息回覆，適用於緊急問題。</small></p>
            </div>

            <div class="info-item">
                <strong>服務時間</strong>
                <p>週一至週五：09:00 - 18:00</p>
                <p><small>例假日及國定假日暫停服務。</small></p>
            </div>
            
            <div class="magic-footer-note">
                <p>✨ 祝您今日充滿正能量 ✨</p>
            </div>
        </div>
    </section>
</main>

<footer class="footer">
    <p>&copy; 2026 CrystalMagic. 每一顆水晶都承載著大地的祝福。</p>
</footer>

<!-- 引入外部 JavaScript -->
<script src="contact.js"></script>

</body>
</html>
