<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯繫我們 | 科技水晶空間</title>
    <style>
        :root {
            --primary-glow: #00d4ff;
            --secondary-glow: #9d50bb;
            --text-color: #ffffff;
            --bg-color: #0a0b1e;
            --error-color: #ff4d4d;
        }

        body {
            margin: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .background-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.15), transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(157, 80, 187, 0.15), transparent 40%);
        }

        .container {
            width: 90%;
            max-width: 1100px;
            display: flex;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            overflow: hidden;
            position: relative;
            animation: fadeIn 1.2s ease-out;
        }

        /* 左半部：表單 */
        .contact-form {
            flex: 1;
            padding: 40px;
            min-width: 300px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            background: linear-gradient(to right, var(--primary-glow), var(--secondary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        select option {
            background-color: #1a1b3a;
            color: white;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .error-msg {
            color: var(--error-color);
            font-size: 0.75rem;
            margin-top: 5px;
            display: none;
        }

        button.submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #00d4ff, #9d50bb);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button.submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        /* 參考圖片樣式的返回按鈕 */
        .back-btn-container {
            margin-top: 30px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.9); /* 模仿圖片中的白色膠囊 */
            border-radius: 50px; /* 圓角膠囊狀 */
            color: #4a148c; /* 深紫色文字 */
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .back-btn:hover {
            transform: scale(1.05);
            background: #ffffff;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        .back-btn .icon {
            margin-right: 8px;
            font-size: 1.2rem;
        }

        /* 右半部：聯絡資訊 */
        .contact-info {
            flex: 0.8;
            padding: 40px;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-item {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            animation: slideIn 0.8s ease-out forwards;
            opacity: 0;
        }

        .info-item:nth-child(1) { animation-delay: 0.3s; }
        .info-item:nth-child(2) { animation-delay: 0.5s; }
        .info-item:nth-child(3) { animation-delay: 0.7s; }

        .info-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            color: var(--primary-glow);
            border: 1px solid var(--primary-glow);
        }

        .positive-energy {
            margin-top: 40px;
            text-align: center;
            font-style: italic;
            color: var(--primary-glow);
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        /* 成功彈窗 */
        #success-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 11, 30, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid var(--primary-glow);
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #modal-overlay {
            display: none;
            position: fixed;
            top:0; left:0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 99;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        @keyframes popIn { from { transform: translate(-50%, -40%); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }

        @media (max-width: 768px) {
            .container { flex-direction: column; margin-top: 20px; }
            .contact-form { border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        }
    </style>
</head>
<body>

    <div class="background-animate"></div>

    <div class="container">
        <!-- 左側表單 -->
        <div class="contact-form">
            <h2>📨 聯絡客服諮詢</h2>
            <p class="form-description">無論是產品疑問、能量諮詢或合作提案，我們都很樂意為您服務。</p>
            <form id="contactForm">
                <div class="form-group">
                    <input type="text" id="name" placeholder="您的姓名" required>
                </div>
                <div class="form-group">
                    <input type="tel" id="phone" placeholder="手機號碼 (例: 0912345678)" required>
                    <div id="phone-error" class="error-msg">⚠️ 請輸入正確的手機號碼格式</div>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="電子郵件" required>
                    <div id="email-error" class="error-msg">⚠️ 請輸入有效的電子郵件地址</div>
                </div>
                <div class="form-group">
                    <select id="subject" required>
                        <option value="" disabled selected>請選擇諮詢主題</option>
                        <option value="product">✨ 水晶產品諮詢 (能量功效/挑選建議)</option>
                        <option value="order">📦 訂單查詢與物流追蹤</option>
                        <option value="custom">🔮 專屬水晶能量訂製服務</option>
                        <option value="collaboration">🤝 品牌異業合作洽談</option>
                        <option value="after-sales">🛠️ 售後維修與淨化服務</option>
                        <option value="other">💬 其他事宜詢問</option>
                    </select>
                </div>
                <div class="form-group">
                    <textarea rows="4" placeholder="請描述您的需求，我們將為您引導能量..."></textarea>
                </div>
                <button type="submit" class="submit-btn">啟動傳送</button>
            </form>

            <!-- 參考圖片製作的返回按鈕 -->
            <div class="back-btn-container">
                <a href="index.html" class="back-btn">
                    <span class="icon">🏠</span> 返回首頁
                </a>
            </div>
        </div>

        <!-- 右側資訊 -->
        <div class="contact-info">
            <h2>數位聯絡門戶</h2>
            <div class="info-item">
                <div class="info-icon">✉</div>
                <div class="info-text"><strong>crystal@crystal.com</strong></div>
            </div>
            <div class="info-item">
                <div class="info-icon">💬</div>
                <div class="info-text"><strong>Line ID: @crystal_space</strong></div>
            </div>
            <div class="info-item">
                <div class="info-icon">🕒</div>
                <div class="info-text"><strong>Mon-Fri 10:00 - 18:00</strong></div>
            </div>
            <div class="positive-energy">✨ 祝您今日充滿正能量 ✨</div>
        </div>
    </div>

    <!-- 成功彈窗 -->
    <div id="modal-overlay"></div>
    <div id="success-modal">
        <h3 style="color: var(--primary-glow); margin-top: 0;">傳送成功！</h3>
        <p>已收到您的表單，能量接收中...<br>我們將會盡快與您聯繫。</p>
        <button class="submit-btn" onclick="closeModal()" style="width: 120px; padding: 10px;">確認</button>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const phoneInput = document.getElementById('phone');
        const emailInput = document.getElementById('email');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            let isValid = true;

            // 手機格式驗證 (台灣手機範例)
            const phoneRegex = /^09\d{8}$/;
            if (!phoneRegex.test(phoneInput.value)) {
                document.getElementById('phone-error').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('phone-error').style.display = 'none';
            }

            // 電子郵件格式驗證
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value)) {
                document.getElementById('email-error').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('email-error').style.display = 'none';
            }

            if (isValid) {
                showModal();
                form.reset();
            }
        });

        function showModal() {
            document.getElementById('modal-overlay').style.display = 'block';
            document.getElementById('success-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('success-modal').style.display = 'none';
        }
    </script>
</body>
</html>
