<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>尋找你的命定水晶 | 能量測驗 - CrystalMagic</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .quiz-container { width: 900px; margin: 40px auto; }
        .question-block { background: #fff; padding: 30px; margin-bottom: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .options-list { list-style: none; padding: 0; }
        .options-list label { display: block; padding: 15px; margin: 10px 0; border: 1px solid #eee; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .options-list label:hover { background: #f3e5f5; }
        .submit-btn { width: 100%; padding: 20px; background: #6a1b9a; color: #fff; border: none; border-radius: 50px; font-size: 1.2rem; cursor: pointer; }
        .hidden { display: none; }
        #resultSection { text-align: center; background: #fff; padding: 50px; border-radius: 20px; margin-top: 30px; }
    </style>
</head>
<body>

<main class="quiz-container">
    <h1 style="text-align: center; color: #4a148c; margin-bottom: 30px;">🔮 命定水晶 10 題深度測驗</h1>
    
    <form id="quizForm">
        <!-- 問題 1-10 -->
        <div class="question-block">
            <p>1. 早上起床時，您通常希望感受到的第一種情緒是？</p>
            <div class="options-list">
                <label><input type="radio" name="q1" value="peace" required> 寧靜與清爽</label>
                <label><input type="radio" name="q1" value="energy"> 充滿動力與幹勁</label>
            </div>
        </div>

        <div class="question-block">
            <p>2. 您目前最想要解決的煩惱是？</p>
            <div class="options-list">
                <label><input type="radio" name="q2" value="protection" required> 小人與負能量干擾</label>
                <label><input type="radio" name="q2" value="love"> 感覺孤單或人際關係僵硬</label>
            </div>
        </div>

        <div class="question-block">
            <p>3. 哪種環境最能讓您放鬆？</p>
            <div class="options-list">
                <label><input type="radio" name="q3" value="spiritual" required> 充滿書香與檀香的書房</label>
                <label><input type="radio" name="q3" value="wealth"> 繁華且充滿現代感的商業街</label>
            </div>
        </div>

        <div class="question-block">
            <p>4. 面對困難時，您的強項是？</p>
            <div class="options-list">
                <label><input type="radio" name="q4" value="wisdom" required> 冷靜分析並想出對策</label>
                <label><input type="radio" name="q4" value="courage"> 勇往直前，解決就對了</label>
            </div>
        </div>

        <div class="question-block">
            <p>5. 您最希望在哪方面獲得「好運」？</p>
            <div class="options-list">
                <label><input type="radio" name="q5" value="wealth" required> 投資理財與業績達成</label>
                <label><input type="radio" name="q5" value="love"> 遇見對的人或修復感情</label>
            </div>
        </div>

        <div class="question-block">
            <p>6. 您的睡眠品質通常如何？</p>
            <div class="options-list">
                <label><input type="radio" name="q6" value="calm" required> 容易多夢、驚醒</label>
                <label><input type="radio" name="q6" value="stability"> 一覺到天亮，但感覺還是累</label>
            </div>
        </div>

        <div class="question-block">
            <p>7. 哪種顏色在這一刻最吸引您？</p>
            <div class="options-list">
                <label><input type="radio" name="q7" value="spiritual" required> 神祕的紫色或藍色</label>
                <label><input type="radio" name="q7" value="health"> 生機蓬勃的綠色</label>
            </div>
        </div>

        <div class="question-block">
            <p>8. 您對未來的期待是？</p>
            <div class="options-list">
                <label><input type="radio" name="q8" value="wisdom" required> 成為一個有洞察力的人</label>
                <label><input type="radio" name="q8" value="protection"> 穩定現狀，不受干擾</label>
            </div>
        </div>

        <div class="question-block">
            <p>9. 工作中，您最在意的是？</p>
            <div class="options-list">
                <label><input type="radio" name="q9" value="wealth" required> 實質的回報與成就感</label>
                <label><input type="radio" name="q9" value="peace"> 工作與生活的平衡</label>
            </div>
        </div>

        <div class="question-block">
            <p>10. 您認為現在的自己最需要：</p>
            <div class="options-list">
                <label><input type="radio" name="q10" value="health" required> 恢復體力與身體排毒</label>
                <label><input type="radio" name="q10" value="courage"> 踏出舒適圈的勇氣</label>
            </div>
        </div>

        <button type="submit" class="submit-btn">✨ 揭曉我的命定水晶 ✨</button>
    </form>

    <!-- 結果顯示區 -->
    <section id="resultSection" class="hidden">
        <h2>您的命定水晶是...</h2>
        <h1 id="crystalName" style="color: #6a1b9a; font-size: 3rem;"></h1>
        <p id="crystalDesc" style="font-size: 1.2rem; max-width: 600px; margin: 20px auto;"></p>
        <button onclick="location.reload()" style="padding: 10px 20px;">重新測驗</button>
    </section>
</main>

<script src="quiz.js"></script>
</body>
</html>
