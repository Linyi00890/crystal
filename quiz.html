<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尋找你的命定水晶 | 能量測驗 - CrystalMagic</title>
    
    <style>

        :root {
            --primary-purple: #6a1b9a;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .quiz-container { 
            max-width: 850px; 
            margin: 60px auto; 
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: #4a148c;
            margin-bottom: 40px;
        }


        .question-block { 
            background: #fff; 
            padding: 35px; 
            margin-bottom: 30px; 
            border-radius: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            border-left: 8px solid #ddd; 
        }


        .q1 { border-left-color: #ffcdd2; background-color: #fff9f9; } 
        .q2 { border-left-color: #e1bee7; background-color: #fdfaff; } 
        .q3 { border-left-color: #c5cae9; background-color: #f9faff; } 
        .q4 { border-left-color: #b3e5fc; background-color: #f5fcff; } 
        .q5 { border-left-color: #b2dfdb; background-color: #f4faf9; } 
        .q6 { border-left-color: #c8e6c9; background-color: #f6faf6; } 
        .q7 { border-left-color: #fff9c4; background-color: #fffff7; } 
        .q8 { border-left-color: #ffe0b2; background-color: #fffaf5; } 
        .q9 { border-left-color: #d7ccc8; background-color: #faf9f8; } 
        .q10 { border-left-color: #cfd8dc; background-color: #f8fafb; } 

        .question-text {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .options-list { list-style: none; padding: 0; }
        
        .options-list label { 
            display: block; 
            padding: 15px 20px; 
            margin: 10px 0; 
            border: 1px solid rgba(0,0,0,0.05); 
            background: rgba(255,255,255,0.8);
            border-radius: 12px; 
            cursor: pointer; 
            transition: 0.3s; 
        }

        .options-list label:hover { 
            background: #fff; 
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .submit-btn { 
            width: 100%; padding: 22px; background: var(--primary-purple); 
            color: #fff; border: none; border-radius: 50px; 
            font-size: 1.3rem; font-weight: bold; cursor: pointer; 
            margin-bottom: 100px; transition: 0.3s;
        }

        .submit-btn:hover { background: #4a148c; transform: translateY(-3px); }

        
        .hidden { display: none !important; }
        #resultSection { text-align: center; background: #fff; padding: 60px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .back-home {
            position: fixed; bottom: 30px; left: 30px; padding: 12px 25px;
            background: #fff; color: var(--primary-purple); text-decoration: none;
            border-radius: 30px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #e1bee7; z-index: 1000; display: flex; align-items: center; gap: 8px;
        }
        .back-home:hover { background: var(--primary-purple); color: #fff; }
    </style>
</head>
<body>

<main class="quiz-container">
    <h1>🔮 能量色彩測驗</h1>
    
    <form id="quizForm">
        <div class="question-block q1">
            <p class="question-text">1. 早上起床時，您通常希望感受到的第一種情緒是？</p>
            <div class="options-list">
                <label><input type="radio" name="q1" value="peace" required> 寧靜與清爽</label>
                <label><input type="radio" name="q1" value="energy"> 充滿動力與幹勁</label>
            </div>
        </div>

        <div class="question-block q2">
            <p class="question-text">2. 您目前最想要解決的煩惱是？</p>
            <div class="options-list">
                <label><input type="radio" name="q2" value="protection" required> 小人與負能量干擾</label>
                <label><input type="radio" name="q2" value="love"> 感覺孤單或人際關係僵硬</label>
            </div>
        </div>

        <div class="question-block q3">
            <p class="question-text">3. 哪種環境最能讓您放鬆？</p>
            <div class="options-list">
                <label><input type="radio" name="q3" value="spirit" required> 充滿靈性與平靜感的空間</label>
                <label><input type="radio" name="q3" value="wealth"> 充滿成就感與效率的場所</label>
            </div>
        </div>

        <div class="question-block q4">
            <p class="question-text">4. 面對困難時，您的強項是？</p>
            <div class="options-list">
                <label><input type="radio" name="q4" value="spirit" required> 冷靜分析並直覺對策</label>
                <label><input type="radio" name="q4" value="energy"> 立即採取行動，果斷解決</label>
            </div>
        </div>

        <div class="question-block q5">
            <p class="question-text">5. 您最希望在哪方面獲得「好運」？</p>
            <div class="options-list">
                <label><input type="radio" name="q5" value="wealth" required> 財富累積與事業巔峰</label>
                <label><input type="radio" name="q5" value="love"> 遇見正緣或深化既有感情</label>
            </div>
        </div>

        <div class="question-block q6">
            <p class="question-text">6. 您的睡眠品質通常如何？</p>
            <div class="options-list">
                <label><input type="radio" name="q6" value="peace" required> 心思繁雜，入睡緩慢</label>
                <label><input type="radio" name="q6" value="protection"> 容易受驚醒或感覺不安穩</label>
            </div>
        </div>

        <div class="question-block q7">
            <p class="question-text">7. 哪種顏色在這一刻最吸引您？</p>
            <div class="options-list">
                <label><input type="radio" name="q7" value="spirit" required> 高雅神祕的紫色</label>
                <label><input type="radio" name="q7" value="wealth"> 自信豐盛的金黃色</label>
            </div>
        </div>

        <div class="question-block q8">
            <p class="question-text">8. 您對未來的期待是？</p>
            <div class="options-list">
                <label><input type="radio" name="q8" value="spirit" required> 擁有洞察真相的智慧</label>
                <label><input type="radio" name="q8" value="protection"> 建立穩定且不受干擾的生活</label>
            </div>
        </div>

        <div class="question-block q9">
            <p class="question-text">9. 工作中，您最在意的是？</p>
            <div class="options-list">
                <label><input type="radio" name="q9" value="wealth" required> 成功的回報與目標達成</label>
                <label><input type="radio" name="q9" value="peace"> 心靈的平衡與成就感</label>
            </div>
        </div>

        <div class="question-block q10">
            <p class="question-text">10. 您認為現在的自己最需要：</p>
            <div class="options-list">
                <label><input type="radio" name="q10" value="protection" required> 擋開負能量與防範干擾</label>
                <label><input type="radio" name="q10" value="energy"> 衝破現狀的熱情與意志力</label>
            </div>
        </div>

        <button type="submit" class="submit-btn">✨ 揭曉我的命定水晶 ✨</button>
    </form>

    <section id="resultSection" class="hidden">
        <h2>您的命定水晶是...</h2>
        <h1 id="crystalName" style="color: #6a1b9a; font-size: 3rem;"></h1>
        <p id="crystalDesc" style="font-size: 1.2rem; margin: 20px 0;"></p>
        <button onclick="location.reload()" style="padding: 10px 20px; cursor: pointer;">重新測驗</button>
    </section>
</main>

<a href="index.html" class="back-home"><span>🏠</span> 返回首頁</a>

<script>
    document.getElementById('quizForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const scores = { spirit: 0, wealth: 0, protection: 0, love: 0, peace: 0, energy: 0 };
        for (let value of formData.values()) { if (scores[value] !== undefined) scores[value]++; }
        
        let maxCat = 'spirit';
        let maxScore = -1;
        for (let cat in scores) { if (scores[cat] > maxScore) { maxScore = scores[cat]; maxCat = cat; } }

        const results = {
            spirit: { name: "紫水晶", desc: "您正追求內心的智慧與平靜。" },
            wealth: { name: "黃水晶", desc: "豐盛與成功的能量正在吸引您。" },
            protection: { name: "黑曜石", desc: "守護與排除負能量是您的首要需求。" },
            love: { name: "粉水晶", desc: "開啟心輪，吸引溫暖的情感連結。" },
            peace: { name: "海藍寶", desc: "追求溝通的流暢與情緒的淨化。" },
            energy: { name: "鈦晶", desc: "強大的行動力將帶領您突破現狀。" }
        };

        document.getElementById('crystalName').innerText = results[maxCat].name;
        document.getElementById('crystalDesc').innerText = results[maxCat].desc;
        document.getElementById('quizForm').classList.add('hidden');
        document.getElementById('resultSection').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
</script>
</body>
</html>
