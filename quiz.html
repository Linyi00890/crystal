<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尋找你的命定水晶 | 能量測驗</title>
    <link rel="stylesheet" href="styles.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="logo">🔮 CrystalMagic</div>
        <div class="auth-buttons">
            <a href="index.html" class="nav-button login">返回首頁</a>
        </div>
    </header>

    <section class="hero-section quiz-hero">
        <div class="hero-content">
            <h1>內在能量測驗</h1>
            <p>讓您的直覺引導您找到目前最適合的水晶陪伴。</p>
        </div>
    </section>

    <main class="quiz-container">
        <form id="crystalQuiz">
            <!-- 問題區塊 -->
            <div class="question-block">
                <h2>問題 1：您目前最想改善或加強哪個領域？</h2>
                <label><input type="radio" name="q1" value="love" required> 戀愛與人際關係 (愛與和諧)</label>
                <label><input type="radio" name="q1" value="wealth"> 事業與財富 (行動與成功)</label>
                <label><input type="radio" name="q1" value="protection"> 淨化與保護 (穩定與避邪)</label>
                <label><input type="radio" name="q1" value="spiritual"> 靈性與學習 (智慧與洞察)</label>
            </div>

            <div class="question-block">
                <h2>問題 2：面對壓力時，您的第一反應是？</h2>
                <label><input type="radio" name="q2" value="meditate" required> 試圖靜心和沉思，尋求內在平靜</label>
                <label><input type="radio" name="q2" value="action"> 立即尋找出口，傾向積極行動</label>
                <label><input type="radio" name="q2" value="retreat"> 感覺被掏空，需要遠離人群獨自休息</label>
                <label><input type="radio" name="q2" value="share"> 渴望溫暖支持，找人傾訴尋求理解</label>
            </div>

            <!-- ... (以此類推放完 5 個問題) ... -->

            <button type="submit" class="submit-button">✨ 查看我的命定水晶 ✨</button>
        </form>

        <!-- 結果顯示區域 -->
        <section id="resultSection" class="result-section hidden">
            <h2>恭喜您！您的命定水晶是：</h2>
            <div class="crystal-result-card">
                <h3 id="crystalName"></h3>
                <img id="crystalImage" src="" alt="命定水晶">
                <p id="crystalDescription"></p>
                <a href="index.html" class="main-cta">回首頁看更多介紹</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 CrystalMagic. 能量測驗僅供參考。</p>
    </footer>

    <script src="quiz.js"></script>
</body>
</html>
