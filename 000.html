<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Atlas | 3D 能量圖鑑</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+TC:wght@300;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f111a;
            --gold: #c5a47e;
            --text-light: #e0e0e0;
            --card-width: 280px;
            --card-height: 400px;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Montserrat', 'Noto Serif TC', serif;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header { text-align: center; margin-bottom: 60px; }
        header h1 { font-family: 'Cinzel', serif; font-size: 3rem; color: var(--gold); letter-spacing: 8px; margin: 0; }
        header p { letter-spacing: 4px; color: #888; font-size: 0.9rem; margin-top: 10px; }

        /* 網格佈局 */
        .crystal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-width), 1fr));
            gap: 40px;
            max-width: 1300px;
            width: 100%;
            perspective: 1000px; /* 3D 視角 */
        }

        /* 翻牌容器 */
        .card-container {
            width: var(--card-width);
            height: var(--card-height);
            cursor: pointer;
            margin: 0 auto;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        /* 翻轉狀態 */
        .card-container.is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* 正面與背面的共有樣式 */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border: 1px solid rgba(197, 164, 126, 0.3);
            border-radius: 4px;
            overflow: hidden;
            background: #1a1c2c;
        }

        /* 正面樣式 */
        .card-front {
            display: flex;
            flex-direction: column;
        }

        .crystal-img {
            width: 100%;
            height: 80%;
            background-size: cover;
            background-position: center;
            /* 這裡使用漸層作為圖片佔位符，您可以替換成真實 URL */
            background-image: linear-gradient(45deg, #2c3e50, #000);
        }

        .crystal-name-tag {
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
            font-family: 'Noto Serif TC', serif;
            font-size: 1.4rem;
            color: var(--gold);
            letter-spacing: 2px;
        }

        /* 背面樣式 */
        .card-back {
            transform: rotateY(180deg);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, #1a1c2c 0%, #0a0b10 100%);
        }

        .back-title { color: var(--gold); font-size: 1.3rem; margin-bottom: 10px; font-weight: 600; }
        
        .chakra-badge {
            display: inline-block;
            background: rgba(197, 164, 126, 0.15);
            color: var(--gold);
            padding: 2px 10px;
            font-size: 0.8rem;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--gold);
        }

        .tags-row { margin-bottom: 15px; }
        .tag { color: #fff; font-size: 0.85rem; margin: 0 5px; opacity: 0.9; }

        .desc-text {
            font-size: 0.9rem;
            color: #bbb;
            line-height: 1.7;
            border-top: 1px solid rgba(197, 164, 126, 0.2);
            padding-top: 15px;
            text-align: justify;
        }

        /* 懸停發光效果 */
        .card-container:hover .card-inner {
            box-shadow: 0 0 30px rgba(197, 164, 126, 0.2);
        }

    </style>
</head>
<body>

<header>
    <h1>CRYSTAL MUSE</h1>
    <p>—— 點擊卡牌・探索內在能量 ——</p>
</header>

<div class="crystal-grid" id="crystalGrid">
    <!-- 卡牌由 JavaScript 生成 -->
</div>

<script>
    const crystals = [
        {
            name: "紫水晶",
            img: "https://images.unsplash.com/photo-1567606401083-97c36a466986?auto=format&fit=crop&q=80&w=400", // 範例圖
            chakra: "眉心輪",
            tags: ["直覺", "平靜"],
            desc: "幫助思緒清晰並提升睡眠品質，是智慧與守護的象徵。適合靜心冥想與壓力大的現代人。"
        },
        {
            name: "粉晶",
            img: "https://images.unsplash.com/photo-1615484477778-ca3b77940c25?auto=format&fit=crop&q=80&w=400",
            chakra: "心輪",
            tags: ["人緣", "治癒"],
            desc: "舒緩情緒煩躁，讓內心回到平和狀態，並能招來好桃花與提升生意緣。"
        },
        {
            name: "黑曜石",
            img: "https://images.unsplash.com/photo-1506272517965-ec6133efee7a?auto=format&fit=crop&q=80&w=400",
            chakra: "海底輪",
            tags: ["避邪", "接地"],
            desc: "極強的吸納性能量，排除負向干擾，是守護平安與穩定心神的首選。"
        }
        // ... 您可以在此繼續添加至 35+ 個
    ];

    const grid = document.getElementById('crystalGrid');

    function renderCards() {
        grid.innerHTML = crystals.map(c => `
            <div class="card-container" onclick="this.classList.toggle('is-flipped')">
                <div class="card-inner">
                    <!-- 正面 -->
                    <div class="card-front">
                        <div class="crystal-img" style="background-image: url('${c.img}')"></div>
                        <div class="crystal-name-tag">${c.name}</div>
                    </div>
                    <!-- 背面 -->
                    <div class="card-back">
                        <div class="back-title">${c.name}</div>
                        <div><span class="chakra-badge">對應：${c.chakra}</span></div>
                        <div class="tags-row">
                            ${c.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                        </div>
                        <p class="desc-text">${c.desc}</p>
                    </div>
                </div>
            </div>
        `).join('');
    }

    renderCards();
</script>

</body>
</html>
