<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrystalMagic | 專業能量圖鑑</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+TC:wght@300;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #05060a;
            --gold: #c5a47e;
            --gold-glow: rgba(197, 164, 126, 0.4);
            --glass: rgba(255, 255, 255, 0.03);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Montserrat', 'Noto Serif TC', serif;
            overflow-x: hidden;
            user-select: none;
        }

        /* 粒子畫布 */
        #particle-canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }

        /* --- 高級導覽列 --- */
        .main-header {
            position: fixed; top: 0; width: 100%;
            background: rgba(5, 6, 10, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--gold);
            z-index: 2000;
        }
        .nav-container {
            max-width: 1400px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px;
        }
        .logo {
            font-family: 'Cinzel', serif; font-size: 1.6rem;
            color: var(--gold); text-decoration: none; letter-spacing: 2px;
        }
        .nav-links { display: flex; list-style: none; gap: 25px; }
        .nav-links a {
            color: #aaa; text-decoration: none; font-size: 0.9rem;
            transition: var(--transition); letter-spacing: 1px;
        }
        .nav-links a:hover { color: var(--gold); }

        /* --- 精美化過濾器 --- */
        .filter-section { padding-top: 120px; text-align: center; }
        .filter-container { display: flex; justify-content: center; gap: 20px; align-items: center; }
        
        .btn-all {
            background: transparent; border: 1px solid var(--gold);
            color: var(--gold); padding: 10px 25px; cursor: pointer;
            font-family: 'Noto Serif TC'; transition: var(--transition);
        }
        .btn-all:hover { background: var(--gold); color: #000; }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-label {
            padding: 10px 20px; border: 1px solid rgba(197, 164, 126, 0.3);
            cursor: pointer; color: var(--gold); font-family: 'Noto Serif TC';
        }
        .dropdown-menu {
            position: absolute; top: 100%; left: 0;
            background: #0f111a; border: 1px solid var(--gold);
            list-style: none; min-width: 180px; text-align: left;
            opacity: 0; visibility: hidden; transform: translateY(10px);
            transition: var(--transition); z-index: 1500;
        }
        .dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-menu li a {
            display: block; padding: 12px 20px; color: #ccc;
            text-decoration: none; font-size: 0.9rem; cursor: pointer;
        }
        .dropdown-menu li a:hover { background: var(--gold); color: #000; }

        /* --- 翻牌式網格 --- */
        .crystal-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px; max-width: 1400px; margin: 60px auto; padding: 0 40px 100px;
        }

        .flip-card { height: 480px; perspective: 1000px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .flip-card:hover .flip-card-inner { transform: rotateY(180deg); }

        .flip-card-front, .flip-card-back {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            border-radius: 4px; border: 1px solid var(--c-color);
        }

        /* 正面：圖片展示 */
        .flip-card-front {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,1));
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .crystal-img {
            width: 180px; height: 180px; border-radius: 50%;
            margin-bottom: 25px; object-fit: cover;
            border: 2px solid var(--c-color);
            box-shadow: 0 0 20px var(--c-alpha);
            background: #111; /* 圖片載入前的占位色 */
        }
        .crystal-name { font-family: 'Cinzel', serif; font-size: 1.8rem; color: var(--c-color); }

        /* 背面：文字描述 */
        .flip-card-back {
            background-color: var(--c-color); color: var(--t-color);
            transform: rotateY(180deg); display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px;
        }
        .back-title { font-family: 'Noto Serif TC'; font-size: 1.6rem; margin-bottom: 15px; border-bottom: 1px solid currentColor; }
        .back-desc { font-size: 0.95rem; line-height: 1.8; text-align: center; }

        @media (max-width: 900px) {
            .nav-links { display: none; }
            .filter-container { flex-direction: column; }
        }
    </style>
</head>
<body oncontextmenu="return false">

<canvas id="particle-canvas"></canvas>

<header class="main-header">
    <div class="nav-container">
        <a href="index.html" class="logo">🔮 CrystalMagic</a>
        <ul class="nav-links">
            <li><a href="origin.html">水晶起源</a></li>
            <li><a href="effect.html">功效解讀</a></li>
            <li><a href="pages.html">淨化保養</a></li>
            <li><a href="pick.html">挑選指南</a></li> 
            <li><a href="exclusive.html">專屬商品</a></li>
            <li><a href="question.html">常見問題</a></li>
            <li><a href="share.html">粉絲回饋</a></li>
            <li><a href="contact.html">客服諮詢</a></li>
        </ul>
    </div>
</header>

<section class="filter-section">
    <div class="filter-container">
        <button class="btn-all" onclick="filterCrystals('all', 'all')">全部顯示</button>

        <div class="dropdown">
            <div class="dropdown-label">✨ 按主要功效 ▼</div>
            <ul class="dropdown-menu">
                <li><a onclick="filterCrystals('effect', 'spirit')">🧘 靈性智慧</a></li>
                <li><a onclick="filterCrystals('effect', 'wealth')">💰 財富事業</a></li>
                <li><a onclick="filterCrystals('effect', 'protection')">🛡️ 守護避邪</a></li>
                <li><a onclick="filterCrystals('effect', 'peace')">🌊 溝通平靜</a></li>
                <li><a onclick="filterCrystals('effect', 'love')">💖 感情人緣</a></li>
                <li><a onclick="filterCrystals('effect', 'health')">🌿 健康療癒</a></li>
            </ul>
        </div>

        <div class="dropdown">
            <div class="dropdown-label">🎨 按色系 ▼</div>
            <ul class="dropdown-menu">
                <li><a onclick="filterCrystals('color', 'white')">🤍 白色系</a></li>
                <li><a onclick="filterCrystals('color', 'pink')">💗 粉紅系</a></li>
                <li><a onclick="filterCrystals('color', 'yellow')">💛 黃金色系</a></li>
                <li><a onclick="filterCrystals('color', 'purple')">💜 紫色系</a></li>
                <li><a onclick="filterCrystals('color', 'green')">💚 綠色系</a></li>
                <li><a onclick="filterCrystals('color', 'blue')">💙 藍色系</a></li>
                <li><a onclick="filterCrystals('color', 'black')">🖤 黑色系</a></li>
            </ul>
        </div>
    </div>
</section>

<div class="crystal-grid" id="mainGrid"></div>

<script>
    // 35+ 種水晶數據 (img 欄位請填入你的圖片檔名，例如 amethyst.jpg)
    const crystals = [
        { name: "紫水晶", img: "purple-1.jpg", color: "#a29bfe", group: "purple", effect: "spirit", icon: "🔮", desc: "開發智慧、平穩情緒，協助冥想並提升直覺力。" },
        { name: "粉晶", img: "pink-1.jpg", color: "#fab1a0", group: "pink", effect: "love", icon: "🌸", desc: "心靈的療癒者。吸引異性緣，增進人際關係。" },
        { name: "鈦晶", img: "yellow-1.jpg", color: "#fdcb6e", group: "yellow", effect: "wealth", icon: "🔱", desc: "水晶之王。招正財偏財，增加領袖氣場與勇氣。" },
        { name: "黑曜石", img: "black-1.jpg", color: "#2d3436", group: "black", effect: "protection", icon: "🌑", desc: "極強吸納性能量。排除負能量避邪，強大護身符。" },
        { name: "海藍寶", img: "blue-1.jpg", color: "#74b9ff", group: "blue", effect: "peace", icon: "💧", desc: "海洋守護石。加強表達溝通能力，保佑旅行平安。" },
        { name: "捷克隕石", img: "green-1.jpg", color: "#55efc4", group: "green", effect: "spirit", icon: "☄️", desc: "宇宙強大震動。加速靈性轉化與命運的全面覺醒。" },
        { name: "月光石", img: "white-1.jpg", color: "#dfe6e9", group: "white", effect: "love", icon: "🌙", desc: "柔性力量。舒緩壓力，吸引靈魂伴侶，調理生理。" },
        { name: "金運石", img: "black-2.jpg", color: "#1e272e", group: "black", effect: "wealth", icon: "💎", desc: "吸財擋煞。低調且剛強，守住財庫並阻隔負磁場。" },
        { name: "舒俱徠", img: "purple-2.jpg", color: "#6c5ce7", group: "purple", effect: "health", icon: "💜", desc: "抗癌療癒聖品。消除深層恐懼，轉化負面思想。" },
        { name: "螢石", img: "green-2.jpg", color: "#2ed573", group: "green", effect: "spirit", icon: "🧬", desc: "智慧之石。清理思緒，提升學習效率與邏輯。" }
        // ... 此處可擴展至 35+ 個
    ];

    const grid = document.getElementById('mainGrid');

    function getTextColor(hex) {
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        return ((r*299+g*587+b*114)/1000) > 155 ? '#111' : '#fff';
    }

    function render(data) {
        grid.innerHTML = data.map(c => `
            <div class="flip-card" style="--c-color: ${c.color}; --c-alpha: ${c.color}44; --t-color: ${getTextColor(c.color)}">
                <div class="flip-card-inner">
                    <div class="flip-card-front">
                        <img src="img/${c.img}" alt="${c.name}" class="crystal-img" onerror="this.src='https://via.placeholder.com/180/222/c5a47e?text=${c.name}'">
                        <div class="crystal-name">${c.name}</div>
                    </div>
                    <div class="flip-card-back">
                        <div class="back-title">${c.name}</div>
                        <p class="back-desc">${c.desc}</p>
                    </div>
                </div>
            </div>`).join('');
    }

    // 篩選邏輯 (對應你的 HTML onclick)
    function filterCrystals(type, value) {
        if(type === 'all') { render(crystals); return; }
        const filtered = crystals.filter(c => type === 'effect' ? c.effect === value : c.group === value);
        render(filtered);
    }

    render(crystals);

    // 粒子背景邏輯
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function init() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    class P {
        constructor() { this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.vx=Math.random()*0.4-0.2; this.vy=Math.random()*0.4-0.2; this.op=Math.random(); }
        draw() { ctx.fillStyle=`rgba(197, 164, 126, ${this.op})`; ctx.beginPath(); ctx.arc(this.x,this.y,1.2,0,Math.PI*2); ctx.fill(); }
        up() { this.x+=this.vx; this.y+=this.vy; if(this.x<0||this.x>canvas.width)this.vx*=-1; if(this.y<0||this.y>canvas.height)this.vy*=-1; }
    }
    for(let i=0;i<80;i++)particles.push(new P());
    function loop() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{p.up();p.draw();}); requestAnimationFrame(loop); }
    init(); loop(); window.onresize=init;

    // 守護腳本
    document.onkeydown = e => { if(e.keyCode==123||(e.ctrlKey&&e.shiftKey&&[73,74].includes(e.keyCode))||(e.ctrlKey&&e.keyCode==85)) return false; };
</script>

</body>
</html>
