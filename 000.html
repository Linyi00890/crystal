<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水晶靈魂圖鑑 | 初學者入門指南</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --accent-color: #a29bfe; /* 療癒系紫色 */
            --text-main: #2d3436;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            letter-spacing: 3px;
            font-weight: 300;
            color: #636e72;
        }

        /* 搜尋過濾器 */
        .filter-container {
            max-width: 800px;
            margin: 0 auto 30px;
            text-align: center;
        }

        #searchBar {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #ddd;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        /* 水晶卡牌網格 */
        .crystal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 卡牌樣式 */
        .crystal-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
            transition: transform 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .crystal-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-color);
        }

        .crystal-card h3 {
            margin: 10px 0;
            color: var(--accent-color);
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .property-tag {
            display: inline-block;
            background: #eee;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-right: 5px;
            margin-bottom: 10px;
        }

        .crystal-desc {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #636e72;
        }

        /* 特效：卡牌裝飾線 */
        .crystal-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent-color);
            opacity: 0.5;
        }
    </style>
</head>
<body>

<header>
    <h1>CRYSTAL GUIDE</h1>
    <p>探索大地的能量結晶，開啟你的靈性之旅</p>
</header>

<div class="filter-container">
    <input type="text" id="searchBar" placeholder="輸入水晶名稱或關鍵字 (如：愛情、避邪)...">
</div>

<div class="crystal-grid" id="crystalGrid">
    <!-- 卡牌將由 JavaScript 自動生成 -->
</div>

<script>
    // 範例資料庫：你可以輕鬆擴充至 35+ 種
    const crystals = [
        { name: "紫水晶 Amethyst", tags: ["智慧", "安眠"], desc: "開發智慧、平穩情緒，適合需要長時間用腦的學生與上班族。" },
        { name: "粉晶 Rose Quartz", tags: ["愛情", "人緣"], desc: "溫和的力量，招來好桃花、增進生意緣，並能舒緩心肺功能。" },
        { name: "黑曜石 Obsidian", tags: ["避邪", "護身"], desc: "極強的吸納性能量，排除負面能量與病氣，是最好的護身符。" },
        { name: "白水晶 Clear Quartz", tags: ["淨化", "全能"], desc: "水晶之王，放大所有能量，清除空間負能量，幫助思緒清晰。" },
        { name: "黃水晶 Citrine", tags: ["偏財", "自信"], desc: "財富之石，主偏財運，也有助於腸胃健康，增強個人自信心。" },
        { name: "拉長石 Labradorite", tags: ["靈感", "守護"], desc: "沉穩的藍綠閃光，激發創意與直覺，守護靈魂光環。" }
        // ... 在此繼續複製增加資料
    ];

    const grid = document.getElementById('crystalGrid');
    const searchBar = document.getElementById('searchBar');

    // 渲染函數
    function displayCrystals(data) {
        grid.innerHTML = data.map(c => `
            <div class="crystal-card">
                <h3>${c.name}</h3>
                <div>${c.tags.map(t => `<span class="property-tag">${t}</span>`).join('')}</div>
                <p class="crystal-desc">${c.desc}</p>
            </div>
        `).join('');
    }

    // 搜尋功能
    searchBar.addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        const filtered = crystals.filter(c => 
            c.name.toLowerCase().includes(val) || 
            c.tags.some(t => t.includes(val))
        );
        displayCrystals(filtered);
    });

    // 初始渲染
    displayCrystals(crystals);
</script>

</body>
</html>
