<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrystalMagic | 專業能量圖鑑</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+TC:wght@300;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #05080a;
            --gold: #d4af37;
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            
            /* 功效顏色定義 (用於卡片邊框與標籤) */
            --color-spirit: #a29bfe;     /* 靈性: 紫 */
            --color-wealth: #f1c40f;     /* 財富: 金 */
            --color-protection: #57606f; /* 守護: 灰黑 */
            --color-peace: #7ed6df;      /* 平靜: 淺藍 */
            --color-love: #ff7979;       /* 感情: 粉紅 */
            --color-health: #26de81;     /* 健康: 綠 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 50%, #0a1118 0%, #05080a 100%);
            color: #e0e0e0; 
            font-family: 'Montserrat', 'Noto Serif TC', serif; 
            min-height: 100vh;
        }

        /* --- 導覽列 --- */
        .main-header { 
            position: fixed; top: 0; width: 100%; 
            background: rgba(5, 8, 10, 0.85); 
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2); 
            z-index: 2000; 
        }
        .nav-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; }
        .logo { font-family: 'Cinzel', serif; font-size: 1.6rem; color: var(--gold); text-decoration: none; letter-spacing: 3px; }
        .nav-links { display: flex; list-style: none; gap: 20px; }
        .nav-links a { color: #bbb; text-decoration: none; font-size: 0.9rem; }

        /* 手機版漢堡選單 */
        .menu-toggle { display: none; flex-direction: column; cursor: pointer; }
        .bar { width: 25px; height: 2px; background-color: var(--gold); margin: 3px 0; }

        /* --- 篩選區 --- */
        .filter-section { padding-top: 120px; text-align: center; }
        .btn-all, .dropdown-label { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(212,175,55,0.3);
            color: var(--gold); padding: 10px 20px; cursor: pointer; border-radius: 4px;
        }

        /* --- 水晶網格 --- */
        .crystal-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 40px; max-width: 1300px; margin: 50px auto; padding: 0 30px 100px; 
        }

        /* --- 卡片核心設計 --- */
        .card-container { perspective: 1000px; height: 480px; }
        .crystal-card { 
            position: relative; width: 100%; height: 100%; 
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1); 
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .card-container:hover .crystal-card { transform: rotateY(180deg); }

        .flip-front, .flip-back { 
            position: absolute; width: 100%; height: 100%; 
            backface-visibility: hidden; border-radius: 15px; overflow: hidden;
            border: 2px solid var(--card-color); /* 自動根據數據變色 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px var(--card-glow);
        }

        /* 正面：圖片與名稱 */
        .flip-front { 
            background: #070b0f; 
            display: flex; flex-direction: column; 
        }
        .crystal-img { width: 100%; height: 100%; object-fit: cover; position: absolute; z-index: 1; }
        .front-overlay {
            position: absolute; bottom: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            padding: 30px 20px; z-index: 2;
            display: flex; flex-direction: column; gap: 8px;
        }
        .tag { 
            background: var(--card-color); color: #000;
            padding: 4px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; width: fit-content;
        }
        .crystal-name { font-family: 'Cinzel'; font-size: 1.4rem; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        /* 背面：效果描述 */
        .flip-back { 
            background: linear-gradient(145deg, #121a21 0%, #05080a 100%); 
            transform: rotateY(180deg); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 40px; text-align: center;
        }
        .back-title { color: var(--card-color); font-size: 1.2rem; margin-bottom: 15px; font-weight: 600; letter-spacing: 1px; }
        .back-desc { font-size: 0.95rem; color: #ccc; line-height: 1.8; margin-bottom: 30px; font-family: 'Noto Serif TC'; }
        
        .detail-btn { 
            text-decoration: none; color: #000; background: var(--card-color); 
            padding: 10px 25px; border-radius: 30px; font-size: 0.85rem; font-weight: 600;
            transition: 0.3s;
        }
        .detail-btn:hover { filter: brightness(1.2); transform: translateY(-3px); }

        /* 手機版適配 */
        @media (max-width: 900px) {
            .menu-toggle { display: flex; }
            .nav-links { position: fixed; top: 0; right: -100%; width: 70%; height: 100vh; background: #070b0f; flex-direction: column; justify-content: center; align-items: center; transition: 0.5s; }
            .nav-links.active { right: 0; }
        }
    </style>
</head>
<body>

<header class="main-header">
    <div class="nav-container">
        <a href="#" class="logo">🔮 CrystalMagic</a>
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
        <ul class="nav-links">
            <li><a href="#">水晶起源</a></li>
            <li><a href="#">功效解讀</a></li>
            <li><a href="#">淨化保養</a></li>
            <li><a href="#">聯絡我們</a></li>
        </ul>
    </div>
</header>

<section class="filter-section">
    <div class="filter-container">
        <button class="btn-all" onclick="filterCrystals('all')">顯示全部水晶</button>
    </div>
</section>

<main class="crystal-grid" id="crystalGrid"></main>

<script>
    // 水晶資料庫
    const crystals = [
        { id: "white-quartz", name: "白水晶 (Clear Quartz)", tag: "水晶之王", effect: "peace", desc: "淨化全身負能量，放大其他水晶效應，平衡身心靈。", img: "white.jpg" },
        { id: "amethyst", name: "紫水晶 (Amethyst)", tag: "智慧之石", effect: "spirit", desc: "開發智慧、加強記憶力、平穩情緒，穩定人際關係。", img: "purple.jpg" },
        { id: "citrine", name: "黃水晶 (Citrine)", tag: "財富之石", effect: "wealth", desc: "主偏財運，常帶來意外之財，增強自信與動力。", img: "yellow.jpg" },
        { id: "obsidian", name: "黑曜石 (Obsidian)", tag: "避邪之首", effect: "protection", desc: "極強的吸納性能量，排除負能量、去除霉運、守護平安。", img: "black.jpg" },
        { id: "rose-quartz", name: "粉晶 (Rose Quartz)", tag: "姻緣之石", effect: "love", desc: "招攬人脈、增進生意緣、改善人際關係、守護愛情。", img: "pink.jpg" },
        { id: "green-phantom", name: "綠幽靈 (Green Phantom)", tag: "事業之王", effect: "wealth", desc: "招正財、助事業發展、吸引貴人相助、增進工作動力。", img: "green.jpg" }
        // ... 可在此繼續添加至 35+ 種
    ];

    // 顏色映射表
    const colorTheme = {
        spirit: { color: "#a29bfe", glow: "rgba(162, 155, 254, 0.3)" },
        wealth: { color: "#f1c40f", glow: "rgba(241, 196, 15, 0.3)" },
        protection: { color: "#95afc0", glow: "rgba(149, 175, 192, 0.2)" },
        peace: { color: "#7ed6df", glow: "rgba(126, 214, 223, 0.3)" },
        love: { color: "#ff7979", glow: "rgba(255, 121, 121, 0.3)" },
        health: { color: "#26de81", glow: "rgba(38, 222, 129, 0.3)" }
    };

    const grid = document.getElementById('crystalGrid');

    function render() {
        grid.innerHTML = crystals.map(c => {
            const theme = colorTheme[c.effect];
            return `
            <div class="card-container" style="--card-color: ${theme.color}; --card-glow: ${theme.glow}">
                <div class="crystal-card">
                    <!-- 正面：名稱與大標題 -->
                    <div class="flip-front">
                        <img src="picture/${c.img}" class="crystal-img" onerror="this.src='https://via.placeholder.com/300x480/111/fff?text=${c.name}'">
                        <div class="front-overlay">
                            <span class="tag">${c.tag}</span>
                            <h3 class="crystal-name">${c.name}</h3>
                        </div>
                    </div>
                    <!-- 背面：詳細效果描述 -->
                    <div class="flip-back">
                        <p class="back-title">✨ 核心能量效果</p>
                        <p class="back-desc">${c.desc}</p>
                        <a href="details/${c.id}.html" class="detail-btn">探索能量細節</a>
                    </div>
                </div>
            </div>
            `;
        }).join('');
    }

    // 手機選單控制
    const menu = document.getElementById('mobile-menu');
    const navLinks = document.querySelector('.nav-links');
    menu.onclick = () => navLinks.classList.toggle('active');

    render();
</script>

</body>
</html>
