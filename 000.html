<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Atlas | 專業水晶圖鑑</title>
    <style>
        :root {
            --primary: #8e94f3; /* 薰衣草紫 */
            --secondary: #60a5fa; /* 天空藍 */
            --bg: #fdfbff;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text: #2d3436;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'PingFang TC', 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* 背景裝飾 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(142, 148, 243, 0.1) 0%, transparent 40%);
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 10px;
            color: #4b4b4b;
        }

        /* 搜尋與過濾 */
        .controls {
            max-width: 600px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        #searchBox {
            width: 100%;
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid #e0e0e0;
            background: var(--card-bg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            outline: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        #searchBox:focus {
            border-color: var(--primary);
            box-shadow: 0 10px 25px rgba(142, 148, 243, 0.15);
        }

        /* 網格系統 */
        .crystal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 30px 100px;
        }

        /* 卡牌設計 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(142, 148, 243, 0.2);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        .card h3 {
            margin: 15px 0 10px;
            font-size: 1.25rem;
            color: #333;
        }

        .tag {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #666;
            margin: 4px;
        }

        .description {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #777;
            text-align: left;
        }

        /* 卷軸美化 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    </style>
</head>
<body>

<header>
    <h1>CRYSTAL ATLAS</h1>
    <p>—— 點選或搜尋，開啟你的能量共鳴 ——</p>
</header>

<div class="controls">
    <input type="text" id="searchBox" placeholder="輸入名稱、功效或顏色搜尋...">
</div>

<div class="crystal-grid" id="crystalGrid">
    <!-- 卡牌由 JavaScript 生成 -->
</div>

<script>
    // 這裡預填了部分資料，你可以按照這個格式輕鬆增加到 35+ 種
    const crystalData = [
        { name: "紫水晶 Amethyst", icon: "🔮", tags: ["智慧", "直覺", "平靜"], desc: "開發靈性與智慧，適合冥想與提升睡眠品質。" },
        { name: "粉晶 Rose Quartz", icon: "🌸", tags: ["人緣", "愛情", "治癒"], desc: "招來好桃花與人緣，修復內心創傷，散發溫和氣息。" },
        { name: "白水晶 Clear Quartz", icon: "💎", tags: ["淨化", "放大", "聚焦"], desc: "水晶之王，能淨化空間負能量並放大其他水晶功效。" },
        { name: "黑曜石 Obsidian", icon: "🌑", tags: ["避邪", "吸收", "保護"], desc: "強大的負能量排除能力，是最好的守護石與護身符。" },
        { name: "黃水晶 Citrine", icon: "☀️", tags: ["財運", "自信", "喜悅"], desc: "象徵財富與成功，主偏財運，並能增強個人自信心。" },
        { name: "拉長石 Labradorite", icon: "✨", tags: ["創造力", "靈覺", "保護"], desc: "沉穩的藍綠閃光，幫助洞察事物的真相並激發潛能。" },
        { name: "海藍寶 Aquamarine", icon: "🌊", tags: ["溝通", "勇氣", "平靜"], desc: "保護航海平安，加強表達能力與說服力。" },
        { name: "青金石 Lapis Lazuli", icon: "🌌", tags: ["專注", "理智", "洞察"], desc: "對應眉心輪，幫助思緒清晰，提升決斷力。" },
        { name: "金髮晶 Rutilated Quartz", icon: "🔱", tags: ["正財", "權威", "氣場"], desc: "強大的招財能量，適合創業與職場領導者提升氣場。" },
        { name: "草莓晶 Strawberry Quartz", icon: "🍓", tags: ["愛情", "熱情", "魅力"], desc: "增進人際關係，讓思緒更清晰，讓心靈重獲平靜。" }
        // 你可以在這裡繼續複製貼上，直到 35 種以上
    ];

    const grid = document.getElementById('crystalGrid');
    const searchBox = document.getElementById('searchBox');

    function renderCards(data) {
        grid.innerHTML = data.map(crystal => `
            <div class="card">
                <span class="card-icon">${crystal.icon}</span>
                <h3>${crystal.name}</h3>
                <div>${crystal.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
                <p class="description">${crystal.desc}</p>
            </div>
        `).join('');
    }

    // 初始化渲染
    renderCards(crystalData);

    // 搜尋功能
    searchBox.addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase();
        const filteredData = crystalData.filter(c => 
            c.name.toLowerCase().includes(keyword) || 
            c.tags.some(t => t.includes(keyword)) ||
            c.desc.includes(keyword)
        );
        renderCards(filteredData);
    });
</script>

</body>
</html>
