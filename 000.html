<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Soul | 專業水晶能量圖鑑</title>
    <!-- 引入 Google Fonts 提升質感 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a29bfe;
            --accent-glow: rgba(162, 155, 254, 0.3);
            --bg: #0f111a; /* 深邃午夜藍，能襯托水晶光澤 */
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-gold: #d4af37;
            --text-light: #e0e0e0;
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            font-family: 'Montserrat', 'Noto Serif TC', serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 背景流光效果 */
        body::after {
            content: '';
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(162,155,254,0.05) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            padding: 80px 20px 40px;
            text-align: center;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 8px;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--accent), var(--text-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        header p {
            font-weight: 300;
            letter-spacing: 2px;
            color: #888;
            margin-top: 15px;
        }

        /* 專業過濾器設計 */
        .filter-section {
            max-width: 800px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        #searchBox {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 30px;
            border-radius: 100px;
            color: white;
            font-size: 1.1rem;
            backdrop-filter: blur(10px);
        }

        #searchBox:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(255, 255, 255, 0.07);
        }

        /* 水晶網格 */
        .crystal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px 100px;
        }

        /* 精美卡牌 */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2px; /* 方正設計更顯專業與經典 */
            padding: 40px 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .card:hover::before { transform: translateX(100%); }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .crystal-symbol {
            font-size: 3.5rem;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }

        .card h3 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.5rem;
            margin: 10px 0;
            color: var(--text-gold);
            letter-spacing: 2px;
        }

        .tag-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tag {
            font-size: 0.7rem;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 2px 12px;
            border-radius: 50px;
            text-transform: uppercase;
        }

        .desc {
            font-size: 0.9rem;
            color: #bbb;
            text-align: center;
            line-height: 1.8;
            font-weight: 300;
        }

        /* 捲軸設計 */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent); }

    </style>
</head>
<body>

<header>
    <h1>Crystal Soul</h1>
    <p>—— 萬物皆有靈．探索大地能量的奧秘 ——</p>
</header>

<div class="filter-section">
    <div class="search-wrapper">
        <input type="text" id="searchBox" placeholder="輸入能量需求、色彩或名稱（如：平靜、偏財）...">
    </div>
</div>

<div class="crystal-grid" id="mainGrid">
    <!-- JS 將在此生成卡牌 -->
</div>

<script>
    // 專業資料結構：建議補齊 35 種
    const crystals = [
        { name: "紫水晶", eng: "Amethyst", icon: "✨", tags: ["智慧", "安眠"], desc: "對應眉心輪，轉化負能量為愛與智慧。適合冥想、緩解情緒壓力。" },
        { name: "粉晶", eng: "Rose Quartz", icon: "💎", tags: ["愛情", "治癒"], desc: "溫柔的療癒之石。開啟心輪，吸引良緣並促進自我包容與寬恕。" },
        { name: "拉長石", eng: "Labradorite", icon: "🌌", tags: ["靈感", "防護"], desc: "光譜石中的幻影。激發潛能、保護能量場，減少靈性干擾。" },
        { name: "鈦晶", eng: "Rutilated Quartz", icon: "🔱", tags: ["財富", "氣場"], desc: "水晶之王。具備極強的招財能量與魄力，適合職場領導者配戴。" },
        { name: "月光石", eng: "Moonstone", icon: "🌙", tags: ["情感", "直覺"], desc: "戀人之石。緩解女性週期不適，增進直覺力，平撫情緒波動。" },
        { name: "黑碧璽", eng: "Schorl", icon: "⬛", tags: ["避邪", "接地"], desc: "強大的保護石。吸收輻射與負能量，幫助身心與大地連結。" },
        // ... 此處可持續擴展至 35+ 種
    ];

    const grid = document.getElementById('mainGrid');
    const search = document.getElementById('searchBox');

    function render(items) {
        grid.innerHTML = items.map(c => `
            <div class="card">
                <div class="crystal-symbol">${c.icon}</div>
                <h3>${c.name}</h3>
                <div style="font-size:0.8rem; color:#666; margin-bottom:15px;">${c.eng}</div>
                <div class="tag-container">
                    ${c.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                </div>
                <p class="desc">${c.desc}</p>
            </div>
        `).join('');
    }

    search.addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        const filtered = crystals.filter(c => 
            c.name.includes(val) || c.tags.some(t => t.includes(val)) || c.eng.toLowerCase().includes(val)
        );
        render(filtered);
    });

    render(crystals);
</script>

</body>
</html>
