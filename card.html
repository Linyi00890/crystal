<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極致奢華 | 星座運勢水晶神諭 2026</title>
    <style>
        :root {
            --gold: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --mystic-purple: #4a148c;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #000000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 頂部導航 */
        header { text-align: center; padding: 50px 20px 20px; }
        h1 { 
            background: var(--gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem; letter-spacing: 5px; margin: 0; 
            filter: drop-shadow(0 0 10px rgba(212,175,55,0.5));
        }
        .date-display { color: #ccc; font-size: 0.9rem; margin-top: 10px; letter-spacing: 2px; }

        /* 星座選擇區 - 玻璃擬態 */
        .zodiac-selector {
            margin: 20px 0;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        select {
            padding: 8px 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.9);
            color: #333;
            font-weight: bold;
            border: none;
            outline: none;
            cursor: pointer;
        }

        /* 3D 卡牌舞台 */
        .card-stage {
            perspective: 1500px;
            margin: 30px auto;
            cursor: pointer;
        }

        .card-inner {
            width: 320px; height: 520px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-inner.is-flipped { transform: rotateY(180deg); }

        /* 卡片發光效果 */
        .card-inner.is-flipped .card-front {
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.6);
        }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 25px;
            border: 2px solid transparent;
            background-image: linear-gradient(#1a1a2e, #1a1a2e), var(--gold);
            background-origin: border-box;
            background-clip: content-box, border-box;
        }

        /* 卡片背面 */
        .card-back {
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .card-back::before {
            content: "";
            position: absolute; width: 150%; height: 150%;
            background: conic-gradient(from 0deg, transparent, rgba(212,175,55,0.3), transparent);
            animation: rotate 4s linear infinite;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .card-back::after {
            content: "✨"; font-size: 80px; z-index: 1;
            filter: drop-shadow(0 0 20px var(--gold-solid));
        }

        /* 卡片正面 */
        .card-front {
            background: #fff; color: #333;
            transform: rotateY(180deg);
            padding: 25px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
            text-align: center;
        }

        .crystal-img {
            width: 100%; height: 200px; border-radius: 15px;
            object-fit: cover; margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .res-name { font-size: 1.8rem; color: var(--mystic-purple); margin: 0; font-weight: 900; }
        .res-tag { 
            background: var(--mystic-purple); color: #fff; 
            padding: 4px 15px; border-radius: 20px; 
            font-size: 0.85rem; margin: 10px 0; 
        }

        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            width: 100%; margin: 10px 0;
        }
        .info-item {
            background: #f0f0f0; padding: 8px; border-radius: 10px;
            font-size: 0.75rem; color: #666;
        }
        .info-item b { display: block; color: var(--mystic-purple); font-size: 0.85rem; }

        .fortune-box {
            background: #f9f9f9; border-radius: 15px; padding: 15px;
            margin-top: 10px; font-size: 0.9rem; line-height: 1.6; color: #444;
            border-left: 4px solid var(--gold-solid);
        }

        /* 按鈕與交互 */
        .reset-btn {
            background: var(--gold); border: none; padding: 15px 40px;
            border-radius: 50px; cursor: pointer; font-weight: bold;
            color: #4a148c; margin-top: 20px; display: none;
            transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .reset-btn:hover { transform: scale(1.05); filter: brightness(1.1); }

        .nav-container {
            position: fixed; bottom: 30px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 30px; box-sizing: border-box; pointer-events: none;
        }
        .nav-group { display: flex; gap: 15px; pointer-events: auto; }
        .btn {
            padding: 12px 20px; background: rgba(255,255,255,0.15); 
            backdrop-filter: blur(5px); color: #fff;
            text-decoration: none; border-radius: 30px; font-weight: bold; font-size: 0.85rem;
            border: 1px solid var(--glass-border); transition: 0.3s;
        }
        .btn:hover { background: rgba(255,255,255,0.3); }

        @media (max-width: 480px) { .card-inner { width: 300px; height: 500px; } }
    </style>
</head>
<body>

</div>

<div class="card-stage" onclick="drawCard()">
    <div class="card-inner" id="card">
        <div class="card-face card-back"></div>
        <div class="card-face card-front">
            <img id="resImg" src="" class="crystal-img">
            <h2 id="resName" class="res-name"></h2>
            <div id="resTag" class="res-tag"></div>
            
            <div class="info-grid">
                <div class="info-item"><b>對應脈輪</b><span id="resChakra"></span></div>
                <div class="info-item"><b>開運色</b><span id="resColor"></span></div>
            </div>

            <div class="fortune-box">
                <div style="font-weight: bold; color: #d4af37; margin-bottom: 5px;" id="resLuck"></div>
                <div id="resFortune"></div>
            </div>
        </div>
    </div>
</div>

<button class="reset-btn" id="resetBtn" onclick="resetCard()">重新對應宇宙能量</button>

<div class="nav-container">
    <div class="nav-group">
        <a href="#" class="btn">⬅️ 返回</a>
        <a href="#" class="btn">🏠 首頁</a>
    </div>
    <div class="nav-group">
        <a href="#" class="btn">🔮 MBTI</a>
    </div>
</div>

        "靜坐冥想能為你帶來答案，別急著做決定。",
        "宇宙正準備送你一份驚喜，請保持開放的心態。",
        "專注於你的核心目標，其他的紛擾將會散去。",
        "這是一個修復關係的好時機，主動溝通吧。"
    ];

    document.getElementById('currentDate').innerText = new Date().toLocaleDateString() + " 星象觀測中";

    let isDrawing = false;

    function drawCard() {
        if (isDrawing) return;
        isDrawing = true;

        const crystal = crystals[Math.floor(Math.random() * crystals.length)];
        const fortune = fortuneTexts[Math.floor(Math.random() * fortuneTexts.length)];
        const starCount = Math.floor(Math.random() * 2) + 4;

        // 數據填充
        document.getElementById('resImg').src = crystal.img;
        document.getElementById('resName').innerText = crystal.name;
        document.getElementById('resTag').innerText = "✦ " + crystal.tag + " ✦";
        document.getElementById('resChakra').innerText = crystal.chakra;
        document.getElementById('resColor').innerText = crystal.color;
        document.getElementById('resLuck').innerText = "能量指數：" + "⭐".repeat(starCount);
        document.getElementById('resFortune').innerText = fortune + " " + crystal.desc;

        // 翻牌
        document.getElementById('card').classList.add('is-flipped');
        setTimeout(() => {
            document.getElementById('resetBtn').style.display = 'inline-block';
        }, 800);
    }

    function resetCard() {
        document.getElementById('card').classList.remove('is-flipped');
        document.getElementById('resetBtn').style.display = 'none';
        setTimeout(() => { isDrawing = false; }, 800);
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
