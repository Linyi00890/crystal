<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星座運勢水晶神諭 | CrystalMagic 2026</title>
    <style>
        :root {
            --gold: #d4af37;
            --mystic-purple: #4a148c;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: radial-gradient(circle at center, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* 頂部導航 */
        header { text-align: center; padding: 40px 20px 10px; }
        h1 { color: var(--gold); font-size: 1.8rem; letter-spacing: 3px; margin: 0; }
        .date-display { color: #aaa; font-size: 0.9rem; margin-top: 5px; }

        /* 星座選擇區 */
        .zodiac-selector {
            margin: 20px 0;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(212,175,55,0.3);
            text-align: center;
        }
        select {
            padding: 8px 15px;
            border-radius: 10px;
            background: #fff;
            color: #333;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        /* 3D 卡牌舞台 */
        .card-stage {
            perspective: 1200px;
            margin: 20px auto;
            cursor: pointer;
        }

        .card-inner {
            width: 300px; height: 480px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-inner.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            border: 2px solid var(--gold);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* 卡片背面 */
        .card-back {
            background: #1a1a2e;
            display: flex; align-items: center; justify-content: center;
        }
        .card-back::after {
            content: "☪️"; font-size: 80px; color: var(--gold);
            filter: drop-shadow(0 0 10px var(--gold));
        }

        /* 卡片正面 */
        .card-front {
            background: #fff; color: #333;
            transform: rotateY(180deg);
            padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
            overflow-y: auto;
        }

        .crystal-img {
            width: 180px; height: 180px; border-radius: 15px;
            object-fit: cover; border: 3px solid #f0f0f0;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .res-name { font-size: 1.5rem; color: var(--mystic-purple); font-weight: 900; margin: 0; }
        .res-tag { background: #f3e5f5; color: #7b1fa2; padding: 3px 12px; border-radius: 15px; font-size: 0.8rem; margin: 8px 0; font-weight: bold; }
        
        /* 運勢顯示區 */
        .fortune-box {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            margin-top: 10px;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #555;
        }
        .fortune-stat { display: flex; justify-content: space-between; margin-bottom: 8px; color: #4a148c; font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 5px; }

        /* 按鈕樣式 */
        .nav-container {
            position: fixed; bottom: 30px; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 25px; box-sizing: border-box;
            z-index: 1000; pointer-events: none;
        }
        .nav-group { display: flex; gap: 10px; pointer-events: auto; }
        .btn {
            padding: 10px 18px; background: var(--glass); color: var(--mystic-purple);
            text-decoration: none; border-radius: 30px; font-weight: bold; font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid #ddd;
        }
        .reset-btn {
            background: var(--gold); color: #000; border: none; padding: 12px 30px;
            border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 15px; display: none;
            box-shadow: 0 4px 15px rgba(212,175,55,0.4);
        }

        @media (max-width: 480px) { .card-inner { width: 280px; height: 460px; } }
    </style>
</head>
<body>

<header>
    <h1>今日水晶運勢抽卡</h1>
    <div class="date-display" id="currentDate"></div>
</header>

<div class="zodiac-selector">
    <label>選擇你的星座：</label>
    <select id="zodiacSelect">
        <option value="牡羊座">牡羊座</option>
        <option value="金牛座">金牛座</option>
        <option value="雙子座">雙子座</option>
        <option value="巨蟹座">巨蟹座</option>
        <option value="獅子座">獅子座</option>
        <option value="處女座">處女座</option>
        <option value="天秤座">天秤座</option>
        <option value="天蠍座">天蠍座</option>
        <option value="射手座">射手座</option>
        <option value="摩羯座">摩羯座</option>
        <option value="水瓶座">水瓶座</option>
        <option value="雙魚座">雙魚座</option>
    </select>
</div>

<div class="card-stage" onclick="drawCard()">
    <div class="card-inner" id="card">
        <div class="card-face card-back"></div>
        <div class="card-face card-front">
            <img id="resImg" src="" class="crystal-img" alt="今日水晶">
            <h2 id="resName" class="res-name"></h2>
            <div id="resTag" class="res-tag"></div>
            <div class="fortune-box">
                <div class="fortune-stat">
                    <span id="resZodiac"></span>
                    <span id="resLuck"></span>
                </div>
                <div id="resFortune"></div>
            </div>
        </div>
    </div>
</div>

<button class="reset-btn" id="resetBtn" onclick="resetCard()">重新對應能量</button>

<div class="nav-container">
    <div class="nav-group">
        <a href="quiz.html" class="btn">⬅️ 返回上一頁</a>
        <a href="index.html" class="btn">🏠 返回首頁</a>
    </div>
    <div class="nav-group">
        <a href="mbti.html" class="btn">🧠 MBTI 測驗</a>
    </div>
</div>

<script>
    // 嚴選水晶資料庫 - 使用精確的水晶圖片 ID
    const crystals = [
        { name: "紫水晶", tag: "守護直覺", img: "https://images.unsplash.com/photo-1523467136207-640bf076639e?w=500&q=80", desc: "今日直覺力強，紫水晶能幫你過濾雜訊，適合做重大決定。" },
        { name: "粉水晶", tag: "招來好緣", img: "https://images.unsplash.com/photo-1567883111025-063a43627448?w=500&q=80", desc: "柔和的能量正包圍你，今日適合修復人際關係，增加親和力。" },
        { name: "白水晶", tag: "淨化磁場", img: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500&q=80", desc: "白水晶能放大你的正向意圖，清空思緒中的雜物，重新出發。" },
        { name: "黑曜石", tag: "防小人辟邪", img: "https://images.unsplash.com/photo-1605142859862-978be7eba909?w=500&q=80", desc: "今日適合安靜行事，黑曜石會為你擋掉不必要的能量干擾。" },
        { name: "黃水晶", tag: "意外之財", img: "https://images.unsplash.com/photo-1615111784767-4d7a407d39f4?w=500&q=80", desc: "充滿陽光的一天。保持樂觀，今日在偏財運上會有小小驚喜。" },
        { name: "拉長石", tag: "靈魂轉化", img: "https://images.unsplash.com/photo-1635345155440-629f6487e908?w=500&q=80", desc: "看似平淡的事物中藏著契機，拉長石提醒你留意夢境或偶發靈感。" },
        { name: "海藍寶", tag: "平安溝通", img: "https://images.unsplash.com/photo-1615111784524-212fd05001ba?w=500&q=80", desc: "適合表達真實感受的一天。溫柔的溝通會為你贏得尊重。" },
        { name: "螢石", tag: "思緒清晰", img: "https://images.unsplash.com/photo-1599707334298-291efdec822c?w=500&q=80", desc: "大腦運作如飛的一天，螢石能輔助你專注於複雜的邏輯任務。" },
        { name: "虎眼石", tag: "勇氣力量", img: "https://images.unsplash.com/photo-1614032155370-137b02b9f874?w=500&q=80", desc: "展現自信的時刻到了。虎眼石賦予你執行力，不再猶豫不決。" }
    ];

    const fortuneTexts = [
        "今天是你能量回升的一天，適合處理懸而未決的事務。",
        "外界的干擾較多，保持內心的穩定比追求速度更重要。",
        "桃花星在閃爍，今日容易在不經意間吸引他人的目光。",
        "工作效率極高，但要注意身體的疲勞感，適度休息。",
        "這是一個適合學習與閱讀的日子，靈性層次會有所提升。"
    ];

    // 初始化日期
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString() + " 能量觀測";

    let isDrawing = false;

    function drawCard() {
        if (isDrawing) return;
        isDrawing = true;

        const zodiac = document.getElementById('zodiacSelect').value;
        const crystal = crystals[Math.floor(Math.random() * crystals.length)];
        const fortune = fortuneTexts[Math.floor(Math.random() * fortuneTexts.length)];
        const stars = "⭐".repeat(Math.floor(Math.random() * 2) + 4); // 4-5顆星

        // 注入內容
        const resImg = document.getElementById('resImg');
        resImg.src = crystal.img;
        
        // 確保圖片載入錯誤時有備用處理 (可選)
        resImg.onerror = function() {
            this.src = "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500";
        };

        document.getElementById('resName').innerText = crystal.name;
        document.getElementById('resTag').innerText = "#" + crystal.tag;
        document.getElementById('resZodiac').innerText = zodiac + " 指引";
        document.getElementById('resLuck').innerText = "幸運：" + stars;
        document.getElementById('resFortune').innerText = fortune + " " + crystal.desc;

        // 翻牌
        document.getElementById('card').classList.add('is-flipped');
        setTimeout(() => {
            document.getElementById('resetBtn').style.display = 'inline-block';
        }, 800);
    }

    function resetCard() {
        document.getElementById('card').classList.remove('is-flipped');
        document.getElementById('resetBtn').style.display = 'none';
        // 等待翻回背面的動畫結束後才允許再次點擊
        setTimeout(() => { isDrawing = false; }, 800);
    }

    // 禁用右鍵保護 (防止直接存取圖片)
    document.addEventListener('contextmenu', e => e.preventDefault());
</script>

</body>
</html>
