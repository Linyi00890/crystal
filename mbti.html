<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 MBTI 靈魂水晶譜系測驗 | CrystalMagic</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #6a1b9a;
            --accent-pink: #ce93d8;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0; padding: 0; color: #333; min-height: 100vh;
            user-select: none; -webkit-user-select: none;
        }

        /* 頂部進度條 */
        .progress-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 6px;
            background: #e0e0e0; z-index: 1000;
        }
        #progressBar {
            height: 100%; width: 0%;
            background: linear-gradient(to right, #6a1b9a, #ce93d8);
            transition: width 0.4s ease;
        }

        .container { max-width: 750px; margin: 60px auto; padding: 0 20px; padding-bottom: 100px; }

        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2.2rem; color: #4a148c; letter-spacing: 2px; }

        /* 測驗卡片 */
        .quiz-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .quiz-card.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .q-text { font-size: 1.4rem; font-weight: 700; margin-bottom: 25px; color: #2d3436; }

        .option {
            display: block; padding: 20px; margin-bottom: 15px;
            background: #fff; border: 2px solid #eee;
            border-radius: 16px; cursor: pointer; transition: 0.2s;
        }
        .option:hover { border-color: var(--accent-pink); background: #fdfbff; }
        .option.selected { border-color: var(--primary-purple); background: #f3e5f5; }
        .option input { display: none; }

        /* 結果區 */
        #resultSection { display: none; text-align: center; }
        .result-box { background: white; border-radius: 30px; padding: 50px 30px; box-shadow: var(--shadow); }
        .crystal-img { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; border: 6px solid #f3e5f5; }
        .mbti-code { font-size: 3rem; color: var(--primary-purple); font-weight: 900; margin: 0; }
        .analysis { text-align: left; background: #fafafa; padding: 20px; border-radius: 15px; margin-top: 20px; line-height: 1.8; }

        /* 左下角導覽按鈕群 */
        .bottom-nav-left {
            position: fixed; bottom: 30px; left: 20px;
            display: flex; gap: 10px; z-index: 100;
        }
        .nav-btn {
            display: flex; align-items: center; padding: 12px 18px;
            background: rgba(255, 255, 255, 0.95); border-radius: 50px;
            text-decoration: none; color: #4a148c; font-weight: bold;
            font-size: 0.9rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #f3e5f5; transition: 0.3s;
        }
        .nav-btn:hover { transform: translateY(-3px); background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.15); }

        /* 右下角按鈕 */
        .btn-card { position: fixed; right: 20px; bottom: 30px; }

    </style>
</head>
<body>

<div class="progress-container"><div id="progressBar"></div></div>

<!-- 左下角按鈕群 -->
<div class="bottom-nav-left">
    <a href="quiz.html" class="nav-btn">⬅️ 返回上一頁</a>
    <a href="index.html" class="nav-btn">🏠 回主頁</a>
</div>

<a href="card.html" class="nav-btn btn-card">🃏 每日抽卡</a>

<div class="container">
    <header><h1>靈魂水晶譜系測驗</h1></header>

    <form id="quizForm">
        <!-- Q1: E/I -->
        <div class="quiz-card active">
            <p class="q-text">當你需要放鬆時，哪種場景最吸引你？</p>
            <label class="option"><input type="radio" name="ei" value="E"> 在派對中與新朋友盡情交談 (E)</label>
            <label class="option"><input type="radio" name="ei" value="I"> 獨自在安靜的角落享受安寧 (I)</label>
            <label class="option"><input type="radio" name="ei" value="X"> 與少數知心好友在溫馨空間小聚 (中性偏I)</label>
        </div>

        <!-- Q2: S/N -->
        <div class="quiz-card">
            <p class="q-text">面對一件新事物，你首先注意到什麼？</p>
            <label class="option"><input type="radio" name="sn" value="S"> 它的材質、外觀與實際用途 (S)</label>
            <label class="option"><input type="radio" name="sn" value="N"> 它代表的意義與未來的可能性 (N)</label>
            <label class="option"><input type="radio" name="sn" value="X"> 它的設計美感與它帶給你的聯想 (中性偏N)</label>
        </div>

        <!-- Q3: T/F -->
        <div class="quiz-card">
            <p class="q-text">遇到衝突時，你更傾向於？</p>
            <label class="option"><input type="radio" name="tf" value="T"> 找出事實真相，釐清邏輯對錯 (T)</label>
            <label class="option"><input type="radio" name="tf" value="F"> 照顧每個人感受，尋求情感平衡 (F)</label>
            <label class="option"><input type="radio" name="tf" value="X"> 保持冷靜觀望，尋求雙贏的折衷方案 (中性)</label>
        </div>

        <!-- Q4: J/P -->
        <div class="quiz-card">
            <p class="q-text">你如何度過你的週末？</p>
            <label class="option"><input type="radio" name="jp" value="J"> 按照預先訂好的計劃逐一完成 (J)</label>
            <label class="option"><input type="radio" name="jp" value="P"> 睡到自然醒，看心情隨性出發 (P)</label>
            <label class="option"><input type="radio" name="jp" value="X"> 完成一半必要事項，剩下時間留白 (中性偏J)</label>
        </div>
    </form>

    <section id="resultSection">
        <div class="result-box">
            <p>你的靈魂能量代碼：</p>
            <h2 class="mbti-code" id="mbtiCode"></h2>
            <img src="" id="crystalImg" class="crystal-img">
            <h3 class="crystal-name" id="crystalName"></h3>
            <div class="analysis" id="analysisText"></div>
            <button onclick="location.reload()" style="margin-top:20px; padding: 12px 30px; border-radius: 50px; background: #4a148c; color: white; border: none; cursor: pointer;">重新測驗</button>
        </div>
    </section>
</div>

<script>
    // 20 種以上的水晶資料庫
    const crystalMaster = {
        "INTJ": { name: "拉長石", img: "https://images.unsplash.com/photo-1599707334298-291efdec822c?w=400", desc: "引發深層靈感，守護思想家的直覺。" },
        "INTP": { name: "螢石", img: "https://images.unsplash.com/photo-1599707334298-291efdec822c?w=400", desc: "梳理混亂思緒，將智慧化為結構。" },
        "ENTJ": { name: "鈦晶", img: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400", desc: "增強領導霸氣，提升決斷力與執行力。" },
        "ENTP": { name: "黃水晶", img: "https://images.unsplash.com/photo-1615111784767-4d7a407d39f4?w=400", desc: "轉化創意為財富，增強自信與說服力。" },
        "INFJ": { name: "紫水晶", img: "https://images.unsplash.com/photo-1567883111025-063a43627448?w=400", desc: "連結神聖直覺，守護高敏感的靈魂。" },
        "INFP": { name: "紫鋰輝", img: "https://images.unsplash.com/photo-1614032155370-137b02b9f874?w=400", desc: "治癒理想主義的傷痕，保持純粹能量。" },
        "ENFJ": { name: "粉水晶", img: "https://images.unsplash.com/photo-1567883111025-063a43627448?w=400", desc: "放大同理心，成為溫暖他人的光源。" },
        "ENFP": { name: "天河石", img: "https://images.unsplash.com/photo-1599707334298-291efdec822c?w=400", desc: "帶來希望與勇氣，將冒險化為好運。" },
        "ISTJ": { name: "黑曜石", img: "https://images.unsplash.com/photo-1605142859862-978be7eba909?w=400", desc: "穩固現實能量，建立堅實的防禦與秩序。" },
        "ISFJ": { name: "海藍寶", img: "https://images.unsplash.com/photo-1599707334298-291efdec822c?w=400", desc: "守護付出的能量，帶來平靜與勇氣。" },
        "ESTJ": { name: "石榴石", img: "https://images.unsplash.com/photo-1615111784767-4d7a407d39f4?w=400", desc: "注入源源不絕的體力，支持你的效率。" },
        "ESFJ": { name: "草莓晶", img: "https://images.unsplash.com/photo-1614032155370-137b02b9f874?w=400", desc: "和諧人際關係，增加親和力與吸引力。" },
        "ISTP": { name: "金曜石", img: "https://images.unsplash.com/photo-1605142859862-978be7eba909?w=400", desc: "提升觀察力與避邪，讓行動更為精準。" },
        "ISFP": { name: "月光石", img: "https://images.unsplash.com/photo-1614032155370-137b02b9f874?w=400", desc: "喚醒藝術感知，散發靜謐優雅的魅力。" },
        "ESTP": { name: "虎眼石", img: "https://images.unsplash.com/photo-1615111784767-4d7a407d39f4?w=400", desc: "獵人般的直覺，抓住當下的每一個機會。" },
        "ESFP": { name: "太陽石", img: "https://images.unsplash.com/photo-1615111784767-4d7a407d39f4?w=400", desc: "綻放舞台能量，成為快樂的永動機。" },
        // 額外隱藏水晶
        "HIDDEN_1": { name: "極光 23 (Auralite)", img: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400", desc: "多維度能量平衡，適合正處於人生轉折點的你。" },
        "HIDDEN_2": { name: "彼得石 (Pietersite)", img: "https://images.unsplash.com/photo-1605142859862-978be7eba909?w=400", desc: "暴風雨之石，掃除負能，帶來極致的覺醒。" },
        "HIDDEN_3": { name: "舒俱徠 (Sugilite)", img: "https://images.unsplash.com/photo-1567883111025-063a43627448?w=400", desc: "抗負能最強守護，保護高階靈性工作者。" },
        "HIDDEN_4": { name: "綠隕石 (Moldavite)", img: "https://images.unsplash.com/photo-1599707334298-291efdec822c?w=400", desc: "外星能量連結，加速你靈魂計畫的達成。" }
    };

    const cards = document.querySelectorAll('.quiz-card');
    const progressBar = document.getElementById('progressBar');
    let currentStep = 0;
    let scores = { ei:0, sn:0, tf:0, jp:0 };

    document.querySelectorAll('.option').forEach(opt => {
        opt.addEventListener('click', function() {
            const input = this.querySelector('input');
            const dim = input.name;
            const val = input.value;

            // 標記選中
            document.querySelectorAll(`input[name="${dim}"]`).forEach(i => i.parentElement.classList.remove('selected'));
            this.classList.add('selected');

            // 計分權重邏輯
            if (val !== 'X') scores[dim] = val; 
            else {
                // 選項三的平衡邏輯
                if (dim === 'ei') scores.ei = 'I'; 
                if (dim === 'sn') scores.sn = 'N';
                if (dim === 'tf') scores.tf = Math.random() > 0.5 ? 'T' : 'F';
                if (dim === 'jp') scores.jp = 'J';
            }

            setTimeout(() => {
                if (currentStep < cards.length - 1) {
                    cards[currentStep].classList.remove('active');
                    currentStep++;
                    cards[currentStep].classList.add('active');
                    progressBar.style.width = ((currentStep / cards.length) * 100) + "%";
                } else {
                    finishQuiz();
                }
            }, 400);
        });
    });

    function finishQuiz() {
        progressBar.style.width = "100%";
        let code = scores.ei + scores.sn + scores.tf + scores.jp;
        
        // 隨機觸發隱藏水晶 (5% 機率)
        let displayData = crystalMaster[code];
        if(Math.random() < 0.05) {
            displayData = crystalMaster["HIDDEN_" + (Math.floor(Math.random()*4)+1)];
        }

        document.getElementById('quizForm').style.display = 'none';
        document.getElementById('resultSection').style.display = 'block';
        document.getElementById('mbtiCode').innerText = code;
        document.getElementById('crystalName').innerText = displayData.name;
        document.getElementById('analysisText').innerText = displayData.desc;
        document.getElementById('crystalImg').src = displayData.img;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 安全守護
    document.addEventListener('contextmenu', e => {
        e.preventDefault();
        alert("🔮 魔法能量守護中：本站內容受保護，無法使用右鍵選單。");
    });
    document.onkeydown = function(e) {
        if (e.keyCode === 123 || (e.ctrlKey && e.keyCode === 85)) return false;
    };
</script>

</body>
</html>
