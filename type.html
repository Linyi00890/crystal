    <!-- 篩選區塊：整合了原始代碼的全部按鈕與雙下拉選單 -->
    <div class="filter-section" style="display: flex; justify-content: center; align-items: center; gap: 20px; padding: 20px; flex-wrap: wrap;">
        
        <button class="btn-all" onclick="filterCrystals('all', 'effect')" style="padding: 10px 20px; cursor: pointer;">全部水晶</button>
        
        <!-- 按功效篩選 -->
        <div class="dropdown">
            <button class="dropdown-btn" onclick="toggleDropdown('effectDropdown')">✨ 按功效 <span>▼</span></button>

            </ul>
        </div>

        <!-- 按顏色篩選 (從原始代碼補回) -->
        <div class="dropdown">
            <button class="dropdown-btn" onclick="toggleDropdown('colorDropdown')">🎨 按顏色 <span>▼</span></button>

                <li onclick="filterCrystals('black', 'color')">🖤 黑色系</li>
            </ul>
        </div>
    </div>

    <div class="crystal-grid" id="crystalGrid"></div>
